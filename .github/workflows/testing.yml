name: Testing

# The pipeline for this repository's own code.
#
# Three principles shape this file.
#
# 1. Every job invokes the same `make` target a developer runs locally. A green
#    `make all` and a green pipeline cannot mean different things. If you add a
#    check, add it to the Makefile first and call it from here — never the other
#    way round.
#
# 2. Jobs are chained with `needs:` cheapest-first, so a lint failure never
#    spends the minutes the pack-and-install matrix costs.
#
# 3. First-party actions only: actions/checkout and actions/setup-node, which
#    are the two this repository tracks with Dependabot. gitleaks and semgrep run
#    from pinned Docker images and the release is cut with the `gh` CLI, so there
#    is no third party with write access to this pipeline and no unpinned major
#    that can be hard-disabled out from under us.
#
# Nothing here needs a secret. That is deliberate and enforced by the test setup
# (tests/setup.ts bans network access), which is why pull requests from forks run
# the full suite rather than silently skipping it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned in four places that must move together: here, .nvmrc, the `engines`
  # floor in package.json, and the `target` in tsup.config.ts. A policy test
  # fails if they drift apart.
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: make install
      - run: make lint

  typecheck:
    name: Typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: make install
      - run: make typecheck

  security:
    name: Security
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: a credential that was committed and
      # later deleted is still in the history and still clonable, and a shallow
      # checkout would hide exactly that.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: make install
      - run: make security

  unit:
    name: Unit
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: make install

      # No credentials are set for this job, on purpose. The suite cannot reach
      # the network, so if it ever starts needing a secret that is a bug in a
      # test.
      - name: Run unit, command and policy tests
        run: |
          set -o pipefail
          make unit 2>&1 | tee coverage-output.txt

      # Runs even when the tests failed: when coverage is what dropped below the
      # gate, the table is the first thing you want to see, and hunting for it in
      # a collapsed step log is friction for no reason.
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo ''
            echo '```'
            sed -n '/% Coverage report/,$p' coverage-output.txt | head -60 || echo 'no coverage data'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: make install
      - run: make build
      - name: Report bundle size
        run: ls -lh dist/cli.js | awk '{print "dist/cli.js " $5}'

  # Two jobs cover "does it work everywhere we say it does", and the split is
  # forced by a real constraint rather than taste.
  #
  # vitest 5 requires Node 22 or newer. package.json promises `node >= 18`. So
  # the end-to-end suite physically cannot execute on the floor of what this CLI
  # supports — a matrix that tried failed on every Node 18 runner, and testing a
  # floor with a tool that does not run there is not testing the floor.
  #
  #   e2e     the full behavioral suite, on the versions vitest supports
  #   compat  the published tarball, on every version `engines` promises,
  #           checked by a plain ESM script with no dependencies
  #
  # Between them: rich assertions where they are possible, and a real check of
  # the promise where they are not.
  e2e:
    name: End-to-end (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor vitest runs on; 24 is the current release. Ubuntu
        # carries both, the other two platforms carry 22 — a full grid would be
        # six jobs to catch a class of bug that is almost always either
        # version-specific or platform-specific, never both.
        include:
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --project e2e

  compat:
    name: Compat (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every version `engines` promises: the floor, the active LTS, and the
        # current release. If one of these breaks, a user finds out here rather
        # than in an issue.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      # Built on a modern Node, then run on the target version. That is exactly
      # how the package reaches a user — compiled once by us, executed on
      # whatever they happen to have — and it is why the build toolchain needing
      # Node 22 does not constrain what the CLI itself supports.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the tarball
        shell: bash
        run: |
          echo "TARBALL=$(npm pack --silent)" >> "$GITHUB_ENV"

      - name: Switch to Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install the tarball and exercise it
        shell: bash
        run: node scripts/compat-check.mjs "$TARBALL"

  smoke:
    name: Smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: make install
      - run: make smoke
