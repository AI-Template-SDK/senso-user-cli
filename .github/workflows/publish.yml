name: Publish to npm

# Triggered by pushing a version tag, e.g.:
#   npm version minor
#   git push --follow-tags
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Configure on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions
#   org: AI-Template-SDK, repo: senso-user-cli, workflow: publish.yml

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # prepublishOnly runs the build
      - name: Publish
        run: npm publish --access public
