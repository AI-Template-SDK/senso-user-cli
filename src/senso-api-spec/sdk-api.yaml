          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/members:
    get:
      tags: [Members]
      summary: List members
      description: >-
        Returns one page of your organization's members — the people with access — with
        their role.
      operationId: orgListMembers
      parameters:
        - name: limit
          in: query
          description: Page size, 1–1000 (default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Number of rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          description: Free-text filter on member name or email.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order.
          schema:
            type: string
            enum: [name_asc, name_desc, email_asc, email_desc, created_asc, created_desc]
            default: name_asc
      responses:
        "200":
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMemberListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Organization Users — /org/users
  # ──────────────────────────────────────────────
  /org/users:
    get:
      tags: [Users]
      summary: List organization users
      description: Returns the user-membership records for your organization, paged.
      operationId: orgListUsers
      parameters:
        - name: limit
          in: query
          description: Page size (default 10).
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The organization's user memberships.
          content:
            application/json:
