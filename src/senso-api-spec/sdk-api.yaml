  # ──────────────────────────────────────────────
  # Content Generation — /org/content-generation
  # ──────────────────────────────────────────────
  /org/content-generation:
    get:
      tags: [Content Generation]
      summary: Get content-generation settings
      description: Returns the organization's content-generation settings. Requires the GEO product.
      operationId: orgGetContentGenerationSettings
      responses:
        "200":
          description: The content-generation settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Content Generation]
      summary: Update content-generation settings
      description: >-
        Partially updates the organization's content-generation settings and returns the
        updated settings. Enabling auto-publish requires at least one configured publisher
        (`422` otherwise). Requires the GEO product.
      operationId: orgUpdateContentGenerationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentGenerationSettingsRequest"
            example:
              enable_content_generation: true
              content_schedule: [1, 3, 5]
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationSettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /org/content-generation/job-context:
    get:
      tags: [Content Generation]
      summary: Get the generation job context
      description: >-
        Returns the prompts eligible for the next generation run and a queue summary
        (which prompts create new content vs. update existing). Requires the GEO product.
      operationId: orgGetContentGenerationJobContext
      responses:
        "200":
          description: The generation job context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgJobContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content-generation/runs:
    get:
      tags: [Content Generation]
      summary: List content-generation runs
      description: >-
        Returns your organization's content-generation runs, newest first. Requires the
        GEO product.
      operationId: orgListContentGenerationRuns
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of runs to return. Defaults to 20. A non-numeric or
            non-positive value is ignored and the default is used.
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          description: >-
            Number of runs to skip. Defaults to 0. A non-numeric or negative value is
            ignored and the default is used.
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          required: false
          description: >-
            Filter by run status (see the run's `status` field for the values). The
            value is not validated — an unknown status simply matches no runs.
          schema:
            type: string
        - name: trigger_mode
          in: query
          required: false
          description: Filter by trigger mode (`manual` or `scheduled`).
          schema:
            type: string
        - name: active_only
          in: query
          required: false
          description: When `true`, return only runs that are still active. A non-boolean value is a `400`.
          schema:
            type: boolean
        - name: start_date
          in: query
          required: false
          description: >-
            Only runs created at or after this time. RFC 3339 or `YYYY-MM-DD`; anything
            else is a `400`.
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          description: >-
            Only runs created at or before this time. RFC 3339 or `YYYY-MM-DD`; anything
            else is a `400`.
          schema:
            type: string
        - name: run_group_id
          in: query
          required: false
          description: Filter to the runs of one bulk-trigger run group.
          schema:
            type: string
            format: uuid
        - name: selection_source
          in: query
          required: false
          description: Filter by how the run's content type was selected (`run_override`, `org_default`, or `generic_fallback`).
          schema:
            type: string
        - name: content_type_id
          in: query
          required: false
          description: Filter to runs that used this content type.
          schema:
            type: string
            format: uuid
        - name: actor_type
          in: query
          required: false
          description: Filter by the actor kind that triggered the run (e.g. `user`, `api_key`, `system`, `scheduled_job`).
          schema:
            type: string
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationRunListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/content-generation/runs/{run_id}:
    get:
      tags: [Content Generation]
      summary: Get a content-generation run
      description: >-
        Returns one run's status and counters — how many prompts resolved, and how many
        items are pending, running, succeeded, failed, skipped, or stopped. Requires the
        GEO product.
      operationId: orgGetContentGenerationRun
      parameters:
        - $ref: "#/components/parameters/ContentGenerationRunID"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationRunDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content-generation/runs/{run_id}/items:
    get:
      tags: [Content Generation]
      summary: List a run's items
      description: >-
        Returns the run's individual work items — one per prompt — with each item's
        outcome and the content it produced. Requires the GEO product.
      operationId: orgListContentGenerationRunItems
      parameters:
        - $ref: "#/components/parameters/ContentGenerationRunID"
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of items to return. Defaults to 100. A non-numeric or
            non-positive value is ignored and the default is used.
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: >-
            Number of items to skip. Defaults to 0. A non-numeric or negative value is
            ignored and the default is used.
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          required: false
          description: Filter items by status. An unknown value is a `400`.
          schema:
            type: string
            enum: [pending, running, succeeded, failed, skipped, stopped]
      responses:
        "200":
          description: One page of the run's items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationRunItemsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content-generation/runs/{run_id}/logs:
    get:
      tags: [Content Generation]
      summary: List a run's logs
      description: >-
        Returns the run's log entries, useful for following how content was generated.
        Requires the GEO product.
      operationId: orgListContentGenerationRunLogs
      parameters:
        - $ref: "#/components/parameters/ContentGenerationRunID"
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of log entries to return. Defaults to 100. A non-numeric or
            non-positive value is ignored and the default is used.
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: >-
            Number of log entries to skip. Defaults to 0. A non-numeric or negative
            value is ignored and the default is used.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: One page of the run's logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationRunLogsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content-generation/sample-jobs/{sample_job_id}:
    get:
      tags: [Content Generation]
      summary: Get a sample generation job
      description: >-
        Polls an async sample-generation job (submitted via
        `POST /org/content-generation/sample`). A `completed` job carries the generated
        content in `result`; a `failed` job carries a safe `error` summary. Requires
        the GEO product.
      operationId: orgGetContentGenerationSampleJob
      parameters:
        - name: sample_job_id
          in: path
          required: true
          description: The sample job's id, returned when the job was submitted.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The sample job's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationSampleJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Content Engine — /org/content-engine, /org/publish-records
  # ──────────────────────────────────────────────
  /org/content-engine/publish:
    post:
      tags: [Content Engine]
      summary: Publish generated content
      description: >-
        Publishes generated markdown as a content item to the org's destinations. Returns
        `201` when the content is created/published, or `200` when the content is created
        but publishing to the destinations failed (inspect `publish_status` and
        `publish_destinations`). Requires the GEO product.
      operationId: orgPublishContentEngine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentEnginePublishRequest"
            example:
              geo_question_id: 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
              raw_markdown: "# Current mortgage rates\n\nThe 30-year fixed rate is 6.5%."
              seo_title: Current mortgage rates
      responses:
        "200":
          description: Content created, but publishing to one or more destinations failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentEnginePublishResponse"
        "201":
          description: Content created and published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentEnginePublishResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"

  /org/publish-records/{id}/retry:
    post:
      tags: [Content Engine]
      summary: Retry a failed publish
      description: >-
        Retries a single failed publish record (synchronous). The record must be in a
        retryable (failed) state (`409` otherwise). Requires the GEO product.
      operationId: orgRetryPublishRecord
      parameters:
        - name: id
          in: path
          required: true
          description: The publish record's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The publish was retried successfully. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ──────────────────────────────────────────────
  # Brand Kit — /org/brand-kit
  # ──────────────────────────────────────────────
  /org/brand-kit:
    get:
      tags: [Brand Kit]
      summary: Get the brand kit
      description: >-
        Returns the organization's brand kit, or `404` if no brand kit has been created
        for the organization yet. Requires the GEO product.
      operationId: orgGetBrandKit
      responses:
        "200":
          description: The organization's brand kit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Brand Kit]
      summary: Create or replace the brand kit
      description: >-
        Creates or fully replaces the organization's brand kit guidelines: the stored
        document becomes exactly the `guidelines` object you send, so any field you omit
        is removed. `guidelines` is a closed object — unknown fields are rejected with
        `400`, and no field may be `null`. An empty object (`{}`) is accepted. Requires
        the GEO product.
      operationId: orgUpsertBrandKit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBrandKitRequest"
            example:
              guidelines:
                brand_name: Acme Analytics
                brand_domain: https://acme-analytics.com
                brand_description: Acme Analytics is a self-serve product analytics platform for B2B SaaS teams.
                voice_and_tone: Plainspoken and concrete. Prefers short sentences and real numbers; avoids hype words like "revolutionary".
                author_persona: A former data engineer turned product manager who writes from hands-on experience.
                global_writing_rules:
                  - Prefer concrete examples over abstract claims.
                  - Avoid superlatives unless backed by a cited number.
      responses:
        "200":
          description: The saved brand kit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Brand Kit]
      summary: Update brand kit fields
      description: >-
        Shallow-merges the provided `guidelines` fields into the stored document: each
        field you send replaces that stored field, and fields you omit are kept. At
        least one field is required (`400` otherwise). Fields cannot be set to `null` —
        to remove a field, `PUT` the full document without it. Requires the GEO product.
      operationId: orgPatchBrandKit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBrandKitRequest"
            example:
              guidelines:
                voice_and_tone: Plainspoken and concrete. Prefers short sentences and real numbers; avoids hype words like "revolutionary".
      responses:
        "200":
          description: The brand kit after the merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────────
  # Website Import — /org/website-import
  # ──────────────────────────────────────────────
  /org/website-import:
    post:
      tags: [Website Import]
      summary: Import your website
      description: >-
        Starts an import of your organization's website: it fetches your home page plus
        up to 10 pages linked from it, ingests each one into your knowledge base as a
        document under a folder named `Website`, and generates a brand kit from what it
        read if your organization does not have one yet. A brand kit that already has
        content is never overwritten — the import still runs, and reports
        `brand_kit_generated: false` with `brand_kit_skip_reason: already_populated`.


        The site imported is the website on file for your organization, not a value you
        pass — this request takes no body. When several websites are on file, the most
        recently added one is used; see `GET /org/me` for the current list and
        `PUT /org/me` to change it. With no usable website on file the call returns `422`.


        Returns immediately with a run to poll — the import itself continues in the
        background and typically finishes within a minute. Only one import can be in
        flight per organization: triggering while one is running returns `409` carrying
        that run, so a duplicate call becomes "poll this one" rather than an error.
        Requires the GEO product.
      operationId: orgTriggerWebsiteImport
      responses:
        "202":
          description: The import was accepted and is now running. Poll the status endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteImportRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            An import is already running for this organization. `current` is that run —
            poll it rather than retrying the trigger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteImportConflictResponse"
        "422":
          description: >-
            No usable website is on file for this organization. Set one with
            `PUT /org/me` and trigger again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteImportErrorResponse"
              example:
                status: 422
                message: No website on file for this organization
                error_code: NO_WEBSITE
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/website-import/status:
    get:
      tags: [Website Import]
      summary: Get website import status
      description: >-
        Returns your organization's in-flight import as `current` and its most recently
        finished import as `latest_completed`. Both are independently `null`: an
        organization that has never imported has neither, one mid-import has `current`
        set, and one that has finished has only `latest_completed`.


        `current` only ever holds a `queued` or `running` import. When an import ends it
        leaves `current` and appears as `latest_completed`, so read the outcome — success
        and failure alike — from `latest_completed` and check its `status`. Poll while
        `current` is non-null. Requires the GEO product.
      operationId: orgGetWebsiteImportStatus
      responses:
        "200":
          description: The organization's current and most recently finished imports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteImportStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ──────────────────────────────────────────────
  # Content Types — /org/content-types
  # ──────────────────────────────────────────────
  /org/content-types:
    get:
      tags: [Content Types]
      summary: List content types
      description: >-
        Returns the organization's content types, newest first. Requires the GEO product.
      operationId: orgListContentTypes
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of content types to return. Defaults to 50; there is no upper
            cap. A non-numeric or non-positive value is ignored and the default is used.
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          description: >-
            Number of content types to skip. Defaults to 0. A non-numeric or negative
            value is ignored and the default is used.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: The organization's content types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTypeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Content Types]
      summary: Create a content type
      description: >-
        Creates a content type. `name` must be unique within the organization (`409`
        otherwise); leading/trailing whitespace is trimmed. The server canonicalizes
        `config` before storing it — see the `config` schema for what a stored config
        looks like versus what you send. Requires the GEO product.
      operationId: orgCreateContentType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentTypeRequest"
            example:
              name: FAQ Article
              config:
                template: "# Overview\nExplain the topic in plain language. (100-150 words)\n\n# Details\nCover the specifics with concrete numbers. (300-500 words)"
                cta_text: Book a demo
                cta_destination: https://acme-analytics.com/demo
                writing_rules:
                  - Prefer concrete examples over abstract claims.
      responses:
        "201":
          description: The created content type, with its canonicalized `config`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/content-types/{id}:
    get:
      tags: [Content Types]
      summary: Get a content type
      description: Returns one content type by id. Requires the GEO product.
      operationId: orgGetContentType
      parameters:
        - $ref: "#/components/parameters/ContentTypeID"
      responses:
        "200":
          description: The content type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Content Types]
      summary: Replace a content type
      description: >-
        Fully replaces a content type's `name` and `config` (both required). Renaming to
        a name another content type already uses is a `409`. The stored `config` becomes
        the canonicalized form of what you send. Requires the GEO product.
      operationId: orgUpdateContentType
      parameters:
        - $ref: "#/components/parameters/ContentTypeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentTypeRequest"
            example:
              name: FAQ Article
              config:
                template: "# Overview\nExplain the topic in plain language. (100-150 words)"
                cta_text: Start a free trial
                cta_destination: https://acme-analytics.com/trial
                writing_rules:
                  - Avoid superlatives unless backed by a cited number.
      responses:
        "200":
          description: The updated content type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      tags: [Content Types]
      summary: Update content type fields
      description: >-
        Partially updates a content type. At least one of `name` or `config` is required
        (`400` otherwise). A provided `config` must itself be a valid config fragment; it
        is shallow-merged into the stored config (each top-level field you send replaces
        that stored field, omitted fields are kept) and the result is re-canonicalized —
        so patching `template` also regenerates `template_spec`. Renaming to a name
        another content type already uses is a `409`. Requires the GEO product.
      operationId: orgPatchContentType
      parameters:
        - $ref: "#/components/parameters/ContentTypeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchContentTypeRequest"
            example:
              config:
                cta_text: Start a free trial
      responses:
        "200":
          description: The content type after the merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Content Types]
      summary: Delete a content type
      description: >-
        Deletes a content type. If it was the organization's selected default for
        content generation (`selected_content_type_id` in the content-generation
        settings), that selection is cleared. Requires the GEO product.
      operationId: orgDeleteContentType
      parameters:
        - $ref: "#/components/parameters/ContentTypeID"
      responses:
        "204":
          description: The content type was deleted. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Run Configuration — /org/run-schedule
  # ──────────────────────────────────────────────
  /org/run-schedule:
    get:
      tags: [Run Configuration]
      summary: Get the run schedule
      description: >-
        Returns the weekdays on which your organization's question runs are scheduled
        (0 = Sunday … 6 = Saturday). Content-generation runs have their own schedule
        (`GET /org/content-generation`). Requires the GEO product.
      operationId: orgGetRunSchedule
      responses:
        "200":
          description: The organization's run schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRunScheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Run Configuration]
      summary: Set the run schedule
      description: >-
        Replaces the organization's question-run schedule with the given set of weekdays
        (0 = Sunday … 6 = Saturday) and returns the updated schedule. Content-generation
        runs are scheduled separately (`PATCH /org/content-generation`).
      operationId: orgSetRunSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule]
              properties:
                schedule:
                  type: array
                  description: Weekdays to run on, 0 = Sunday … 6 = Saturday.
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
            example:
              schedule: [1, 3, 5]
      responses:
        "200":
          description: The updated run schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRunScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Product Lines — /org/product-lines
  # ──────────────────────────────────────────────
  /org/product-lines:
    get:
      tags: [Product Lines]
      summary: List product lines
      description: >-
        Returns one page of your organization's product lines, newest first. Requires the
        GEO product.
      operationId: orgListProductLines
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of product lines to return. Defaults to 50, with no upper
            cap. A non-numeric or non-positive value is ignored and the default is used.
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          description: >-
            Number of product lines to skip. Defaults to 0. A non-numeric or negative
            value is ignored and the default is used.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: One page of product lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLineListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Product Lines]
      summary: Create a product line
      description: >-
        Creates a product line. `name` is trimmed and must be unique among your
        organization's product lines (case-sensitive; a deleted product line's name can
        be reused). `details` is an open JSON object for whatever metadata your
        workflows need — omit it to start with `{}`; an explicit `null` or any non-object
        JSON is rejected. Requires the GEO product.
      operationId: orgCreateProductLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductLineRequest"
            example:
              name: Enterprise Platform
              details:
                positioning: Flagship offering for mid-market and enterprise
                url: https://example.com/products/platform
      responses:
        "201":
          description: The created product line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLineResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/product-lines/{id}:
    get:
      tags: [Product Lines]
      summary: Get a product line
      operationId: orgGetProductLine
      description: Returns one product line. Requires the GEO product.
      parameters:
        - $ref: "#/components/parameters/ProductLineID"
      responses:
        "200":
          description: The product line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLineResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Product Lines]
      summary: Replace a product line
      description: >-
        Full replacement of the product line's name and details. **Omitting `details`
        resets it to `{}`** — this is a replace, not a merge; use `PATCH` to update
        fields selectively. Renaming to a name another active product line holds is a
        `409` (renaming to the current name is fine). Requires the GEO product.
      operationId: orgUpdateProductLine
      parameters:
        - $ref: "#/components/parameters/ProductLineID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductLineRequest"
            example:
              name: Enterprise Platform
              details:
                positioning: Flagship offering for mid-market and enterprise
                tiers: [Growth, Scale, Enterprise]
      responses:
        "200":
          description: The updated product line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLineResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      tags: [Product Lines]
      summary: Partially update a product line
      description: >-
        Updates only the provided fields; at least one of `name` or `details` is
        required. A `details` patch is a shallow merge: each top-level key you send
        replaces that key on the stored object, other keys are left unchanged, and keys
        cannot be removed (set a key's value to `null` to blank it). The patch itself
        must be a JSON object. Renaming to a name another active product line holds is a
        `409` (renaming to the current name is fine). Requires the GEO product.
      operationId: orgPatchProductLine
      parameters:
        - $ref: "#/components/parameters/ProductLineID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProductLineRequest"
            example:
              details:
                positioning: Now aimed squarely at the enterprise
      responses:
        "200":
          description: The updated product line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLineResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Product Lines]
      summary: Delete a product line
      description: >-
        Deletes the product line. Its name immediately becomes available for reuse.
        Requires the GEO product.
      operationId: orgDeleteProductLine
      parameters:
        - $ref: "#/components/parameters/ProductLineID"
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Tracked Competitors — /org/competitors
  # ──────────────────────────────────────────────
  /org/competitors:
    get:
      tags: [Tracked Competitors]
      summary: List tracked competitors
      description: Returns all competitor brands your organization tracks.
      operationId: orgListCompetitors
      responses:
        "200":
          description: The tracked competitors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tracked Competitors]
      summary: Add a tracked competitor
      description: >-
        Adds a competitor brand to your organization's tracked set. An organization can
        track at most 50 competitors.
      operationId: orgCreateCompetitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorRequest"
            example:
              name: Acme Corp
              url: https://acme.example.com
      responses:
        "201":
          description: The created competitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/competitors/batch:
    post:
      tags: [Tracked Competitors]
      summary: Batch-create tracked competitors
      description: >-
        Creates up to 50 competitors in one call. Used by the suggestion-accept flow to
        record each entry's `source`, `rationale`, and `confidence`. The batch is
        best-effort, bounded by the organization's 50-competitor cap: entries beyond the
        remaining capacity are dropped, an entry whose name is already tracked
        (case-insensitive) returns the existing competitor unchanged, and blank names are
        skipped — so the response can be shorter than the request and can contain rows
        that were not newly created.
      operationId: orgBatchCreateCompetitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorBatchRequest"
            example:
              items:
                - name: Acme Corp
                  url: https://acme.example.com
                  source: suggested_web_search
                  rationale: Frequently cited alongside you in comparison answers.
                  confidence: 0.82
      responses:
        "201":
          description: The created (or already-tracked) competitors, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorListResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/competitors/suggest:
    post:
      tags: [Tracked Competitors]
      summary: Suggest competitors
      description: >-
        Generates AI competitor suggestions seeded from your organization's recent
        prompt-run text or a web search. Takes no request body.
      operationId: orgSuggestCompetitors
      responses:
        "200":
          description: The generated suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestCompetitorsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/competitors/{competitorId}:
    put:
      tags: [Tracked Competitors]
      summary: Update a tracked competitor
      description: >-
        Replaces the competitor's name and URL. `name` is required; if `url` is
        omitted, the competitor's existing URL is cleared.
      operationId: orgUpdateCompetitor
      parameters:
        - name: competitorId
          in: path
          required: true
          description: The competitor's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorRequest"
            example:
              name: Acme Corporation
              url: https://acme.example.com
      responses:
        "200":
          description: The updated competitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Tracked Competitors]
      summary: Delete a tracked competitor
      description: Removes a competitor from your organization's tracked set.
      operationId: orgDeleteCompetitor
      parameters:
        - name: competitorId
          in: path
          required: true
          description: The competitor's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ──────────────────────────────────────────────
  # Tracked Sources — /org/tracked-sources
  # ──────────────────────────────────────────────
  /org/tracked-sources:
    get:
      tags: [Tracked Sources]
      summary: List tracked sources
      description: >-
        Returns one page of your organization's citation-classification rules, plus
        the total row count for the same filter.
      operationId: orgListTrackedSources
      parameters:
        - name: limit
          in: query
          description: Page size, 1–100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          description: >-
            Free-text substring filter on the rule's `pattern`. The term is lowercased
            with the scheme, a leading `www.`, and any trailing slash stripped, so
            pasting a full URL matches the stored host. Subdomains stay searchable — it
            is not collapsed to a base domain.
          schema:
            type: string
      responses:
        "200":
          description: One page of tracked sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedSourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tracked Sources]
      summary: Create a tracked source
      description: >-
        Adds a citation-classification rule. `pattern` is normalized to a canonical
        form before storage (a `domain` to its eTLD+1, a `host` to its hostname), and
        `category` is only retained for the `tracked` tier. New rules are always
        `active` with `source_origin: manual`.
      operationId: orgCreateTrackedSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackedSourceRequest"
            example:
              pattern: blog.acme.com
              match_type: host
              tier: tracked
              category: published_content
              label: Company Blog
      responses:
        "201":
          description: The created tracked source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedSourceResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/tracked-sources/{sourceId}:
    put:
      tags: [Tracked Sources]
      summary: Update a tracked source
      description: >-
        Updates a rule. `pattern`, `match_type`, and `tier` are always replaced;
        `label` and `category` are cleared when omitted; `priority` and `active` keep
        their current values when omitted. For rules created from published content
        (`source_origin: published`), only the `active` toggle is applied — every
        other field in the body is ignored.
      operationId: orgUpdateTrackedSource
      parameters:
        - name: sourceId
          in: path
          required: true
          description: The tracked source's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackedSourceRequest"
            example:
              pattern: blog.acme.com
              match_type: host
              tier: tracked
              category: published_content
              active: true
      responses:
        "200":
          description: The updated tracked source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedSourceResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Tracked Sources]
      summary: Delete a tracked source
      description: >-
        Permanently removes a rule. Rules created from published content
        (`source_origin: published`) cannot be deleted — deactivate them with a
        `PUT` (`active: false`) instead.
      operationId: orgDeleteTrackedSource
      parameters:
        - name: sourceId
          in: path
          required: true
          description: The tracked source's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ──────────────────────────────────────────────
  # Analytics — /org/analytics
  # ──────────────────────────────────────────────
  /org/analytics/glossary:
    get:
      tags: [Analytics]
      summary: Metric glossary
      description: >-
        The canonical definition of every metric this API emits — each with its
        denominator and, where applicable, the gotcha that most often trips callers up.
        Call it once so an agent stops inventing denominators. Static; requires the GEO
        product.
      operationId: orgGetAnalyticsGlossary
      responses:
        "200":
          description: The metric glossary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/filters:
    get:
      tags: [Analytics]
      summary: Available filter values
      description: >-
        The models, locations, prompt types, tags, and tracked competitors that
        actually have data for your organization, plus the date range your data spans.
        Use it so an agent never guesses a model spelling or queries an empty window.
        Requires the GEO product.
      operationId: orgGetAnalyticsFilters
      responses:
        "200":
          description: The filter values valid for this organization's data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAnalyticsFiltersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/summary:
    get:
      tags: [Analytics]
      summary: Headline analytics summary
      description: >-
        One-call dashboard: every headline metric with the additive counts behind it,
        the preceding equal-length window, and the window-over-window deltas. Requires
        the GEO product.
      operationId: orgGetAnalyticsSummary
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - $ref: "#/components/parameters/AnalyticsTag"
      responses:
        "200":
          description: The summary dashboard for the effective window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAnalyticsSummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/mentions:
    get:
      tags: [Analytics]
      summary: Visibility time series
      description: >-
        Mention volume, Share of Voice, average rank, and sentiment over the window,
        bucketed by day or week, with the window totals alongside. Requires the GEO
        product.
      operationId: orgGetAnalyticsMentions
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - $ref: "#/components/parameters/AnalyticsTag"
        - $ref: "#/components/parameters/AnalyticsGroupBy"
      responses:
        "200":
          description: The visibility series with window totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMentionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/citations:
    get:
      tags: [Analytics]
      summary: Citation time series
      description: >-
        Citation counts at both grains (answers and instances) with the per-tier rates
        (÷D) and shares (÷S) over the window, bucketed by day or week. Requires the GEO
        product.
      operationId: orgGetAnalyticsCitations
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - $ref: "#/components/parameters/AnalyticsTag"
        - $ref: "#/components/parameters/AnalyticsGroupBy"
      responses:
        "200":
          description: The citation series with window totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCitationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/citations/domains:
    get:
      tags: [Analytics]
      summary: Cited domains
      description: >-
        The cited-domain landscape for the window: each domain's tier, its Citation
        Coverage (÷D) and Citation Share (÷S), and its rank by citations. Paged.
        Requires the GEO product.
      operationId: orgGetAnalyticsCitationDomains
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - name: tag
          in: query
          description: >-
            Restrict to prompts carrying this tag name. Domain-grain citation data is not
            broken out by prompt, so this filter cannot narrow these rows — pass it and the
            result still covers all prompts, and the response says so in `notes[]`.
          schema:
            type: string
        - $ref: "#/components/parameters/AnalyticsTier"
        - name: sort
          in: query
          description: Sort order for the domains.
          schema:
            type: string
            enum: [citations, coverage]
            default: citations
        - name: domain_contains
          in: query
          description: Restrict to domains containing this substring.
          schema:
            type: string
        - $ref: "#/components/parameters/AnalyticsLimit"
        - $ref: "#/components/parameters/AnalyticsOffset"
      responses:
        "200":
          description: The paged cited-domain landscape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCitationDomainsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/citations/pages:
    get:
      tags: [Analytics]
      summary: Cited pages
      description: >-
        The URL-grain citation table for the window — each cited page's tier, Coverage,
        Share, and the top prompts driving its citations. Paged. Requires the GEO
        product.
      operationId: orgGetAnalyticsCitationPages
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - name: tag
          in: query
          description: >-
            Restrict to prompts carrying this tag name. Page-grain citation data is not
            broken out by prompt, so this filter cannot narrow these rows — pass it and the
            result still covers all prompts, exactly as on
            `GET /org/analytics/citations/domains`.
          schema:
            type: string
        - $ref: "#/components/parameters/AnalyticsTier"
        - name: sort
          in: query
          description: Sort order for the pages.
          schema:
            type: string
            enum: [citations, coverage]
            default: citations
        - name: domain
          in: query
          description: Restrict to pages on this exact domain.
          schema:
            type: string
        - name: domain_contains
          in: query
          description: Restrict to pages whose domain contains this substring.
          schema:
            type: string
        - name: url_contains
          in: query
          description: Restrict to pages whose URL contains this substring.
          schema:
            type: string
        - $ref: "#/components/parameters/AnalyticsLimit"
        - $ref: "#/components/parameters/AnalyticsOffset"
      responses:
        "200":
          description: The paged cited-page table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCitationPagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/prompts:
    get:
      tags: [Analytics]
      summary: Per-prompt performance
      description: >-
        Each tracking prompt's window performance — mention rate, Share of Voice,
        average rank, primary citation rate, and a snapshot of its latest answers.
        Sortable to surface the prompts where you are invisible. Paged. Requires the
        GEO product.
      operationId: orgGetAnalyticsPrompts
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - $ref: "#/components/parameters/AnalyticsTag"
        - name: search
          in: query
          description: Restrict to prompts whose text contains this substring.
          schema:
            type: string
        - name: sort
          in: query
          description: Metric to sort the prompts by.
          schema:
            type: string
            enum: [mention_rate, share_of_voice, citations, answered, text]
            default: mention_rate
        - name: order
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: "#/components/parameters/AnalyticsLimit"
        - $ref: "#/components/parameters/AnalyticsOffset"
      responses:
        "200":
          description: The paged per-prompt performance table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPromptPerformanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/analytics/prompts/{promptId}:
    get:
      tags: [Analytics]
      summary: Prompt detail
      description: >-
        One prompt end to end — its metric history over the window plus, unless
        suppressed, the latest full answers from every model × location. Requires the
        GEO product.
      operationId: orgGetAnalyticsPromptDetail
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - $ref: "#/components/parameters/AnalyticsTag"
        - name: include_answers
          in: query
          description: Whether to include the latest full answers. Defaults to true.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: The prompt's history and latest answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAnalyticsPromptDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/analytics/answers/latest:
    get:
      tags: [Analytics]
      summary: Latest raw answers
      description: >-
        The most recent stored answer per prompt × model × location, with full
        response text, citations, and competitor mentions. There is no date window —
        this is a snapshot of the newest answer of each combination by construction, so
        `from`/`to` filter on each answer's collection time and hide combinations whose
        latest answer falls outside the range rather than returning older ones. Paged.
        Requires the GEO product.
      operationId: orgGetAnalyticsLatestAnswers
      parameters:
        - $ref: "#/components/parameters/AnalyticsModels"
        - $ref: "#/components/parameters/AnalyticsLocation"
        - $ref: "#/components/parameters/AnalyticsPromptType"
        - $ref: "#/components/parameters/AnalyticsTag"
        - name: from
          in: query
          description: >-
            Only include answers whose collection time (`run_at`) falls on or after this
            day (YYYY-MM-DD). Omit for no lower bound — no default window is applied on
            this endpoint.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: >-
            Only include answers whose collection time (`run_at`) falls on or before this
            day (YYYY-MM-DD). Omit for no upper bound.
          schema:
            type: string
            format: date
        - name: mentioned
          in: query
          description: Restrict to answers that did (true) or did not (false) mention your brand.
          schema:
            type: boolean
        - name: cited
          in: query
          description: Restrict to answers that did (true) or did not (false) carry any citation.
          schema:
            type: boolean
        - name: citation_tier
          in: query
          description: Restrict to answers carrying a citation of this tier.
          schema:
            $ref: "#/components/schemas/CitationTier"
        - name: limit
          in: query
          description: Page size, 1–100 (default 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/AnalyticsOffset"
      responses:
        "200":
          description: The paged latest-answer feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgLatestAnswersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────────
  # Content Engine — /org/content-engine
  # ──────────────────────────────────────────────
  /org/content-engine/draft:
    post:
      tags: [Content Engine]
      summary: Save a content draft
      description: >-
        Saves generated markdown as a draft content version for editorial review,
        tracing it back to the prompt (and optionally the generation receipt) it came
        from. The builder-workspace pair (`builder_workspace_id` +
        `expected_workspace_version_id`) requires user (dashboard) authentication and is
        rejected with `400` on API-key requests. Requires the GEO product.
      operationId: orgContentEngineSaveDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentEngineDraftRequest"
            example:
              geo_question_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              raw_markdown: "# Mortgage rates\n\nCurrent rates are..."
              seo_title: Current Mortgage Rates
      responses:
        "201":
          description: The saved draft's content and version identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentEngineDraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ──────────────────────────────────────────────
  # Builder — /org/content/{id}/edit-events
  # ──────────────────────────────────────────────
  /org/content/{id}/edit-events/bulk:
    post:
      tags: [Builder]
      summary: Record builder edit-telemetry events
      description: >-
        Bulk-records edit-telemetry events for a piece of content. Events with a
        repeated `client_event_id` (org-wide) are skipped and counted as duplicates.
        Events are processed in order — on the first invalid event the request fails
        and earlier events remain recorded. Returns how many were inserted versus
        skipped. Requires the GEO product.
      operationId: orgBulkCreateEditTelemetry
      parameters:
        - name: id
          in: path
          required: true
          description: The content id the events belong to.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkBuilderEditTelemetryRequest"
            example:
              events:
                - event_type: ai_patch_accepted
                  edit_source: ai
                  client_event_id: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Counts of inserted and duplicate (skipped) events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkBuilderEditTelemetryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Destinations — /org/destinations
  # ──────────────────────────────────────────────
  /org/destinations:
    get:
      tags: [Destinations]
      summary: List publishing destinations
      description: >-
        Returns the destinations available to your organization — the shared destinations
        plus any your org registered — each with its live-content count, last publish time,
        and whether it is currently selected for content generation. Requires the GEO
        product.
      operationId: orgListDestinations
      responses:
        "200":
          description: The organization's available destinations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDestinationsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Destinations]
      summary: Register a custom destination
      description: >-
        Registers a custom `citeables` domain as a publishing destination for your
        organization and selects it for generation. Only `type: citeables` is supported.
        If your org already has a destination for the same domain, that existing
        destination is returned (with `200`) instead of creating a duplicate.
      operationId: orgAddDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrgDestinationRequest"
            example:
              type: citeables
              name: Company Blog
              domain: blog.example.com
      responses:
        "200":
          description: The existing destination for this domain (idempotent reuse).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDestinationResponse"
        "201":
          description: The newly registered destination (stats fields start at zero/absent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDestinationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
          $ref: "#/components/responses/BadGateway"

  /org/destinations/{publisherId}/remove:
    post:
      tags: [Destinations]
      summary: Remove a publishing destination from the org
      description: >-
        Removes a destination assignment from the organization, choosing what to
        do with content already published there via `action`.
      operationId: orgRemoveDestination
      parameters:
        - name: publisherId
          in: path
          required: true
          description: The destination (publisher) id to remove.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveOrgDestinationRequest"
            example:
              action: unpublish
              also_remove_destination: true
              keep_domain: false
      responses:
        "200":
          description: Summary of what the removal changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveOrgDestinationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  # ──────────────────────────────────────────────
  # Credits — /org/credits
  # ──────────────────────────────────────────────
  /org/credits/balance:
    get:
      tags: [Credits]
      summary: Get the org credit balance
      description: |
        Returns the organization's credit position — what it can still spend, and
        what it has spent to date. Takes no parameters.

        The response always carries the same fields. Branch on `dedicated_balance`:
        an organization that holds its own credit balance is not governed by a spend
        limit, while any other organization spends against an optional `credit_limit`.
      operationId: orgGetCreditBalance
      responses:
        "200":
          description: The organization's credit balance and usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCreditBalanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/credits/history:
    get:
      tags: [Credits]
      summary: Get the org credit usage history
      description: |
        Returns a day-by-day breakdown of the organization's credit spend over a
        trailing window, plus the total spent across it — enough to draw a usage chart
        or spot a trend without post-processing.

        Every day in the window is present, so a day with no spend comes back with a
        `usage` of `0` and there are no gaps to fill. Entries run oldest to newest and
        the last one is today, which is still accumulating — its `usage` will keep
        rising until the day closes.
      operationId: orgGetCreditHistory
      parameters:
        - $ref: "#/components/parameters/CreditsHistoryDays"
      responses:
        "200":
          description: The daily usage series for the requested window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgCreditHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Content Generation — /org/content-generation
  # ──────────────────────────────────────────────
  /org/content-generation/run:
    post:
      tags: [Content Generation]
      summary: Trigger a content-generation run
      description: >-
        Triggers a manual content-generation run for the organization. With an
        empty body it runs all eligible prompts; otherwise it is scoped to the
        given prompts, content type, and destinations. Send
        `Content-Type: application/json` even with an empty body — the header is
        required (`{}` is a safe empty body). Requires the GEO product.
      operationId: orgTriggerContentGenerationRun
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentGenerationRunRequest"
            example:
              prompt_ids:
                - 123e4567-e89b-12d3-a456-426614174000
      responses:
        "202":
          description: The run was accepted and started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationRunResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"

  /org/content-generation/industry-prompt-draft:
    post:
      tags: [Content Generation]
      summary: Draft a document from an industry prompt
      description: >-
        Generates a complete document from one of your industry's prompts in a
        single synchronous call. The prompt is resolved server-side against your
        organization's industry, grounded in your knowledge base, and written in
        the requested content type with your brand kit and product-line context
        applied. The document is not stored as content: the response carries it
        as GitHub Flavored Markdown with footnote citations, together with the
        sources behind it and a summary of what retrieval found, so you can review
        it or store it as content in a follow-up call. The call typically takes 10–30 seconds — set
        your client timeout accordingly. Each returned document consumes credits
        like an ad-hoc content generation; the balance is checked first, so an
        insufficient balance is a `402` before anything runs, and no credits are
        consumed unless a document is returned. A prompt that is not part of your
        organization's industry is a `404`; an organization with no industry
        assigned is a `422`. Requires the GEO product.
      operationId: orgGenerateIndustryPromptDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryPromptDraftRequest"
            example:
              industry_prompt_id: 123e4567-e89b-12d3-a456-426614174000
              selected_content_type_id: 223e4567-e89b-12d3-a456-426614174000
              audience: Marketing leaders evaluating AI search visibility
      responses:
        "200":
          description: The generated document with its citations and a summary of what retrieval found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryPromptDraftResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/GenerationPaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /org/content-generation/sample:
    post:
      tags: [Content Generation]
      summary: Submit a content-generation sample job
      description: >-
        Submits an asynchronous sample-generation job for a single prompt and
        content type, and returns the job id plus its initial status. Poll
        `GET /org/content-generation/sample-jobs/{sample_job_id}` to retrieve the
        result. Requires the GEO product.
      operationId: orgGenerateContentSample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentGenerationSampleRequest"
            example:
              geo_question_id: 123e4567-e89b-12d3-a456-426614174000
              content_type_id: 223e4567-e89b-12d3-a456-426614174000
      responses:
        "202":
          description: The sample job was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentGenerationSampleJobSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────────
  # Run Configuration — /org/run-models, /org/scheduler-models
  # ──────────────────────────────────────────────
  /org/run-models:
    get:
      tags: [Run Configuration]
      summary: List the org's run models
      description: The AI models the organization's question runs currently execute against. Requires the GEO product.
      operationId: orgGetRunModels
      responses:
        "200":
          description: The org's current run models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRunModelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Run Configuration]
      summary: Set the org's run models
      description: >-
        Replaces the organization's run models with the given set. Every option from
        `GET /org/run-models/options` is valid (matching is case-insensitive, and a few
        legacy alias spellings are also accepted); an unsupported name returns 400 with
        the list of unsupported and valid models. Setting run models also replaces the
        scheduler-models opt-in (`/org/scheduler-models`) with the equivalent scheduler
        models.
      operationId: orgSetRunModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOrgRunModelsRequest"
            example:
              models:
                - chatgpt
                - claude
      responses:
        "200":
          description: The updated run models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRunModelsResponse"
        "400":
          $ref: "#/components/responses/ModelWriteBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/run-models/options:
    get:
      tags: [Run Configuration]
      summary: List valid run-model options
      description: >-
        The model names (with display labels) that the run-models write accepts.
        Options are global, not per-org.
      operationId: orgGetRunModelOptions
      responses:
        "200":
          description: The available run-model options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelOptionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/scheduler-models:
    get:
      tags: [Run Configuration]
      summary: List the org's scheduler models
      description: >-
        The models the scheduler runs for the organization. This is a separate set from
        the legacy run-models list, but note `PUT /org/run-models` also replaces it.
        Requires the GEO product.
      operationId: orgGetSchedulerModels
      responses:
        "200":
          description: The org's scheduler models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Run Configuration]
      summary: Set the org's scheduler models
      description: >-
        Replaces the organization's scheduler model opt-in. Each model is validated
        against the models the scheduler supports; an unsupported entry returns 400
        with the list of unsupported and valid models.
      operationId: orgSetSchedulerModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetModelsRequest"
            example:
              models:
                - anthropic/claude
                - openai/gpt
      responses:
        "200":
          description: The updated scheduler models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "400":
          $ref: "#/components/responses/ModelWriteBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Questions — /org/questions
  # ──────────────────────────────────────────────
  /org/questions:
    get:
      tags: [Questions]
      summary: List questions
      description: >-
        Returns your organization's questions (prompts) with their tags. Requires the
        GEO product. This is the lightweight view — use `GET /org/prompts` for the same
        underlying data with full generation-run history.
      operationId: orgListQuestions
      parameters:
        - name: question_type
          in: query
          description: >-
            Which set to return. `organization` (default) lists your org's own questions;
            `network` lists the questions shared across your org's network.
          schema:
            type: string
            enum: [organization, network]
            default: organization
      responses:
        "200":
          description: Every question in the requested scope (this endpoint is not paginated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoQuestionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Questions]
      summary: Create a question
      description: >-
        Adds a question to your organization. If `geo_pool_id` is omitted — or names a
        pool that is not yours — the question is filed in your org's first pool
        (alphabetically), created as "Default" on first use. Any valid `tag_ids`
        supplied are attached and echoed back (invalid tag ids are ignored and the
        `tags` field is simply absent); Senso also auto-tags the question in the
        background. Requires the GEO product.
      operationId: orgCreateQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGeoQuestionRequest"
            example:
              question_text: What are the current 30-year mortgage rates?
              type: decision
      responses:
        "201":
          description: The created question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/questions/{questionId}:
    patch:
      tags: [Questions]
      summary: Update a question
      description: >-
        Partially updates a question. Supply `tag_ids` to replace its full tag set,
        `type` to change its funnel stage, or both — at least one field is required.
        Requires the GEO product.
      operationId: orgPatchQuestion
      parameters:
        - name: questionId
          in: path
          required: true
          description: The question's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGeoQuestionRequest"
            example:
              type: consideration
      responses:
        "200":
          description: The updated question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoQuestionResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Questions]
      summary: Delete a question
      description: Deletes a question from your organization. Requires the GEO product.
      operationId: orgDeleteQuestion
      parameters:
        - name: questionId
          in: path
          required: true
          description: The question's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The question was deleted. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Prompts — /org/prompts
  # ──────────────────────────────────────────────
  /org/prompts:
    get:
      tags: [Prompts]
      summary: List prompts
      description: >-
        Returns one page of your organization's prompts with their tags. Requires the
        GEO product.
      operationId: orgListPrompts
      parameters:
        - name: limit
          in: query
          description: Page size, 1–100 (default 50). Values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          description: Free-text filter on prompt text.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order.
          schema:
            type: string
            enum: [created_desc, created_asc, text_asc, text_desc, type_asc, type_desc]
            default: created_desc
      responses:
        "200":
          description: One page of prompts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPromptListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Prompts]
      summary: Create a prompt
      description: >-
        Adds a prompt to your organization and auto-tags it in the background. Requires
        the GEO product.
      operationId: orgCreatePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgPromptRequest"
            example:
              question_text: What are the current 30-year mortgage rates?
              type: decision
      responses:
        "201":
          description: The created prompt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPromptListItem"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/prompts/{promptId}:
    get:
      tags: [Prompts]
      summary: Get a prompt
      description: >-
        Returns one prompt with its tags and its full generation-run history —
        every run's model answer, the mentions and competitors detected, and the claims
        with their citations. Requires the GEO product.
      operationId: orgGetPrompt
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The prompt with its run history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPromptDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Prompts]
      summary: Delete a prompt
      description: Deletes a prompt from your organization. Requires the GEO product.
      operationId: orgDeletePrompt
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The prompt was deleted. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/prompts/{promptId}/tags:
    get:
      tags: [Prompts]
      summary: List a prompt's tags
      description: Returns the tags attached to a prompt. Requires the GEO product.
      operationId: orgListPromptTags
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The prompt's tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Prompts]
      summary: Replace a prompt's tags
      description: >-
        Replaces the prompt's entire tag set. Identify tags by `tag_ids`, by
        `tag_names`, or both; unknown names are created in your organization. Returns the
        resulting tag set. Requires the GEO product.
      operationId: orgSetPromptTags
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetResourceTagsRequest"
            example:
              tag_names:
                - mortgages
                - home-loans
      responses:
        "200":
          description: The prompt's tags after the replacement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Prompts]
      summary: Attach a tag to a prompt (by id or name)
      description: >-
        Attaches a single tag to the prompt. Provide either `tag_id` (an existing tag)
        or `tag_name` (created in your organization if it does not exist). Requires the
        GEO product.
      operationId: orgAttachPromptTag
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachResourceTagRequest"
            example:
              tag_name: mortgages
      responses:
        "204":
          description: The tag was attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Prompts]
      summary: Detach a tag from a prompt (by name)
      description: >-
        Removes the named tag from the prompt. Idempotent — returns 204 even if the tag
        does not exist or was not attached. Requires the GEO product.
      operationId: orgDetachPromptTagByName
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          required: true
          description: The tag name to detach.
          schema:
            type: string
      responses:
        "204":
          description: The tag is no longer attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/prompts/{promptId}/tags/{tagId}:
    post:
      tags: [Prompts]
      summary: Attach a tag to a prompt (by id)
      description: Attaches an existing tag to the prompt by id. Requires the GEO product.
      operationId: orgAttachPromptTagByID
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tag was attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Prompts]
      summary: Detach a tag from a prompt (by id)
      description: Removes a tag from the prompt by id. Requires the GEO product.
      operationId: orgDetachPromptTagByID
      parameters:
        - name: promptId
          in: path
          required: true
          description: The prompt's id (`geo_question_id`).
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tag is no longer attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/history-imports:
    get:
      tags: [History Imports]
      summary: List history imports
      description: >-
        Returns your organization's 50 most recently started history-import jobs, newest
        first. Each job back-fills your prompts with run history already collected for
        your industry. Takes no parameters. Requires the GEO product.
      operationId: orgListHistoryImports
      responses:
        "200":
          description: Your organization's 50 most recently started history-import jobs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgHistoryImportListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/BadGateway"

  /org/history-imports/{importId}:
    get:
      tags: [History Imports]
      summary: Get a history import
      description: >-
        Returns one of your organization's history-import jobs — the way to follow a job
        until it finishes. Only your own organization's jobs are visible;
        any other id reads as not found. Requires the GEO product.
      operationId: orgGetHistoryImport
      parameters:
        - name: importId
          in: path
          required: true
          description: The history-import job's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The history-import job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgHistoryImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/BadGateway"

components:
  securitySchemes:
    OrgApiKey:
      type: apiKey
      in: header
      name: X-API-Key

  # Reusable parameters: shared path ids, then the query parameters of the windowed analytics endpoints.
  parameters:
    SensoSignals:
      name: X-Senso-Signals
      in: header
      required: false
      description: >-
        Send `off` to keep this search out of your organization's gap report. The search
        still runs, consumes credits and is recorded in search history; it is only never
        counted towards a gap. `false`, `0`, `no`, `skip` and `none` mean the same,
        case-insensitively. Any other value, or no header, leaves the search eligible.
        Use it on automated, synthetic or test traffic. Only `POST /org/search`,
        `/org/search/full` and `/org/search/stream` ever file gaps;
        `/org/search/context` and `/org/search/content` accept the header and never file
        one either way.
      schema:
        type: string
      example: "off"
    GapID:
      name: gapId
      in: path
      required: true
      description: The gap's id.
      schema:
        type: string
        format: uuid
    ContentTypeID:
      name: id
      in: path
      required: true
      description: The content type's id.
      schema:
        type: string
        format: uuid
    ContentGenerationRunID:
      name: run_id
      in: path
      required: true
      description: The content-generation run's id.
      schema:
        type: string
        format: uuid
    ProductLineID:
      name: id
      in: path
      required: true
      description: The product line's id.
      schema:
        type: string
        format: uuid
    CTATemplateID:
      name: ctaId
      in: path
      required: true
      description: The CTA template's id.
      schema:
        type: string
        format: uuid
    AnalyticsFrom:
      name: from
      in: query
      description: >-
        Start of the window (inclusive), `YYYY-MM-DD`. Omit to let the server anchor a
        default 30-day window on your most recent day with data.
      schema:
        type: string
        format: date
    AnalyticsTo:
      name: to
      in: query
      description: >-
        End of the window (inclusive), `YYYY-MM-DD`. Omit to end the window at your most
        recent day with data.
      schema:
        type: string
        format: date
    AnalyticsModels:
      name: models
      in: query
      description: >-
        Comma-separated model identifiers to filter by (e.g. `chatgpt`, `claude`,
        `perplexity`, `gemini`). Validated against a fixed allow-list — an unrecognized
        identifier is rejected with 400. Call `GET /org/analytics/filters` for the
        models that actually have data for your organization.
      schema:
        type: string
    AnalyticsLocation:
      name: location
      in: query
      description: >-
        Comma-separated locations to filter by, matched exactly and case-sensitively
        (e.g. `US`, `US/California`). The alias `locations` is also accepted. Call
        `GET /org/analytics/filters` for the locations with data.
      schema:
        type: string
    AnalyticsPromptType:
      name: prompt_type
      in: query
      description: Restrict to one funnel stage.
      schema:
        type: string
        enum: [awareness, consideration, evaluation, decision]
    AnalyticsTag:
      name: tag
      in: query
      description: Restrict to prompts carrying this tag.
      schema:
        type: string
    AnalyticsGroupBy:
      name: group_by
      in: query
      description: Time bucket for the returned series.
      schema:
        type: string
        enum: [day, week]
        default: day
    AnalyticsTier:
      name: tier
      in: query
      description: Restrict to one citation tier — `primary` (Owned), `tracked` (Tracked), or `secondary` (External).
      schema:
        $ref: "#/components/schemas/CitationTier"
    AnalyticsLimit:
      name: limit
      in: query
      description: Page size, 1–100 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AnalyticsOffset:
      name: offset
      in: query
      description: Number of rows to skip.
      schema:
        type: integer
        minimum: 0
        default: 0

    # Reusable query parameters for the KB node listing endpoints
    # (my-files, find, children). All filters are optional.
    KBListLimit:
      name: limit
      in: query
      description: Page size, 1–50 (default 50). Values above 50 are capped at 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
    KBListOffset:
      name: offset
      in: query
      description: Number of rows to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    KBTypeFilter:
      name: type
      in: query
      description: Restrict to folders or documents.
      schema:
        type: string
        enum: [folder, content]
    KBStatusFilter:
      name: status
      in: query
      description: >-
        Restrict document nodes by ingestion status. Ignored when `type=folder` (folders
        have no ingestion status).
      schema:
        type: string
        enum: [pending, processing, complete, failed]
    KBRoleFilter:
      name: role
      in: query
      description: >-
        Restrict to nodes on which the caller holds this role. Applies only to
        permission-scoped callers; it is ignored (results are not narrowed) for
        org-admin callers, including an unscoped API key (which has full access).
      schema:
        type: string
        enum: [editor, viewer]
    KBSortBy:
      name: sort_by
      in: query
      description: >-
        Field to sort by. `role` ordering applies only to permission-scoped callers; for
        org-admin callers (including an unscoped API key) it falls back to the default
        folders-first, name order.
      schema:
        type: string
        enum: [name, updated_at, created_at, type, status, role]
    KBSortOrder:
      name: sort_order
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
    KBTagIDsFilter:
      name: tag_ids
      in: query
      description: Comma-separated tag ids; restrict to nodes carrying any of them.
      schema:
        type: string

    # Industries — path and competitive-intelligence filter parameters.
    IndustryID:
      name: id
      in: path
      required: true
      description: The industry's id — from `GET /org/industries`, or your organization's own industry.
      schema:
        type: string
        format: uuid
    IndustryBrandName:
      name: brand
      in: path
      required: true
      description: The brand name to look up. Matching is fuzzy and merges known spelling variants.
      schema:
        type: string
    IndustryBrandID:
      name: brand_id
      in: path
      required: true
      description: The brand's stable id, as returned in `brand_id` by the leaderboard or a lookup by name.
      schema:
        type: string
        format: uuid
    IndustryDomain:
      name: domain
      in: path
      required: true
      description: The domain to look up, e.g. `nerdwallet.com`. The segment is required even when `url` is supplied.
      schema:
        type: string
    IndustryFrom:
      name: from
      in: query
      description: Start of the window (inclusive), `YYYY-MM-DD`. Defaults to 30 days before today.
      schema:
        type: string
        format: date
    IndustryTo:
      name: to
      in: query
      description: >-
        End of the window (inclusive), `YYYY-MM-DD`. Defaults to today. Must not
        precede `from`, and the window may span at most 90 days; otherwise a `400`.
      schema:
        type: string
        format: date
    IndustryModels:
      name: models
      in: query
      description: >-
        Comma-separated AI models to include — any of `gpt-4.1`, `chatgpt`,
        `perplexity`, `aioverview`, `gemini`, `linkup`, `claude-sonnet-4-6`, and
        `grok`. Omit for all models; an unknown value is a `400`.
      schema:
        type: string
    IndustryLocation:
      name: location
      in: query
      description: >-
        Restrict to answers collected for one location, using the value the industry's
        runs record — a country code such as `US`, or a country/region pair such as
        `US/California`. Omit to sum every location.
      schema:
        type: string

    # Evals — path and list-filter parameters.
    EvalRunID:
      name: runId
      in: path
      required: true
      description: The eval run's id.
      schema:
        type: string
        format: uuid
    EvalFrom:
      name: from
      in: query
      description: >-
        Only items created at or after this instant, in RFC 3339 form (e.g.
        `2026-09-01T00:00:00Z`). Any other format is a `400`.
      schema:
        type: string
        format: date-time
    EvalTo:
      name: to
      in: query
      description: >-
        Only items created before this instant (exclusive), in RFC 3339 form. Any
        other format is a `400`.
      schema:
        type: string
        format: date-time
    EvalEvaluatorFilter:
      name: evaluator
      in: query
      description: Only items produced by this evaluator, by key (`kb_accuracy` or `brand_alignment`).
      schema:
        type: string
    EvalSubjectTypeFilter:
      name: subject_type
      in: query
      description: >-
        Only items whose subject is of this type — `inline` for text supplied to
        `POST /org/evals/text`, `content` for saved content items. Other values
        belong to runs triggered elsewhere in Senso.
      schema:
        type: string
    EvalClaimRunIDFilter:
      name: run_id
      in: query
      description: Only claims from this run. Must be a UUID, otherwise a `400`.
      schema:
        type: string
        format: uuid
    EvalLimit:
      name: limit
      in: query
      description: >-
        Page size (1–100). Defaults to 25. Values above 100 are clamped to 100; zero,
        negative, or non-numeric values fall back to the default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    EvalOffset:
      name: offset
      in: query
      description: Number of items to skip. Defaults to 0; negative or non-numeric values fall back to 0.
      schema:
        type: integer
        minimum: 0
        default: 0

    CreditsHistoryDays:
      name: days
      in: query
      description: >-
        Length of the trailing window in days, 1–365 (default 30), counting back from
        today. A value outside that range, a non-numeric one, or `?days=` with no
        value at all is rejected with 400 rather than falling back to the default.
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30

  # Reusable error responses. Every non-2xx body is an ErrorResponse; endpoints that
  # validate a request body can answer 400 with a ValidationErrorResponse instead.
  responses:
    Unauthorized:
      description: Missing or invalid credentials — supply a valid org API key in the `X-API-Key` header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request was malformed — a bad path/query parameter or an invalid value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The API key is authenticated but not permitted to access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist or is not visible to this key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequestBody:
      description: >-
        The request body was invalid — either it failed field validation
        (`ValidationErrorResponse`) or was otherwise malformed (`ErrorResponse`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationErrorResponse"
              - $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state (e.g. a duplicate).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: The organization is out of credits or has reached its spending limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: An upstream dependency failed or rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request was well-formed but cannot be fulfilled given the current state (e.g. insufficient data to act on).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded — retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: The service is temporarily unavailable — retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: This capability is not available for the deployment serving the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ModelWriteBadRequest:
      description: >-
        The request body was invalid (`ValidationErrorResponse` or `ErrorResponse`),
        or one or more requested models are not supported (`UnknownModelsResponse`,
        which lists the unsupported and valid models).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationErrorResponse"
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/UnknownModelsResponse"

    GenerationPaymentRequired:
      description: >-
        The organization is out of credits or has reached its spending limit, so
        generation did not run. Unlike most errors, the body carries a stable
        `code` you can branch on.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreditErrorResponse"
    GatewayTimeout:
      description: >-
        A generation stage did not finish within the server's time limit. No
        credits were consumed — retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Errors ────────────────────────────────
    # ErrorResponse is the body of nearly every non-2xx. Body-validation failures
    # return ValidationErrorResponse instead.
    ErrorResponse:
      type: object
      required:
        - status
        - message
      additionalProperties: false
      properties:
        status:
          type: integer
          description: The HTTP status code, repeated in the body so it is self-describing.
          example: 401
        message:
          type: string
          description: A human-readable description of what went wrong. Not a stable identifier — do not branch on this string.
          example: Organization API key or valid JWT token required

    # ValidationErrorResponse is returned (instead of ErrorResponse) when a request
    # body fails field validation — see the BadRequestBody response.
    ValidationErrorResponse:
      type: object
      required:
        - status
        - errors
      additionalProperties: false
      properties:
        status:
          type: integer
          description: The HTTP status code (400).
          example: 400
        errors:
          type: array
          description: One entry per field that failed validation.
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: object
      required:
        - field
        - message
      additionalProperties: false
      properties:
        field:
          type: string
          description: The request field that failed validation.
          example: schedule
        message:
          type: string
          description: Why the field failed validation.
          example: This field is required

    # CreditErrorResponse is the 402 body of the industry-prompt draft endpoint —
    # see the GenerationPaymentRequired response. It carries a stable code.
    CreditErrorResponse:
      type: object
      description: >-
        Returned with a `402` when generation cannot start because of the
        organization's credit position. Branch on `code`, not `message`.
      additionalProperties: false
      required:
        - error
        - code
        - message
      properties:
        error:
          type: string
          description: Same value as `code`.
          example: insufficient_credits
        code:
          type: string
          description: >-
            Why generation was refused — `insufficient_credits` when the balance
            cannot cover the estimated charge, `spending_limit_reached` when the
            organization's spending limit would be exceeded.
          enum: [insufficient_credits, spending_limit_reached]
        message:
          type: string
          description: A human-readable description of what went wrong. Not a stable identifier.
          example: Insufficient credits for content generation

    # Generic deletion acknowledgement — a bare {"deleted": true}. Returned by
    # simple DELETE endpoints that have nothing else to say.
    DeletedResponse:
      type: object
      required:
        - deleted
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          description: Always true — the record was deleted.
          example: true

    # ── Knowledge Base ────────────────────────
    KBStatsResponse:
      type: object
      required:
        - total_files
        - total_folders
      additionalProperties: false
      properties:
        total_files:
          type: integer
          description: Number of document (file) nodes in the knowledge base.
          example: 42
        total_folders:
          type: integer
          description: Number of folder nodes in the knowledge base, excluding the root folder.
          example: 7

    ContentDownloadURLResponse:
      type: object
      description: Presigned URLs and metadata for downloading a document node's file.
      required:
        - url
        - download_url
        - filename
        - content_type
        - file_size_bytes
        - expiry_utc_ms
      additionalProperties: false
      properties:
        url:
          type: string
          description: Presigned URL that renders the file inline (e.g. in a browser).
        download_url:
          type: string
          description: Presigned URL that forces a download (Content-Disposition attachment).
        filename:
          type: string
          description: Original file name of the stored document.
        content_type:
          type: string
          description: MIME type of the stored file.
        file_size_bytes:
          type: integer
          format: int64
          description: Size of the file in bytes.
        expiry_utc_ms:
          type: integer
          format: int64
          description: Unix epoch time in milliseconds when the presigned URLs expire.

    # ── KB grants ─────────────────────────────
    GrantPermissionRequest:
      type: object
      required:
        - grantee_type
        - grantee_id
        - role
      properties:
        grantee_type:
          type: string
          enum: [user, group]
          description: Whether the grantee is a user or a group.
        grantee_id:
          type: string
          format: uuid
          description: The user id or group id to grant access to.
        role:
          type: string
          enum: [viewer, editor]
          description: >-
            Access level to grant. Only viewer and editor can be granted here;
            owner is reserved and rejected with 400.
    KBNodeGrant:
      type: object
      description: An access grant on a knowledge base node.
      required:
        - id
        - node_id
        - role
        - grantee
        - granted_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the grant.
        node_id:
          type: string
          format: uuid
          description: The node this grant applies to.
        role:
          type: string
          enum: [viewer, editor, owner]
          description: The access level this grant confers.
        grantee:
          $ref: "#/components/schemas/Grantee"
        granted_at:
          type: string
          format: date-time
          description: When the grant was created.
    Grantee:
      type: object
      description: The user or group an access grant is for.
      required:
        - type
        - id
        - display_name
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [user, group]
          description: Whether the grantee is a `user` or a `group`.
        id:
          type: string
          format: uuid
          description: The user id or group id.
        display_name:
          type: string
          description: Human-readable name of the grantee.
        email:
          type: string
          description: Email address (users only).

    # ── Content ───────────────────────────────
    GeneratedContentDetailResponse:
      type: object
      description: A generated content item with its current version metadata and source question.
      required:
        - content_id
        - content_type
        - editorial_status
        - title
        - question_text
        - version_num
        - generated_at
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        content_id:
          type: string
          format: uuid
          description: Unique identifier of the content item.
        content_type:
          type: string
          description: MIME type of the content (e.g. `text/markdown`).
        editorial_status:
          type: string
          description: Editorial workflow status of the current version.
        title:
          type: string
          description: Title of the current version.
        summary:
          type: string
          description: Generated summary of the current version, when present.
        question_text:
          type: string
          description: The prompt/question this content was generated to answer.
        version_num:
          type: integer
          format: int64
          description: Version number of the current version.
        generated_at:
          type: string
          format: date-time
          description: When the current version was generated.
        created_at:
          type: string
          format: date-time
          description: When the content item was created.
        updated_at:
          type: string
          format: date-time
          description: When the content item was last updated.
        text:
          type: string
          description: Full generated body text, when available.

    # ── Run Configuration ─────────────────────
    OrgRunScheduleResponse:
      type: object
      required:
        - schedule
      additionalProperties: false
      properties:
        schedule:
          type: array
          description: Weekdays the org's runs are scheduled on, 0 = Sunday … 6 = Saturday.
          items:
            type: integer
            minimum: 0
            maximum: 6

    # ── Tracked Competitors ───────────────────
    CompetitorRequest:
      type: object
      description: >-
        Create/update payload for a tracked competitor.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Competitor brand name.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Competitor website URL.
    CompetitorResponse:
      type: object
      description: A competitor brand your organization tracks.
      required:
        - id
        - org_id
        - name
        - source
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the tracked competitor.
        org_id:
          type: string
          format: uuid
          description: The organization that owns this entry.
        name:
          type: string
          description: Competitor brand name.
        url:
          type: string
          description: Competitor website URL, when set.
        source:
          type: string
          enum: [manual, suggested_run_text, suggested_web_search]
          description: How this entry was added — added by hand, or AI-suggested from run text or a web search.
        rationale:
          type: string
          description: For AI-suggested entries, why this competitor was proposed.
        confidence:
          type: number
          description: For AI-suggested entries, the suggestion confidence (0–1).
        created_at:
          type: string
          format: date-time
          description: When the entry was created.
        updated_at:
          type: string
          format: date-time
          description: When the entry was last updated.
    CompetitorListResponse:
      type: object
      description: The organization's tracked competitors with a count.
      additionalProperties: false
      required:
        - competitors
        - total
      properties:
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorResponse"
        total:
          type: integer
          description: Number of competitors returned.
    CompetitorBatchItem:
      type: object
      description: One competitor to create, optionally carrying AI-suggestion provenance.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Competitor brand name.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Competitor website URL.
        source:
          type: string
          enum: [manual, suggested_run_text, suggested_web_search]
          description: How this entry originated. Defaults to `manual` when omitted.
        rationale:
          type: string
          maxLength: 280
          description: For AI-suggested entries, why this competitor was proposed.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: For AI-suggested entries, the suggestion confidence (0–1).
    CompetitorBatchRequest:
      type: object
      description: Create up to 50 competitors at once (used by the suggestion-accept flow).
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CompetitorBatchItem"
    CompetitorSuggestion:
      type: object
      description: One AI-suggested competitor.
      additionalProperties: false
      required:
        - name
        - source
        - confidence
        - rationale
        - already_tracked
      properties:
        name:
          type: string
          description: Suggested competitor brand name.
        url:
          type: string
          description: Suggested competitor website URL, when found.
        source:
          type: string
          enum: [suggested_run_text, suggested_web_search]
          description: Which suggestion mode produced this — from prompt-run text or a web search.
        confidence:
          type: number
          description: Suggestion confidence (0–1).
        rationale:
          type: string
          description: Why this competitor was proposed.
        already_tracked:
          type: boolean
          description: True when an active competitor with the same name is already tracked.
    SuggestCompetitorsResponse:
      type: object
      description: AI-generated competitor suggestions for your organization.
      additionalProperties: false
      required:
        - mode
        - suggestions
        - duration_ms
        - cached
      properties:
        mode:
          type: string
          description: Which suggestion mode ran — `run_text` (from recent prompt-run text) or `web_search`.
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorSuggestion"
        sampled_run_ids:
          type: array
          description: Prompt-run ids sampled to produce the suggestions (run_text mode).
          items:
            type: string
            format: uuid
        duration_ms:
          type: integer
          description: How long the suggestion run took, in milliseconds.
        cached:
          type: boolean
          description: Whether the result was served from cache.

    # ── Tracked Sources ───────────────────────
    TrackedSourceRequest:
      type: object
      description: Create/update payload for a citation-classification rule.
      required:
        - pattern
        - match_type
        - tier
      properties:
        pattern:
          type: string
          maxLength: 2048
          description: >-
            The URL, host, or domain to match. Normalized to a canonical form on save
            (a `domain` to its eTLD+1); `path_prefix` and `exact_url` require a path.
        match_type:
          type: string
          enum: [domain, host, path_prefix, exact_url]
          description: The scope the pattern matches against.
        tier:
          $ref: "#/components/schemas/CitationTier"
        category:
          type: string
          enum: [affiliated_domain, published_content, social, press]
          description: Optional reporting label. Only retained for the `tracked` tier; ignored otherwise.
        label:
          type: string
          maxLength: 255
          description: Optional human-readable label for the rule.
        priority:
          type: integer
          description: Optional tie-break priority when multiple rules match a URL.
        active:
          type: boolean
          description: >-
            Whether the rule is applied. Ignored on create (new rules are always
            active); on update it is the only field honored for published rules.
    TrackedSourceResponse:
      type: object
      description: A per-org citation-classification rule.
      required:
        - id
        - org_id
        - pattern
        - match_type
        - tier
        - priority
        - source_origin
        - active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the rule.
        org_id:
          type: string
          format: uuid
          description: The organization that owns this rule.
        pattern:
          type: string
          description: >-
            The pattern the rule matches on. Patterns written through the API are
            normalized; rules seeded during onboarding or from published content may
            carry the raw URL (the classifier normalizes at match time).
        match_type:
          type: string
          enum: [domain, host, path_prefix, exact_url]
          description: The scope the pattern matches against.
        tier:
          $ref: "#/components/schemas/CitationTier"
        category:
          type: string
          enum: [affiliated_domain, published_content, social, press]
          description: Reporting label, present only for `tracked`-tier rules that carry one.
        label:
          type: string
          description: Human-readable label, when set.
        priority:
          type: integer
          description: Tie-break priority when multiple rules match a URL.
        source_origin:
          type: string
          enum: [manual, onboarding, published]
          description: >-
            How the rule was created — `manual` (via the API/editor), `onboarding`
            (seeded from the org's website), or `published` (auto-created when content
            was published; read-only except for the `active` toggle).
        active:
          type: boolean
          description: Whether the rule is currently applied.
        created_at:
          type: string
          format: date-time
          description: When the rule was created.
        updated_at:
          type: string
          format: date-time
          description: When the rule was last updated.
    TrackedSourceListResponse:
      type: object
      description: One page of tracked sources with the org's total row count.
      required:
        - tracked_sources
        - total
        - limit
        - offset
      additionalProperties: false
      properties:
        tracked_sources:
          type: array
          description: The tracked sources on this page.
          items:
            $ref: "#/components/schemas/TrackedSourceResponse"
        total:
          type: integer
          description: Total rows matching the filter, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The row offset that was applied.

    # ── Analytics ─────────────────────────────
    # The citation-tier vocabulary, shared by the analytics tier filters and the
    # tracked-source rules that assign it.
    CitationTier:
      type: string
      description: >-
        A cited URL's classification tier — `primary` (Owned: one of your own websites),
        `tracked` (Tracked: one of your configured tracked sources), or `secondary`
        (External: any other domain). The tiers partition citations, so every cited URL
        falls in exactly one of them.
      enum:
        - primary
        - tracked
        - secondary

    MetricValue:
      type: object
      nullable: true
      description: >-
        A ratio, shipped as an unrounded fraction plus a ready-to-quote string. Use `value` for
        math and `display` verbatim for anything a human reads — it is why `0.012` never reaches a
        slide as "0.012%". `value` is a 0–1 fraction for rates and shares, an average position for
        ranks, and an intensity for frequencies. Wherever a field of this shape is nullable,
        `null` means the metric's denominator was zero, so the metric was **not measured** in this
        window; it never means the metric was measured as zero.
      additionalProperties: false
      required:
        - value
        - display
      properties:
        value:
          type: number
          description: The raw number for math — a 0–1 fraction for rates/shares, an average position for ranks, an intensity for frequencies.
        display:
          type: string
          description: The presentation string, safe to quote verbatim (e.g. "2.6%", "#1.4", "4.20 citations per cited answer").
    AnalyticsWindow:
      type: object
      description: The effective window every number in the payload was computed over.
      additionalProperties: false
      required:
        - from
        - to
        - days
        - latest_data_day
      properties:
        from:
          type: string
          format: date
          description: First day in the window (inclusive).
        to:
          type: string
          format: date
          description: Last day in the window (inclusive).
        days:
          type: integer
          description: Number of days spanned, inclusive.
        latest_data_day:
          type: string
          format: date
          nullable: true
          description: Most recent day with data for the active model/location filter, or null if none.
    SentimentCounts:
      type: object
      description: The mention-sentiment split. positive + neutral + negative = mentioned_count.
      additionalProperties: false
      required:
        - positive
        - neutral
        - negative
      properties:
        positive:
          type: integer
          format: int64
        neutral:
          type: integer
          format: int64
        negative:
          type: integer
          format: int64
    AnalyticsTotals:
      type: object
      description: >-
        The additive count block — every numerator and denominator behind the metrics,
        summed over the window and filter. All are additive, so they can be recombined
        across windows; ratios cannot.
      additionalProperties: false
      required:
        - run_count
        - answered_count
        - mentioned_count
        - mention_total
        - tracked_mention_total
        - brand_mention_total
        - rank_sum
        - sentiment
        - cited_run_count
        - primary_cited_run_count
        - tracked_cited_run_count
        - external_cited_run_count
        - cited_total
        - primary_cited_total
        - tracked_cited_total
        - external_cited_total
        - prompt_count
        - model_count
        - location_count
      properties:
        run_count:
          type: integer
          format: int64
          description: Prompt-run answers attempted.
        answered_count:
          type: integer
          format: int64
          description: Non-empty answers — the mention-rate denominator.
        mentioned_count:
          type: integer
          format: int64
          description: Answers naming the org (mention-rate numerator).
        mention_total:
          type: integer
          format: int64
          description: Mention instances for the org (Share of Voice numerator).
        tracked_mention_total:
          type: integer
          format: int64
          description: Mention instances over {org + tracked competitors}. NOT the Share of Voice denominator.
        brand_mention_total:
          type: integer
          format: int64
          description: Mention instances over ALL brands — the Share of Voice denominator.
        rank_sum:
          type: integer
          format: int64
          description: Σ ordinal position over mentioned answers (avg-rank numerator).
        sentiment:
          $ref: "#/components/schemas/SentimentCounts"
        cited_run_count:
          type: integer
          format: int64
          description: Answers with ≥1 citation of any tier — this is D, the Citation Rate and Coverage denominator.
        primary_cited_run_count:
          type: integer
          format: int64
          description: Answers citing an owned domain.
        tracked_cited_run_count:
          type: integer
          format: int64
          description: Answers citing a tracked source.
        external_cited_run_count:
          type: integer
          format: int64
          description: Answers citing a third-party domain.
        cited_total:
          type: integer
          format: int64
          description: Total citation instances, all tiers — this is S, the Citation Share denominator.
        primary_cited_total:
          type: integer
          format: int64
          description: Citation instances pointing at an owned domain.
        tracked_cited_total:
          type: integer
          format: int64
          description: Citation instances pointing at a tracked source.
        external_cited_total:
          type: integer
          format: int64
          description: Citation instances pointing at a third-party domain.
        prompt_count:
          type: integer
          format: int64
          description: Distinct prompts contributing to the window.
        model_count:
          type: integer
          format: int64
          description: Distinct models contributing to the window.
        location_count:
          type: integer
          format: int64
          description: Distinct locations contributing to the window.
    AnalyticsMetrics:
      type: object
      description: >-
        Every ratio derivable from the totals. Each is null when its denominator is
        zero. Tier RATES divide by D and are independent (can sum past 100%); tier
        SHARES divide by S and partition (sum to exactly 100%).
      additionalProperties: false
      required:
        - mention_rate
        - share_of_voice
        - avg_rank
        - primary_citation_rate
        - tracked_citation_rate
        - external_citation_rate
        - primary_citation_share
        - tracked_citation_share
        - external_citation_share
        - citations_per_answer
      properties:
        mention_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Of the non-empty answers in this window (denominator `answered_count`), the share that
            named your brand. Answer grain — an answer naming you three times counts once. Null
            when there were no answered runs.
        share_of_voice:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Your share of every brand mention the models made — `mention_total` divided by
            `brand_mention_total` (mention instances of all brands, tracked or not). Instance
            grain, so a brand named twice in one answer counts twice. This is the same Share of
            Voice the Senso app reports and the two are expected to match exactly. It is **not**
            divided by `tracked_mention_total` — for an organization with no tracked competitors
            that denominator equals the numerator and pins the value at 100%, which is why neither
            the app nor this API uses it. Both counts ship in `totals` if you want the
            head-to-head view against your tracked set. Null when no brand mentions of any kind
            were recorded.
        avg_rank:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Mean ordinal position of your brand across the answers that mentioned it (`rank_sum` ÷
            `mentioned_count`), where 1 is named first. Lower is better. Null means you were never
            mentioned — which is not the same as ranking last.
        primary_citation_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Rate for the Owned tier. Of the answers that cited anything (denominator `D`
            = `cited_run_count`), the share that cited one of your own domains. Null when `D` was
            zero.
        tracked_citation_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Rate for the Tracked tier. Of the answers that cited anything (denominator
            `D` = `cited_run_count`), the share that cited one of your tracked sources. Null when
            `D` was zero.
        external_citation_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Rate for the External tier. Of the answers that cited anything (denominator
            `D` = `cited_run_count`), the share that cited a third-party domain — the `secondary`
            tier only. Null when `D` was zero.
        primary_citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for the Owned tier. Of all citation instances (denominator `S` =
            `cited_total`), the fraction pointing at your own domains. Instance grain, so this is
            a genuinely different number from `primary_citation_rate` and the two must never be
            substituted for each other. Null when `S` was zero.
        tracked_citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for the Tracked tier. Of all citation instances (denominator `S` =
            `cited_total`), the fraction pointing at your tracked sources. Null when `S` was zero.
        external_citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for the External tier. Of all citation instances (denominator `S` =
            `cited_total`), the fraction pointing at third-party domains. The three tier shares
            sum to exactly 100%; if they do not, that is an error on our side rather than rounding. Null
            when `S` was zero.
        citations_per_answer:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation instances divided by cited answers (`S` ÷ `D`) — how densely answers cite. An
            intensity, not a rate: unbounded above and never a percentage. `4.2` means the average
            citing answer cited 4.2 URLs. Null when `D` was zero.
    DataQuality:
      type: object
      description: Deterministic sample-quality flag driven by the answered-run count.
      additionalProperties: false
      required:
        - level
        - answered_count
        - reasons
      properties:
        level:
          type: string
          enum: [high, medium, low]
          description: low (<100 answered runs), medium (<400), high otherwise.
        answered_count:
          type: integer
          format: int64
          description: The answered-run count the flag was derived from.
        reasons:
          type: array
          description: Human-readable caveats when confidence is below high; empty otherwise.
          items:
            type: string
    RateTrend:
      type: object
      nullable: true
      description: A rate metric's movement versus the prior window. Null when either window lacked the denominator.
      additionalProperties: false
      required:
        - prev
        - delta
        - direction
        - display
      properties:
        prev:
          type: number
          description: The prior window's value (a 0–1 fraction).
        delta:
          type: number
          description: Change in absolute points (0.005 = +0.5 pts).
        direction:
          type: string
          enum: [improved, declined, flat]
          description: Semantic movement — higher is better for every trended metric.
        display:
          type: string
          description: Presentation string in points (e.g. "+0.5 pts").
    OrgAnalyticsPeriod:
      type: object
      nullable: true
      description: A window's totals and derived metrics — used for the comparison window.
      additionalProperties: false
      required:
        - window
        - totals
        - metrics
      properties:
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        metrics:
          $ref: "#/components/schemas/AnalyticsMetrics"
    OrgAnalyticsDeltas:
      type: object
      nullable: true
      description: Window-over-window movement of the headline metrics.
      additionalProperties: false
      required:
        - mention_rate
        - share_of_voice
        - primary_citation_rate
      properties:
        mention_rate:
          allOf:
            - $ref: "#/components/schemas/RateTrend"
          description: >-
            Movement in `mention_rate`. Higher is better, so a positive delta is `improved`.
        share_of_voice:
          allOf:
            - $ref: "#/components/schemas/RateTrend"
          description: >-
            Movement in `share_of_voice`. Higher is better, so a positive delta is `improved`. The
            denominator is `brand_mention_total` in both windows, so this never moves merely
            because you edited your tracked-competitor list — but it does move when the models
            start naming more brands overall.
        primary_citation_rate:
          allOf:
            - $ref: "#/components/schemas/RateTrend"
          description: >-
            Movement in the Owned-tier Citation Rate (numerator and denominator both answer grain,
            denominator `D` in each window).
    OrgAnalyticsSummaryResponse:
      type: object
      description: The headline dashboard for one window.
      additionalProperties: false
      required:
        - window
        - totals
        - metrics
        - previous_window
        - deltas
        - data_quality
        - notes
        - definitions
      properties:
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        metrics:
          $ref: "#/components/schemas/AnalyticsMetrics"
        previous_window:
          allOf:
            - $ref: "#/components/schemas/OrgAnalyticsPeriod"
          description: >-
            The equal-length window immediately preceding this one. Null when there is no earlier
            data to compare against.
        deltas:
          allOf:
            - $ref: "#/components/schemas/OrgAnalyticsDeltas"
          description: >-
            Movement of the headline metrics against `previous_window`. Null when there is no
            previous window.
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          description: Prose caveats generated for this specific response.
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definition of each metric in the payload, keyed by metric name.
    GlossaryEntry:
      type: object
      description: One metric's canonical definition.
      additionalProperties: false
      required:
        - metric
        - definition
      properties:
        metric:
          type: string
          description: The metric name, as it appears in payloads.
        definition:
          type: string
          description: What the metric measures.
        denominator:
          type: string
          description: The denominator, when the metric is a ratio.
        gotcha:
          type: string
          description: The mistake this metric most often invites, when there is one.
    GlossaryResponse:
      type: object
      description: The canonical definitions of every metric this API emits.
      additionalProperties: false
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GlossaryEntry"
    AnalyticsFilterOption:
      type: object
      description: One selectable filter value with a human label.
      additionalProperties: false
      required:
        - id
        - display_name
      properties:
        id:
          type: string
          description: The value to pass in the corresponding filter.
        display_name:
          type: string
          description: Human-readable label.
    AnalyticsDateRange:
      type: object
      description: The span of days the org actually has data for.
      additionalProperties: false
      required:
        - earliest_day
        - latest_day
      properties:
        earliest_day:
          type: string
          format: date
          nullable: true
          description: Earliest day with data, or null if none.
        latest_day:
          type: string
          format: date
          nullable: true
          description: Latest day with data, or null if none.
    OrgAnalyticsFiltersResponse:
      type: object
      description: The filter values that have data for this organization.
      additionalProperties: false
      required:
        - models
        - locations
        - prompt_types
        - tags
        - tracked_competitors
        - date_range
        - notes
      properties:
        models:
          type: array
          description: Models with data, each an id to pass in the `models` filter plus a label.
          items:
            $ref: "#/components/schemas/AnalyticsFilterOption"
        locations:
          type: array
          description: Locations with data.
          items:
            type: string
        prompt_types:
          type: array
          description: Funnel stages present in the org's prompts.
          items:
            type: string
        tags:
          type: array
          description: Tag names in use.
          items:
            type: string
        tracked_competitors:
          type: array
          description: The org's tracked competitors, each an id plus a label.
          items:
            $ref: "#/components/schemas/AnalyticsFilterOption"
        date_range:
          $ref: "#/components/schemas/AnalyticsDateRange"
        notes:
          type: array
          items:
            type: string
    MentionSeriesPoint:
      type: object
      description: One time bucket of visibility counts and the ratios derived from them.
      additionalProperties: false
      required:
        - period_start
        - run_count
        - answered_count
        - mentioned_count
        - mention_total
        - tracked_mention_total
        - brand_mention_total
        - rank_sum
        - sentiment
        - mention_rate
        - share_of_voice
        - avg_rank
      properties:
        period_start:
          type: string
          format: date
          description: First day of the bucket (day or ISO week).
        run_count:
          type: integer
          format: int64
          description: >-
            Prompt-run answers attempted in this bucket.
        answered_count:
          type: integer
          format: int64
          description: >-
            Non-empty answers in this bucket — the `mention_rate` denominator for this bucket.
        mentioned_count:
          type: integer
          format: int64
          description: >-
            Answers in this bucket that named your brand.
        mention_total:
          type: integer
          format: int64
          description: >-
            Mention instances for your brand in this bucket.
        tracked_mention_total:
          type: integer
          format: int64
          description: >-
            Mention instances across you plus tracked competitors in this bucket. A raw count for
            your own math — not this bucket's `share_of_voice` denominator.
        brand_mention_total:
          type: integer
          format: int64
          description: >-
            Mention instances across all brands — this bucket's `share_of_voice` denominator.
        rank_sum:
          type: integer
          format: int64
          description: >-
            Sum of your ordinal positions over the answers in this bucket that mentioned you.
        sentiment:
          $ref: "#/components/schemas/SentimentCounts"
        mention_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Of this bucket's non-empty answers (denominator its `answered_count`), the share that
            named your brand. Null when the bucket had no answered runs.
        share_of_voice:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            This bucket's `mention_total` over its `brand_mention_total` — your share of every
            brand mention made in the bucket, on the same denominator as the app's Share of Voice.
            Null when that denominator was zero.
        avg_rank:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            This bucket's `rank_sum` over its `mentioned_count`, where 1 is named first. Null when
            you were not mentioned in the bucket.
    OrgMentionsResponse:
      type: object
      description: The visibility time series with window totals.
      additionalProperties: false
      required:
        - window
        - group_by
        - totals
        - metrics
        - series
        - data_quality
        - notes
        - definitions
      properties:
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        group_by:
          type: string
          description: The bucket the series is grouped by — `day` or `week`, echoing the request.
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        metrics:
          $ref: "#/components/schemas/AnalyticsMetrics"
        series:
          type: array
          items:
            $ref: "#/components/schemas/MentionSeriesPoint"
          description: >-
            One entry per bucket, oldest first. Buckets are grouped from the days that have
            stored data, so a day (or week) with no data is **absent** from the series rather
            than present with zeros — never read a gap as a zero. The window `totals` are
            computed independently of the series, so they still cover the whole window.
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definition of each metric in the payload, keyed by metric name.
    CitationSeriesPoint:
      type: object
      description: One time bucket of citation counts at both grains, with rates (÷D) and shares (÷S).
      additionalProperties: false
      required:
        - period_start
        - run_count
        - answered_count
        - cited_run_count
        - primary_cited_run_count
        - tracked_cited_run_count
        - external_cited_run_count
        - cited_total
        - primary_cited_total
        - tracked_cited_total
        - external_cited_total
        - primary_citation_rate
        - tracked_citation_rate
        - external_citation_rate
        - primary_citation_share
        - tracked_citation_share
        - external_citation_share
      properties:
        period_start:
          type: string
          format: date
          description: First day of the bucket (day or ISO week).
        run_count:
          type: integer
          format: int64
          description: >-
            Prompt-run answers attempted in this bucket.
        answered_count:
          type: integer
          format: int64
          description: >-
            Non-empty answers in this bucket.
        cited_run_count:
          type: integer
          format: int64
          description: >-
            This bucket's `D` — answers carrying at least one citation of any tier. Every rate
            below divides by it.
        primary_cited_run_count:
          type: integer
          format: int64
          description: >-
            Answers in this bucket carrying at least one Owned-tier citation.
        tracked_cited_run_count:
          type: integer
          format: int64
          description: >-
            Answers in this bucket carrying at least one Tracked-tier citation.
        external_cited_run_count:
          type: integer
          format: int64
          description: >-
            Answers in this bucket carrying at least one External (`secondary`) citation.
        cited_total:
          type: integer
          format: int64
          description: >-
            This bucket's `S` — citation instances across all tiers. Every share below divides by
            it.
        primary_cited_total:
          type: integer
          format: int64
          description: >-
            Owned-tier citation instances in this bucket.
        tracked_cited_total:
          type: integer
          format: int64
          description: >-
            Tracked-tier citation instances in this bucket.
        external_cited_total:
          type: integer
          format: int64
          description: >-
            External (`secondary`) citation instances in this bucket. The three tier totals sum to
            this bucket's `cited_total`.
        primary_citation_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Rate for the Owned tier in this bucket. Of the bucket's answers that cited
            anything (denominator `D` = its `cited_run_count`), the share that cited one of your
            own domains. Null when the bucket's `D` was zero.
        tracked_citation_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Rate for the Tracked tier in this bucket, over the same denominator `D`. Null
            when the bucket's `D` was zero.
        external_citation_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Rate for the External tier in this bucket, over the same denominator `D`.
            Null when the bucket's `D` was zero.
        primary_citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for the Owned tier in this bucket. Of the bucket's citation instances
            (denominator `S` = its `cited_total`), the fraction pointing at your own domains. Null
            when the bucket's `S` was zero.
        tracked_citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for the Tracked tier in this bucket, over the same denominator `S`.
            Null when the bucket's `S` was zero.
        external_citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for the External tier in this bucket, over the same denominator `S`.
            The three shares in a bucket sum to exactly 100%. Null when the bucket's `S` was zero.
    OrgCitationsResponse:
      type: object
      description: The citation time series with window totals.
      additionalProperties: false
      required:
        - window
        - group_by
        - totals
        - metrics
        - series
        - data_quality
        - notes
        - definitions
      properties:
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        group_by:
          type: string
          description: The bucket the series is grouped by — `day` or `week`, echoing the request.
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        metrics:
          $ref: "#/components/schemas/AnalyticsMetrics"
        series:
          type: array
          items:
            $ref: "#/components/schemas/CitationSeriesPoint"
          description: >-
            One entry per bucket, oldest first. Buckets are grouped from the days that have
            stored data, so a day (or week) with no data is **absent** rather than zero-filled.
            The window `totals` are computed independently of the series.
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definition of each metric in the payload, keyed by metric name.
    CitationDenominatorBlock:
      type: object
      description: The two citation denominators exposed on the source-grain endpoints.
      additionalProperties: false
      required:
        - cited_run_count
        - cited_total
      properties:
        cited_run_count:
          type: integer
          format: int64
          description: D — answers carrying ≥1 citation of any tier.
        cited_total:
          type: integer
          format: int64
          description: S — total citation instances, all tiers.
        unique_domains:
          type: integer
          format: int64
          description: Distinct cited domains matching the active filter (present on the domains endpoint).
        unique_pages:
          type: integer
          format: int64
          description: Distinct cited pages in the window (present on the pages endpoint).
    CitedDomainItem:
      type: object
      description: One cited domain's window metrics.
      additionalProperties: false
      required:
        - domain
        - tier
        - tier_label
        - cited_run_count
        - cited_total
        - citation_coverage
        - citation_share
        - avg_citation_rank
        - rank_by_citations
      properties:
        domain:
          type: string
          description: The cited domain.
        tier:
          type: string
          description: Its citation tier — one of `primary`, `tracked`, or `secondary`.
        tier_label:
          type: string
          description: The product-facing tier name — `Owned`, `Tracked`, or `External`.
        cited_run_count:
          type: integer
          format: int64
          description: Distinct answers citing this domain.
        cited_total:
          type: integer
          format: int64
          description: Citation instances for this domain.
        citation_coverage:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Coverage for this domain. Of the answers that cited anything (denominator `D`
            = `denominators.cited_run_count`), the share that cited **this** domain. Same
            denominator as the tier Citation Rates, narrower numerator — which is why a tier rate
            is not the sum of its domains' coverages. Null when `D` was zero.
        citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for this domain. Of all citation instances (denominator `S` =
            `denominators.cited_total`), the fraction pointing at this domain. Per-domain shares
            sum to 100% across **all** domains in the window, not across this page of results.
            Null when `S` was zero.
        avg_citation_rank:
          type: number
          nullable: true
          description: Mean citation position across the answers citing it (answer grain); null when no citation-rank data was recorded.
        rank_by_citations:
          type: integer
          description: The domain's 1-based position in the returned ordering — by citation instances by default, or by coverage when sort=coverage.
    OrgCitationDomainsResponse:
      type: object
      description: The paged cited-domain landscape.
      additionalProperties: false
      required:
        - window
        - denominators
        - total
        - limit
        - offset
        - domains
        - data_quality
        - notes
        - definitions
      properties:
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        denominators:
          $ref: "#/components/schemas/CitationDenominatorBlock"
        total:
          type: integer
          description: Total domains matching the filter, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The row offset that was applied.
        domains:
          type: array
          items:
            $ref: "#/components/schemas/CitedDomainItem"
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definition of each metric in the payload, keyed by metric name.
    CitedPagePrompt:
      type: object
      description: One prompt that drove citations of a page.
      additionalProperties: false
      required:
        - prompt_id
        - prompt_text
        - cited_run_count
      properties:
        prompt_id:
          type: string
          description: The prompt's id.
        prompt_text:
          type: string
          description: The prompt text.
        cited_run_count:
          type: integer
          format: int64
          description: Answers to this prompt that cited the page.
    CitedPageItem:
      type: object
      description: One cited URL's window metrics plus the prompts citing it.
      additionalProperties: false
      required:
        - url
        - domain
        - tier
        - tier_label
        - cited_run_count
        - cited_total
        - citation_coverage
        - citation_share
        - avg_citation_rank
        - top_prompts
      properties:
        url:
          type: string
          description: The cited page URL.
        domain:
          type: string
          description: The page's domain.
        tier:
          type: string
          description: Its citation tier — one of `primary`, `tracked`, or `secondary`.
        tier_label:
          type: string
          description: The product-facing tier name — `Owned`, `Tracked`, or `External`.
        cited_run_count:
          type: integer
          format: int64
          description: Distinct answers citing this page.
        cited_total:
          type: integer
          format: int64
          description: Citation instances for this page.
        citation_coverage:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Coverage for this page. Of the answers that cited anything (denominator `D` =
            `denominators.cited_run_count`), the share that cited **this** URL. Answer grain, so
            it is always at or below 100% — it is not citations per run. Null when `D` was zero.
        citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Citation Share for this page. Of all citation instances (denominator `S` =
            `denominators.cited_total`), the fraction pointing at this URL. Per-page shares sum to
            100% across **all** pages in the window, not across this page of results. Null when
            `S` was zero.
        avg_citation_rank:
          type: number
          nullable: true
          description: Mean citation position across the answers citing it (answer grain); null when no citation-rank data was recorded.
        top_prompts:
          type: array
          description: The prompts driving the most citations of this page.
          items:
            $ref: "#/components/schemas/CitedPagePrompt"
    OrgCitationPagesResponse:
      type: object
      description: The paged cited-page table.
      additionalProperties: false
      required:
        - window
        - denominators
        - total
        - limit
        - offset
        - pages
        - data_quality
        - notes
        - definitions
      properties:
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        denominators:
          $ref: "#/components/schemas/CitationDenominatorBlock"
        total:
          type: integer
          description: Total pages matching the filter, across all pages of results.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The row offset that was applied.
        pages:
          type: array
          items:
            $ref: "#/components/schemas/CitedPageItem"
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definition of each metric in the payload, keyed by metric name.
    PromptLatestSnapshot:
      type: object
      nullable: true
      description: >-
        A summary of the most recent answers for a prompt — the "right now" figure,
        distinct from the window aggregates on the row it hangs off.
      additionalProperties: false
      required:
        - run_at
        - answer_count
        - mentioned_count
        - models
        - share_of_voice
      properties:
        run_at:
          type: string
          format: date-time
          nullable: true
          description: When the latest answers were collected, or null if none.
        answer_count:
          type: integer
          description: Number of latest answers summarized.
        mentioned_count:
          type: integer
          description: How many of them mentioned your brand.
        models:
          type: array
          description: The models behind those latest answers.
          items:
            type: string
        share_of_voice:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Mean share of voice across these latest answers — the "right now" figure the Senso
            app's prompt table shows. This is a DIFFERENT question from the `share_of_voice` on
            the row above it, which pools `mention_total` over `brand_mention_total` for the whole
            window; this one averages each latest answer's own share. When reconciling a single
            prompt against the app, compare against this one. Null when none of the latest answers
            carry a share-of-voice value.
