          description: The publish failure, when publishing failed.
    ContentGenerationPublishResult:
      type: object
      description: The publish outcome for one destination of a sample generation.
      additionalProperties: false
      required:
        - publisher
        - status
      properties:
        publisher:
          type: string
        display_url:
          type: string
        status:
          type: string
        error_msg:
          type: string
    ContentGenerationSampleJobError:
      type: object
      description: A safe description of why a sample-generation job failed.
      additionalProperties: false
      required:
        - message
      properties:
        code:
          type: string
          description: A stable machine-readable failure code, when one was recorded.
        message:
          type: string
    ProvenanceStageStatus:
      type: string
      description: >-
        How completely stored evidence covers the stage. `complete` — every expected piece
        of evidence exists and hash-validates; `partial` — some evidence exists but at
        least one piece is missing, ambiguous, or fails validation (the stage's
        `missing_evidence` says exactly what); `missing` — no evidence exists for the
        stage. A stage marked `not_applicable` reports `complete`.
      enum:
        - complete
        - partial
        - missing
    ProvenanceStageApplicability:
      type: string
      description: >-
        Whether the stage is expected to have evidence for this content. `applicable` —
        the stage is part of this content's creation path; `not_applicable` — the stage
        does not apply (for example, no AI generation stage for manually authored
        content), so its `status` is `complete` by definition; `unknown` — the recorded
        creation path is insufficient to determine whether the stage should have
        evidence, so its `status` is reported as `partial`.
      enum:
        - applicable
        - not_applicable
        - unknown
    ContentCreationOrigin:
      type: string
      description: >-
        The recorded path that produced the content version. `builder_ai_generation` —
        AI-generated in Builder; `builder_manual` — manually authored in Builder;
        `content_engine_ai_generation` — AI-generated by the content engine;
        `manual` — manually authored outside Builder; `api_import` — imported through the
        API; `legacy_unknown` — predates origin tracking; `unknown` — the path was not
        recorded.
      enum:
        - builder_ai_generation
        - builder_manual
        - content_engine_ai_generation
        - manual
        - api_import
        - legacy_unknown
        - unknown
    ContentProvenanceStageAssessment:
      type: object
      description: >-
        Why the stage carries its applicability and status, when the audit reached a
        classification worth explaining (typically for `not_applicable` or `unknown`
        stages, or when expected evidence is missing).
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            A stable machine-readable classification (e.g.
            `ai_generation_not_applicable`, `generation_receipt_expected_but_missing`,
            `source_retrieval_not_requested`, `builder_lineage_not_applicable`,
            `creation_origin_unknown`, `legacy_evidence_unavailable`).
        creation_origin:
          $ref: "#/components/schemas/ContentCreationOrigin"
        message:
          type: string
          description: A human-readable explanation of the classification.
    ContentProvenanceActorUser:
      type: object
      description: The user attributed to the action, resolved from stored evidence.
      additionalProperties: false
      required:
        - user_id
        - display_name
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: >-
            The user's given and family name; falls back to the email address, and may be
            empty when neither is recorded.
        email:
          type: string
    ContentProvenanceOriginalAPIKey:
      type: object
      description: >-
        The organization API key that created the original Knowledge Base document behind
        a retrieved source. Attribution is reported only when exactly one candidate key is
        recorded as the document's creator — an ambiguous attribution is never guessed
        (the stage's `missing_evidence` reports the ambiguity instead).
      additionalProperties: false
      required:
        - id
        - organization_id
        - name
        - created_at
        - updated_at
        - expires_at
        - revoked_at
        - last_used_at
        - attribution_scope
        - attribution_basis
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        attribution_scope:
          type: string
          description: >-
            What the key is attributed with — `original_content_creation`: the key created
            the original document, which does not attribute later versions or ingestion
            runs to it.
        attribution_basis:
          type: string
          description: >-
            An identifier for the stored evidence chain the attribution was resolved from.
    ContentProvenanceAPIKeySourceCount:
      type: object
      description: How many retrieved source documents one API key originally created.
      additionalProperties: false
      required:
        - api_key_id
        - name
        - source_count
      properties:
        api_key_id:
          type: string
          format: uuid
        name:
          type: string
        source_count:
          type: integer
    ContentProvenanceIngestionSummary:
      type: object
      description: Aggregate counts over the retrieved source versions and their ingestion evidence.
      additionalProperties: false
      required:
        - retrieved_source_version_count
        - source_versions_with_ingestion_run
        - completed_ingestion_run_count
        - persisted_chunk_count
        - actor_type_counts
        - human_attributed_source_count
        - system_api_or_unattributed_source_count
        - api_key_attributed_source_count
        - distinct_original_api_key_count
        - source_count_by_api_key
      properties:
        retrieved_source_version_count:
          type: integer
          description: How many distinct source content versions the generation retrieved.
        source_versions_with_ingestion_run:
          type: integer
          description: How many of those versions have a recorded ingestion run.
        completed_ingestion_run_count:
          type: integer
          description: How many of those versions have an ingestion run recorded as `complete`.
        persisted_chunk_count:
          type: integer
          description: Total currently persisted chunks across the retrieved source versions.
        actor_type_counts:
          type: object
          description: >-
            Source-version counts keyed by the recorded ingestion actor kind (`user`,
            `api_key`, `system`, `scheduled_job`); sources with no recorded actor are
            counted under `unattributed`.
          additionalProperties:
            type: integer
        human_attributed_source_count:
          type: integer
          description: Sources whose ingestion is attributed to a specific user.
        system_api_or_unattributed_source_count:
          type: integer
          description: Sources without a specific user attribution.
        api_key_attributed_source_count:
          type: integer
          description: Sources whose original document creation is attributed to a specific API key.
        distinct_original_api_key_count:
          type: integer
          description: How many distinct API keys appear in `source_count_by_api_key`.
        source_count_by_api_key:
          type: array
          items:
            $ref: "#/components/schemas/ContentProvenanceAPIKeySourceCount"
    ContentProvenanceIngestionSource:
      type: object
      description: One retrieved source content version and its ingestion evidence.
      additionalProperties: false
      required:
        - content_id
        - content_version_id
        - content_version_num
        - content_version_title
        - content_version_created_at
        - persisted_chunk_count
        - original_api_key_candidate_count
      properties:
        content_id:
          type: string
          format: uuid
        content_version_id:
          type: string
          format: uuid
        content_version_num:
          type: integer
          format: int64
        content_version_title:
          type: string
        content_version_created_at:
          type: string
          format: date-time
        ingestion_run_id:
          type: string
          format: uuid
          description: The recorded ingestion run for this version, when one exists.
        ingestion_status:
          type: string
          description: The ingestion run's recorded status (e.g. `complete`).
        source_strategy_id:
          type: string
          description: The extraction strategy the ingestion run used.
        actor_type:
          type: string
          description: >-
            The kind of actor recorded on the ingestion run (`user`, `api_key`, `system`,
            or `scheduled_job`); absent when no actor was recorded.
        ingestion_created_at:
          type: string
          format: date-time
        ingestion_updated_at:
          type: string
          format: date-time
        ingestion_completed_at:
          type: string
          format: date-time
        persisted_chunk_count:
          type: integer
          description: Chunks currently persisted for this version.
        original_api_key_candidate_count:
          type: integer
          description: >-
            How many distinct API keys are recorded as candidate creators of the original
            document. Attribution is reported in `original_api_key` only when this is
            exactly 1.
        actor_user:
          $ref: "#/components/schemas/ContentProvenanceActorUser"
        original_api_key:
          $ref: "#/components/schemas/ContentProvenanceOriginalAPIKey"
    ContentProvenanceIngestionStage:
      type: object
      description: >-
        How the Knowledge Base sources retrieved for the generation entered the system:
        their recorded ingestion runs, statuses, timestamps, and actor attribution.
      additionalProperties: false
      required:
        - status
        - applicability
        - source_link_basis
        - summary
        - sources
        - what_can_be_proven
        - missing_evidence
      properties:
        status:
          $ref: "#/components/schemas/ProvenanceStageStatus"
        applicability:
          $ref: "#/components/schemas/ProvenanceStageApplicability"
        assessment:
          $ref: "#/components/schemas/ContentProvenanceStageAssessment"
        source_link_basis:
          type: string
          description: >-
            How the retrieved source versions were linked to this content:
            `generation_receipt` — from the chunks recorded on the accepted generation
            receipt; `builder_workspace_message_sources_legacy` — from legacy
            document-level Builder message sources (weaker: does not prove the exact
            generation context); `missing` — no link basis exists; `not_applicable` — the
            stage does not apply.
        summary:
          $ref: "#/components/schemas/ContentProvenanceIngestionSummary"
        sources:
          type: array
          description: Per-source ingestion evidence, one entry per resolvable retrieved source version.
          items:
            $ref: "#/components/schemas/ContentProvenanceIngestionSource"
        what_can_be_proven:
          type: array
          items:
            type: string
        missing_evidence:
          type: array
          items:
            type: string
    ContentProvenanceSourceStage:
      type: object
      description: >-
        The exact source material supplied to the generation: the stored retrieval chunks
        and the formatted model context, validated against the receipt's SHA-256 hashes.
      additionalProperties: false
      required:
        - status
        - applicability
        - source_retrievals
        - formatted_context
        - what_can_be_proven
        - missing_evidence
      properties:
        status:
          $ref: "#/components/schemas/ProvenanceStageStatus"
        applicability:
          $ref: "#/components/schemas/ProvenanceStageApplicability"
        assessment:
          $ref: "#/components/schemas/ContentProvenanceStageAssessment"
        receipt_id:
          type: string
          format: uuid
          description: The accepted generation receipt the evidence comes from; absent when no receipt exists.
        source_retrieval_status:
          type: string
          description: >-
            The receipt's recorded retrieval outcome — `not_requested`, `completed`, or
            `failed`; absent when no receipt exists.
        source_retrievals:
          description: >-
            The receipt's captured retrieval payload, returned verbatim — a JSON array of
            retrieval objects carrying the ordered source chunks (each with its content
            identifiers, text, and per-chunk SHA-256). `[]` when no receipt exists or the
            stored payload fails validation against the receipt contract.
        formatted_context:
          type: string
          description: >-
            The exact formatted context string handed to the model; empty when no receipt
            exists.
        formatted_context_sha256:
          type: string
          description: The receipt's SHA-256 of the formatted context; absent when no receipt exists.
        what_can_be_proven:
          type: array
          items:
            type: string
        missing_evidence:
          type: array
          items:
            type: string
    ContentProvenanceCreationStage:
      type: object
      description: >-
        The accepted AI generation attempt: who or what triggered it, the model used, the
        captured request, and hash validation of the request and generated output against
        the stored target version. Fields sourced from the receipt are absent when no
        accepted receipt exists.
      additionalProperties: false
      required:
        - status
        - applicability
        - generation_request
        - what_can_be_proven
        - missing_evidence
      properties:
        status:
          $ref: "#/components/schemas/ProvenanceStageStatus"
        applicability:
          $ref: "#/components/schemas/ProvenanceStageApplicability"
        assessment:
          $ref: "#/components/schemas/ContentProvenanceStageAssessment"
        receipt_id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
          description: The user who triggered the generation, when one is recorded.
        actor_type:
          type: string
          description: >-
            The kind of actor that triggered the generation (`user`, `api`, `scheduled`,
            or `system`).
        trigger_source:
          type: string
          description: >-
            The flow that recorded the accepted generation (e.g.
            `org_content_generation`, `ad_hoc_content_generation`,
            `builder_v2_draft_document`).
        accepted_attempt_number:
          type: integer
          description: Which generation attempt was accepted (1-based).
        model_provider:
          type: string
        model_name:
          type: string
        generation_request:
          description: >-
            The accepted attempt's captured model request payload, returned verbatim.
            `{}` when no receipt exists or the stored payload is not valid JSON.
        generation_request_sha256:
          type: string
          description: The receipt's SHA-256 of the canonicalized request payload.
        generated_output_sha256:
          type: string
          description: The receipt's SHA-256 of the generated output.
        generated_workspace_version_id:
          type: string
          format: uuid
          description: The Builder workspace version the generation produced, when it targeted a workspace.
        generated_content_version_id:
          type: string
          format: uuid
          description: The content version the generation produced, when it targeted content directly.
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        what_can_be_proven:
          type: array
          items:
            type: string
        missing_evidence:
          type: array
          items:
            type: string
    ContentProvenanceEditingVersion:
      type: object
      description: One Builder workspace version in the content's editing history.
      additionalProperties: false
      required:
        - workspace_version_id
        - source
        - created_at
        - markdown_sha256
      properties:
        workspace_version_id:
          type: string
          format: uuid
        parent_workspace_version_id:
          type: string
          format: uuid
        source_content_version_id:
          type: string
          format: uuid
          description: The content version this workspace version was loaded from, when it started from saved content.
        source:
          type: string
          description: >-
            What produced the workspace version (e.g. `initial`, `manual_autosave`,
            `ai_draft`, `ai_refine`, `rollback`).
        created_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        markdown_sha256:
          type: string
          description: SHA-256 of the workspace version's stored markdown.
    ContentProvenanceEditingStage:
      type: object
      description: >-
        The Builder workspace lineage linking the published content version to its exact
        editing history.
      additionalProperties: false
      required:
        - status
        - applicability
        - saved_as_content_version_id
        - versions
        - what_can_be_proven
        - missing_evidence
      properties:
        status:
          $ref: "#/components/schemas/ProvenanceStageStatus"
        applicability:
          $ref: "#/components/schemas/ProvenanceStageApplicability"
        assessment:
          $ref: "#/components/schemas/ContentProvenanceStageAssessment"
        workspace_id:
          type: string
          format: uuid
          description: The Builder workspace the published version came from, when one is linked.
        published_from_workspace_version_id:
          type: string
          format: uuid
          description: The exact workspace version saved as the published content version, when recorded.
        saved_as_content_version_id:
          type: string
          format: uuid
          description: The published content version the editing history resolves to.
        versions:
          type: array
          description: >-
            The workspace version history across the content's lineage, ordered by
            sequence within each workspace (versions of different workspaces interleave
            by creation time).
          items:
            $ref: "#/components/schemas/ContentProvenanceEditingVersion"
        what_can_be_proven:
          type: array
          items:
            type: string
        missing_evidence:
          type: array
          items:
            type: string
    ContentProvenancePublicationEvidence:
      type: object
      description: One destination record for the published content version.
      additionalProperties: false
      required:
        - publish_record_id
        - state
      properties:
        publish_record_id:
          type: string
          format: uuid
        publisher_id:
          type: string
          format: uuid
        publisher_name:
          type: string
        publisher_type:
          type: string
          description: >-
            The destination's publisher kind: `citeables`, or `manual` for content you
            published yourself and recorded via manual publish.
        state:
          type: string
          description: The publish record's state.
          enum:
            - pending
            - publishing
            - live
            - failed
            - unpublishing
            - unpublished
            - stale
        external_content_id:
          type: string
        external_url:
          type: string
          description: The recorded published URL, when one exists.
        published_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
    ContentProvenancePublicationStage:
      type: object
      description: >-
        Every destination record tied to the published content version, and the human
        publishing actor when a matching published status-change audit event exists (an
        actor is never guessed).
      additionalProperties: false
      required:
        - status
        - applicability
        - published_content_version_id
        - records
        - publishing_actor
        - what_can_be_proven
        - missing_evidence
      properties:
        status:
          $ref: "#/components/schemas/ProvenanceStageStatus"
        applicability:
          $ref: "#/components/schemas/ProvenanceStageApplicability"
        assessment:
          $ref: "#/components/schemas/ContentProvenanceStageAssessment"
        published_content_version_id:
          type: string
          format: uuid
        records:
          type: array
          description: >-
            All destination records for the content version — including the record that
            resolved the audited URL — ordered by publish/attempt time.
          items:
            $ref: "#/components/schemas/ContentProvenancePublicationEvidence"
        publishing_actor:
          type: object
          nullable: true
          description: >-
            The user attributed with publishing, resolved from the closest published
            status-change audit event; `null` when no matching event exists.
          additionalProperties: false
          required:
            - user_id
            - display_name
            - attribution_basis
          properties:
            user_id:
              type: string
              format: uuid
            display_name:
              type: string
              description: >-
                The user's given and family name; falls back to the email address, and
                may be empty when neither is recorded.
            email:
              type: string
            audit_event_at:
              type: string
              format: date-time
              description: When the correlated audit event was recorded.
            attribution_basis:
              type: string
              description: >-
                An identifier for the stored evidence the attribution was resolved from.
        what_can_be_proven:
          type: array
          items:
            type: string
        missing_evidence:
          type: array
          items:
            type: string
    ContentProvenanceStages:
      type: object
      description: The five audit stages, in creation order.
      additionalProperties: false
      required:
        - ingestion
        - source
        - creation
        - editing
        - publication
      properties:
        ingestion:
          $ref: "#/components/schemas/ContentProvenanceIngestionStage"
        source:
          $ref: "#/components/schemas/ContentProvenanceSourceStage"
        creation:
          $ref: "#/components/schemas/ContentProvenanceCreationStage"
        editing:
          $ref: "#/components/schemas/ContentProvenanceEditingStage"
        publication:
          $ref: "#/components/schemas/ContentProvenancePublicationStage"
    ContentProvenanceAuditResponse:
      type: object
      description: >-
        A five-stage provenance audit for one published URL. Every stage carries a
        `status` (how completely stored evidence covers it), an `applicability` (whether
        the stage is expected for this content's creation path), plain-language
        `what_can_be_proven` and `missing_evidence` lists, and an `assessment` explaining
        the classification when one applies.
      additionalProperties: false
      required:
        - published_url
        - content_id
        - content_version_id
        - overall_status
        - stages
      properties:
        published_url:
          type: string
          description: The audited URL, echoed back (trimmed of surrounding whitespace).
        content_id:
          type: string
          format: uuid
          description: The content item the URL resolved to.
        content_version_id:
          type: string
          format: uuid
          description: The exact published content version the URL resolved to.
        creation_origin:
          $ref: "#/components/schemas/ContentCreationOrigin"
        overall_status:
          type: string
          description: >-
            The audit's rollup across the applicable stages: `complete` when every
            applicable stage is complete and no stage's applicability is unknown (also
            when no stage is applicable); `missing` when every applicable stage is
            missing; `partial` otherwise.
          enum:
            - complete
            - partial
            - missing
        stages:
          $ref: "#/components/schemas/ContentProvenanceStages"
    ProductLineDetails:
      type: object
      description: >-
        Open-ended JSON object describing this product line — the keys and values are
        yours to define (SKUs, URLs, positioning, pricing tiers, anything downstream
        generation and evaluation should know). The server requires a JSON object but
        never validates the contents; what you store is re-serialized in canonical
        form — key order is normalized and numbers are re-encoded (integers above
        2^53 lose precision), so send very large identifiers as strings.
      additionalProperties: true
    ProductLineResponse:
      type: object
      description: One product line.
      additionalProperties: false
      required:
        - product_line_id
        - org_id
        - name
        - details
        - created_at
        - updated_at
      properties:
        product_line_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        details:
          $ref: "#/components/schemas/ProductLineDetails"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductLineListResponse:
      type: object
      description: One page of product lines.
      additionalProperties: false
      required:
        - product_lines
        - total
        - limit
        - offset
      properties:
        product_lines:
          type: array
          description: The page's product lines, newest first.
          items:
            $ref: "#/components/schemas/ProductLineResponse"
        total:
          type: integer
          description: >-
            The number of product lines in this page (at most `limit`) — not the
            organization-wide count.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The offset that was applied.
    CreateProductLineRequest:
      type: object
      description: >-
        `name` is required (trimmed; must not collide with another active product
        line's name). `details` is optional — omit it to start with `{}`; when
        provided it must be a JSON object (`null` or any other JSON type is a `400`).
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        details:
          $ref: "#/components/schemas/ProductLineDetails"
    UpdateProductLineRequest:
      type: object
      description: >-
        Full replacement. `name` is required (trimmed); `details`, when omitted, resets
        the stored details to `{}`. When provided, `details` must be a JSON object.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        details:
          $ref: "#/components/schemas/ProductLineDetails"
    PatchProductLineRequest:
      type: object
      description: >-
        Partial update — supply at least one of `name` or `details`. `name`, when
        provided, is trimmed. `details` is shallow-merged into the stored object by
        top-level key; it must itself be a JSON object.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        details:
          $ref: "#/components/schemas/ProductLineDetails"
    ContentEnginePublishRequest:
      type: object
      description: >-
        Publishes generated markdown as a content item. `raw_markdown` and `seo_title`
        are required; `geo_question_id` is optional. `builder_workspace_id` and
        `expected_workspace_version_id` must be supplied together.
      additionalProperties: false
      required:
        - raw_markdown
        - seo_title
      properties:
        geo_question_id:
          type: string
          format: uuid
          description: >-
            The prompt this content answers.
        content_id:
          type: string
          format: uuid
          description: The existing content item to publish a new version of, if updating.
        generation_run_id:
          type: string
          format: uuid
          description: >-
            The generation run this publish belongs to, if any.
        generation_receipt_id:
          type: string
          format: uuid
        ever_published:
          type: boolean
          description: Legacy compatibility field; ignored by the server.
        raw_markdown:
          type: string
        seo_title:
          type: string
        summary:
          type: string
        publisher_ids:
          type: array
          description: The destinations to publish to. Omit to use the org's configured destinations.
          items:
            type: string
            format: uuid
        mark_as_published:
          type: boolean
          description: Record the content as already published externally rather than publishing it now.
        manual_published_at:
          type: string
          format: date-time
          description: When it was published externally (mark_as_published only).
        manual_published_url:
          type: string
          description: Where it went live (mark_as_published only); used for citation attribution.
        builder_workspace_id:
          type: string
          format: uuid
        expected_workspace_version_id:
          type: string
          format: uuid
    PublishDestResult:
      type: object
      description: The publish outcome for a single destination.
      additionalProperties: false
      required:
        - publisher
        - display_url
        - status
      properties:
        publisher:
          type: string
        display_url:
          type: string
        status:
          type: string
          description: "The per-destination publish status: `success`, `failed`, or `queued`."
        error_msg:
          type: string
    ContentEnginePublishResponse:
      type: object
      description: The result of publishing a content item.
      additionalProperties: false
      required:
        - content_id
        - version_id
        - version_num
        - citeables_action
        - publish_status
        - editorial_status
        - publish_destination
      properties:
        content_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_num:
          type: integer
          format: int64
        citeables_action:
          type: string
          description: Legacy informational field.
        publish_status:
          type: string
          description: "Overall publish status: `success` or `failed`."
        editorial_status:
          type: string
          description: The content's editorial state after publishing (e.g. `published`, `draft`).
        publish_destination:
          type: string
          description: Legacy single-destination label.
        publish_destinations:
          type: array
          description: Per-destination publish results.
          items:
            $ref: "#/components/schemas/PublishDestResult"
        marked_as_published:
          type: boolean
          description: Whether the content was recorded as manually published.
        source_workspace_version_id:
          type: string
          format: uuid
    BrandKitGuidelines:
      type: object
      description: >-
        The brand guidelines document. A closed object — the server rejects unknown
        fields with `400`. Every field is optional, and no field may be `null`.
      additionalProperties: false
      properties:
        brand_name:
          type: string
          description: The company name.
        brand_domain:
          type: string
          description: The company's website URL.
        brand_description:
          type: string
          description: >-
            What the company is, the problem it addresses, its approach, what users
            get, and why customers trust it.
        voice_and_tone:
          type: string
          description: >-
            The communication style generated content should follow — language
            patterns, what to avoid, dos and don'ts.
        author_persona:
          type: string
          description: The ideal content author, described as a specific persona.
        global_writing_rules:
          type: array
          description: >-
            Directional writing rules for the AI writer (e.g. "prefer concrete
            examples", "avoid superlatives").
          items:
            type: string
    BrandKitResponse:
      type: object
      description: The organization's brand kit.
      additionalProperties: false
      required:
        - brand_kit_id
        - org_id
        - guidelines
        - created_at
        - updated_at
      properties:
        brand_kit_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        guidelines:
          $ref: "#/components/schemas/BrandKitGuidelines"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpsertBrandKitRequest:
      type: object
      description: A full-replacement write of the brand kit guidelines.
      additionalProperties: false
      required:
        - guidelines
      properties:
        guidelines:
          $ref: "#/components/schemas/BrandKitGuidelines"
    PatchBrandKitRequest:
      type: object
      description: >-
        A partial update of the brand kit guidelines. Fields present in `guidelines`
        replace the stored fields; omitted fields are kept. At least one field is
        required.
      additionalProperties: false
      required:
        - guidelines
      properties:
        guidelines:
          $ref: "#/components/schemas/BrandKitGuidelines"
    WebsiteImportRunResponse:
      type: object
      description: >-
        One website import. The same shape describes a run that is still going and one
        that has finished; the fields only a finished run has are absent while it runs.
      additionalProperties: false
      required:
        - run_id
        - status
        - source_url
        - pages_fetched
        - pages_ingested
        - brand_kit_generated
        - created_at
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            Lifecycle state. `queued` and `running` mean the import is still in flight;
            `completed` and `failed` are final and never change.
          enum:
            - queued
            - running
            - completed
            - failed
        source_url:
          type: string
          description: The website this import read, resolved from your organization's website on file.
        pages_fetched:
          type: integer
          description: Pages successfully read from the site, including the home page. `0` until the fetch stage finishes.
        pages_ingested:
          type: integer
          description: >-
            Pages written into the knowledge base as new documents. Lower than
            `pages_fetched` when a page's content was already in the knowledge base
            unchanged — the normal case when re-importing the same site — or when an
            individual page could not be stored. The import only fails outright if no
            page at all could be stored.
        brand_kit_generated:
          type: boolean
          description: >-
            Whether this import wrote a brand kit. `false` both while the import is still
            running and when generation was deliberately skipped — `brand_kit_skip_reason`
            distinguishes the two.
        brand_kit_skip_reason:
          type: string
          description: >-
            Why brand kit generation was skipped. Present only on a finished import that
            skipped it; a skip is a success, not a failure.
          enum:
            - already_populated
        error_code:
          type: string
          description: >-
            Why the import failed. Present only on a `failed` import. `NO_WEBSITE`: no
            usable website was on file. `HOMEPAGE_FETCH_FAILED`: the home page could not
            be read. `INGESTION_FAILED`: every page failed to reach the knowledge base.
            `GENERATION_FAILED`: the brand kit could not be generated. `FEATURE_UNAVAILABLE`:
            website import is not available for this deployment. `INTERNAL_ERROR`: an
            unexpected failure.
          enum:
            - NO_WEBSITE
            - HOMEPAGE_FETCH_FAILED
            - INGESTION_FAILED
            - GENERATION_FAILED
            - FEATURE_UNAVAILABLE
            - INTERNAL_ERROR
        error_message:
          type: string
          description: A human-readable description of the failure. Present only on a `failed` import.
        created_at:
          type: string
          format: date-time
          description: When the import was requested.
        started_at:
          type: string
          format: date-time
          description: When the import began working. Absent until it leaves `queued`.
        completed_at:
          type: string
          format: date-time
          description: When the import reached `completed` or `failed`. Absent while it is still in flight.
    WebsiteImportStatusResponse:
      type: object
      description: >-
        Your organization's import state. Both fields are independently null: neither is
        set before the first import, `current` alone during one, and `latest_completed`
        alone once it has finished.
      additionalProperties: false
      required:
        - current
        - latest_completed
      properties:
        current:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WebsiteImportRunResponse"
          description: >-
            The import in flight, always `queued` or `running`. Null when nothing is
            running. Poll while this is non-null.
        latest_completed:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WebsiteImportRunResponse"
          description: >-
            The most recently finished import, whether it succeeded or failed. Null until
            one has finished. Read every outcome here, including failures — a finished
            import never appears in `current`.
    WebsiteImportConflictResponse:
      type: object
      description: >-
        Returned when a trigger collides with an import that is already running. Carries
        that run so the collision becomes something to poll rather than an error to act on.
      additionalProperties: false
      required:
        - status
        - message
        - current
      properties:
        status:
          type: integer
          description: The HTTP status code, repeated in the body.
        message:
          type: string
        current:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WebsiteImportRunResponse"
          description: The import already in flight. Poll it instead of retrying the trigger.
    WebsiteImportErrorResponse:
      type: object
      description: >-
        A website import failure that carries a stable machine code alongside the message,
        for the cases a client branches on rather than just displays.
      additionalProperties: false
      required:
        - status
        - message
        - error_code
      properties:
        status:
          type: integer
          description: The HTTP status code, repeated in the body.
        message:
          type: string
        error_code:
          type: string
          description: The stable reason code. See `error_code` on a run for the full set.
    ContentTypeConfigInput:
      type: object
      description: >-
        A content-type config as you SEND it. A closed object — the server rejects
        unknown fields with `400`. Every field is optional and none may be `null`; an
        empty object is accepted. The server canonicalizes what you send before storing
        it (see `ContentTypeConfig` for the stored form).
      additionalProperties: false
      properties:
        template:
          type: string
          description: >-
            A markdown template describing the desired output structure. Markdown
            headings — plus short heading-like lines and word-budget-annotated
            paragraphs — become sections of the derived `template_spec`, and
            word-budget annotations in the text (e.g. `(100-150 words)`,
            `(target: 300 words)`, `(max 500 words total)`) become word budgets.
        template_spec:
          allOf:
            - $ref: "#/components/schemas/TemplateSpec"
          description: >-
            Accepted and loosely validated (on input, `sections` may be omitted), but
            IGNORED — the server always re-derives `template_spec` from `template`
            when storing the config.
        cta_text:
          type: string
          description: Call-to-action text to include in generated content.
        cta_destination:
          type: string
          description: >-
            Call-to-action link. When non-empty, must be an absolute URL (with scheme
            and host) — `400` otherwise.
        writing_rules:
          type: array
          description: >-
            Writing rules for this content type, applied on top of the brand kit's
            global rules. Entries are trimmed and empty entries dropped.
          items:
            type: string
    ContentTypeConfig:
      type: object
      description: >-
        A content-type config as the server RETURNS it — the canonicalized stored form.
        `template`, `cta_text` and `cta_destination` are always present (empty strings
        when not configured, values trimmed); `writing_rules` is always present but
        `null` when no rules are configured; `template_spec` is derived from `template`
        and present only when `template` is non-empty.
      additionalProperties: false
      required:
        - template
        - cta_text
        - cta_destination
        - writing_rules
      properties:
        template:
          type: string
          description: >-
            The markdown template describing the desired output structure, trimmed. Empty string
            when none is configured. See `ContentTypeConfigInput.template` for how it is written
            and parsed.
        template_spec:
          $ref: "#/components/schemas/TemplateSpec"
        cta_text:
          type: string
        cta_destination:
          type: string
        writing_rules:
          type: array
          nullable: true
          items:
            type: string
    TemplateSpec:
      type: object
      description: >-
        The parsed structure of a content-type `template`, derived by the server:
        one section per markdown heading (short heading-like lines and word-budget-
        annotated paragraphs also start sections), with word budgets extracted from
        annotations in the template text.
      additionalProperties: false
      required:
        - parser_version
        - source_format
        - sections
      properties:
        parser_version:
          type: integer
          description: Version of the template parser that produced this spec. Currently `1`.
        source_format:
          type: string
          description: The template's source format. Always `freeform_markdown`.
        total_word_budget:
          $ref: "#/components/schemas/WordBudget"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSectionSpec"
        parse_warnings:
          type: array
          description: Non-fatal issues encountered while parsing the template.
          items:
            type: string
    WordBudget:
      type: object
      description: >-
        A word-count constraint. Each bound is optional; `min_words` must not exceed
        `max_words`, and every value must be positive.
      additionalProperties: false
      properties:
        min_words:
          type: integer
        max_words:
          type: integer
        target_words:
          type: integer
          description: Generated output is expected within ±10% of this count.
    TemplateSectionSpec:
      type: object
      description: One section of a parsed template.
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: A slug derived from the section title, unique within the spec.
        title:
          type: string
        instructions:
          type: string
          description: The section's body text from the template, budget annotations removed.
        required:
          type: boolean
          description: >-
            Accepted on write but never set by the server's template parser, so it does
            not appear in derived specs.
        word_budget:
          $ref: "#/components/schemas/WordBudget"
    ContentTypeResponse:
      type: object
      description: A content type — an output template for generated content.
      additionalProperties: false
      required:
        - content_type_id
        - org_id
        - name
        - config
        - created_at
        - updated_at
      properties:
        content_type_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        config:
          $ref: "#/components/schemas/ContentTypeConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentTypeListResponse:
      type: object
      description: A page of the organization's content types.
      additionalProperties: false
      required:
        - content_types
        - total
        - limit
        - offset
      properties:
        content_types:
          type: array
          items:
            $ref: "#/components/schemas/ContentTypeResponse"
        total:
          type: integer
          description: >-
            The number of content types in THIS page (at most `limit`) — not the
            organization's total count.
        limit:
          type: integer
          description: The limit that was applied.
        offset:
          type: integer
          description: The offset that was applied.
    CreateContentTypeRequest:
      type: object
      description: Creates a content type.
      additionalProperties: false
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The content type's name, unique within the organization. Leading/trailing
            whitespace is trimmed; a blank name is a `400`.
        config:
          $ref: "#/components/schemas/ContentTypeConfigInput"
    UpdateContentTypeRequest:
      type: object
      description: Fully replaces a content type's name and config.
      additionalProperties: false
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The content type's name, unique within the organization. Leading/trailing
            whitespace is trimmed; a blank name is a `400`.
        config:
          $ref: "#/components/schemas/ContentTypeConfigInput"
    PatchContentTypeRequest:
      type: object
      description: >-
        Partially updates a content type. At least one of `name` or `config` must be
        provided (`400` otherwise). A provided `config` is shallow-merged into the
        stored config and the result re-canonicalized.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            A new name, unique within the organization. Whitespace is trimmed; a blank
            name is a `400`. A `null` name is treated as absent.
        config:
          allOf:
            - $ref: "#/components/schemas/ContentTypeConfigInput"
          description: >-
            A config fragment. Must itself be a valid config object (only allowed
            fields, valid values). Top-level fields you send replace the stored
            fields; omitted fields are kept. Because the result is re-canonicalized,
            sending `template` also regenerates `template_spec`.
    ContentVersionUploaderResponse:
      type: object
      description: Provenance of a content version — who or what produced it.
      additionalProperties: false
      required:
        - actor_type
      properties:
        actor_type:
          type: string
          description: "Who produced the version: `user`, `api_key`, `system`, or `scheduled_job`."
        user_id:
          type: string
          format: uuid
          description: The uploading user's id (present when `actor_type` is `user` and still resolvable).
        email:
          type: string
        given_name:
          type: string
        family_name:
          type: string
    ContentDetailResponse:
      type: object
      description: A content item with its current version's full body and provenance.
      additionalProperties: false
      required:
        - id
        - org_id
        - type
        - content_type
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [raw, web, file]
          description: The content's source kind.
        title:
          type: string
        summary:
          type: string
        tags:
          $ref: "#/components/schemas/ContentTagsInfo"
        org_tags:
          type: array
          items:
            $ref: "#/components/schemas/TagResponse"
        version_num:
          type: integer
          format: int64
        editorial_status:
          type: string
          description: The editorial workflow state (e.g. `draft`, `published`).
        processing_status:
          type: string
          enum: [pending, processing, complete, failed]
          description: The ingestion status of the content.
        error_code:
          type: string
          description: Stable classification of an ingestion failure; present only when `processing_status` is `failed`.
        text:
          type: string
          description: The document body — raw text for raw documents, extracted markdown (or HTML) for web documents.
        content_type:
          type: string
          description: The MIME type of the content (e.g. `text/markdown`, `application/pdf`).
        uploaded_by:
          $ref: "#/components/schemas/ContentVersionUploaderResponse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdatePermissionRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum: [viewer, editor]
          description: The new role. Only `viewer` and `editor` can be assigned.
    KBNodeGrantListResponse:
      type: object
      additionalProperties: false
      required:
        - grants
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/KBNodeGrant"
    MessageResponse:
      type: object
      description: A simple acknowledgement message.
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
