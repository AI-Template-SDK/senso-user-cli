          format: int64
          description: >-
            Mention instances across all brands on this prompt — this row's `share_of_voice`
            denominator.
        rank_sum:
          type: integer
          format: int64
          description: >-
            Sum of your ordinal positions over the answers to this prompt that mentioned you.
        sentiment:
          $ref: "#/components/schemas/SentimentCounts"
        cited_run_count:
          type: integer
          format: int64
          description: >-
            This prompt's `D` — its answers carrying at least one citation of any tier.
        primary_cited_run_count:
          type: integer
          format: int64
          description: >-
            This prompt's answers carrying at least one Owned-tier citation. The numerator of
