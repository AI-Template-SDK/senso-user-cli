        mention_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            Of this prompt's non-empty answers (denominator its own `answered_count`), the share
            that named your brand. Null when the prompt had no answered runs in the window.
        share_of_voice:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            This prompt's `mention_total` over its `brand_mention_total` — your share of every
            brand mention made on this prompt, on the same denominator as the app's Share of
            Voice. Null when that denominator was zero.
        avg_rank:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            This prompt's `rank_sum` over its `mentioned_count`, where 1 is named first. Null when
            the prompt never mentioned you.
        primary_citation_rate:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
