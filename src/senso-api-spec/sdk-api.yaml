        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Tags — /org/tags
  # ──────────────────────────────────────────────
  /org/tags:
    get:
      tags: [Tags]
      summary: List tags
      description: Returns your organization's tag library. Usage counts are optional.
      operationId: orgListTags
      parameters:
        - name: counts
          in: query
          description: Include per-tag usage counts.
          schema:
            type: boolean
            default: false
        - name: include_uncurated
          in: query
          description: Also include machine-minted tags not yet in the curated vocabulary (see the `curated` field).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The organization's tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tags]
      summary: Create a tag
      description: >-
        Adds a tag to your organization's library. Names are trimmed of surrounding
        whitespace. If an uncurated tag already holds the name (case-insensitively),
        that tag is adopted — promoted to curated, renamed to your casing — and returned
        with its existing id. `409` only when a curated tag already holds the name.
      operationId: orgCreateTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
            example:
              name: mortgages
      responses:
        "201":
          description: The created tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/tags/{id}:
    get:
      tags: [Tags]
      summary: Get a tag
      description: Returns one tag with its usage counts.
      operationId: orgGetTag
      parameters:
        - name: id
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The tag, always including its usage counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tags]
      summary: Rename a tag
      description: >-
        Changes a tag's name (trimmed of surrounding whitespace). Renaming also marks
        the tag curated.
      operationId: orgUpdateTag
      parameters:
        - name: id
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
            example:
              name: home-loans
      responses:
        "200":
          description: The updated tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Tags]
      summary: Delete a tag
      description: >-
        Deletes a tag and removes it from everything it was attached to — prompts,
        content items, knowledge-base nodes, and recorded search queries.
      operationId: orgDeleteTag
      parameters:
        - name: id
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tag was deleted. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # API Keys — /org/api-keys (read-only over the API)
  # Creating, updating, revoking, and deleting keys, and setting their KB scope,
