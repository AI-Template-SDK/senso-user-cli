      parameters:
        - name: versionId
          in: path
          required: true
          description: The content version's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The version was restored to draft. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/generated-content/drafts:
    get:
      tags: [Content]
