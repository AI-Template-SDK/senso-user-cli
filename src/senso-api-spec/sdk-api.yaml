openapi: 3.0.0
info:
  title: Senso Org API
  version: 1.13.0
  description: |
    The Senso API lets you ingest raw sources, query your compiled knowledge base, and generate verified content — all scoped to your organization.

    Authenticate every request with the `X-API-Key` header using your org API key.

servers:
  - url: https://apiv2.senso.ai/api/v1
    description: Production server

security:
  - OrgApiKey: []

tags:
  - name: Organization
    description: Your organization is the container for your knowledge base, API keys, and all compiled content. Every raw source you ingest is scoped here.
  - name: Industries
    description: |
      The public catalogue of industries Senso tracks. Each industry carries a set of prompts that run on a schedule against multiple AI models and locations, building up a history of how brands appear in AI answers for that sector.

      Browse the catalogue to find industries relevant to your organization and see how much prompt, model, and location coverage each one has. The catalogue is the same for every organization.
  - name: Users
    description: Manage who can ingest, query, and generate within your organization. Assign roles to control access.
  - name: Roles
    description: |
      Each organization gets its own copy of the built-in roles (`admin`, `collaborator`, `viewer`) plus any custom roles. List roles to discover the `role_id` you need when inviting users or changing their role — those endpoints accept `role_id` only.
  - name: API Keys
    description: |
      API keys authenticate your agents against your knowledge base. Each key is scoped to your organization — create separate keys for different agents, environments, or integrations.

      Keys can be further restricted to specific KB folders, so an external agent only queries what you allow.
  - name: Search
    description: >-
      Query your compiled knowledge base — get grounded AI answers, raw context chunks, or
      matching source IDs. Every search call consumes search credits.


      An **unscoped** key (no KB folder grants — the default for a new key) searches your
      entire knowledge base. A key that has been **scoped** to specific KB folders (see
      `GET /org/api-keys/{keyId}/kb-permissions`) searches only within those folders.


      An answering search (`/org/search`, `/org/search/full`, `/org/search/stream`) that finds nothing becomes an API search gap in your organization's gap report — see **Gaps**. Send `X-Senso-Signals: off` to keep automated or test searches out of it.
  - name: Gaps
    description: |
      The questions and claims your knowledge base could not back up, and what was decided about each — the same queue the Senso app shows as the Gap Report.

      **API search gaps.** A search through `POST /org/search`, `/org/search/full` or `/org/search/stream` (or the MCP server's `senso_search` tool in `answer` or `full` mode, or the CLI) that finds nothing files a gap with `origin.kind` `api_unanswered_question`, `surfaces` `[api_search]`, `problem` `not_found` and `kind` `missing`. The first such search for a question files it as `weak`, which the default list leaves out; a second, from any caller, makes it `open`. Questions match after folding case, whitespace and surrounding punctuation. A later API search for the same question that returns a sourced answer resolves the gap; a Quick Search answer in the app does not, and an API answer never resolves a Quick Search gap. `/org/search/context` and `/org/search/content` never file gaps, and searches made before API search gaps shipped never became gaps.

      **Keeping automated searches out.** Send `X-Senso-Signals: off` on test, monitoring or synthetic searches. The search still runs, consumes credits and is recorded; it just never counts towards a gap.

      Requires the Fetch product and the `bypass:kb_acl` permission, which organization API keys have.
  - name: Evals
    description: |
      Judge text against your organization's ground truth. An eval run applies one evaluator to one subject — a saved content item or text you supply — and records every claim it checked, the verdict, and the evidence behind it, so a score can be audited rather than trusted.

      Two evaluators are built in. `kb_accuracy` extracts the factual claims a text makes about your brand and verifies each one against your knowledge base. `brand_alignment` grades the text against the writing rules in your brand kit. Checking one text for both is two runs, on purpose: the two questions fail independently, and one score must never cover for the other.

      Runs execute on a worker. A trigger returns a run to poll, or holds the connection with `wait: true` and returns the finished result. Model cost is recorded on each run for transparency but is not billed against your credit balance.
  - name: Knowledge Base
    description: |
      Manage your knowledge base — the folder tree where all your ingested raw sources get compiled and stored.

      Your KB is structured like a file system: **folders** organize content, and **documents** (ingested files or raw text) hold the compiled knowledge that powers queries and content generation.

      In the API, both folders and documents are called **nodes**. Every node has a `kb_node_id`, a `type` (`folder` or `content`), and a `parent_id` linking it to its parent folder. The root folder has `parent_id: null`.
  - name: Brand Kit
    description: |
      Your org-wide identity config — voice, tone, persona, and writing rules. The brand kit ensures every piece of generated content sounds like you, not like generic AI output.

      Set it once, and it applies to all content generation calls. Without a brand kit, generated content has no identity guidance.
  - name: Website Import
    description: |
      One call that seeds your organization from its own public website: it fetches your home page plus the pages linked from it, ingests them into your knowledge base as documents, and — if you have no brand kit yet — drafts one from what it read.

      The site it imports is the website on file for your organization (`GET /org/me`), not something you pass in. Set it with `PUT /org/me` before the first import.

      An import runs in the background. Trigger it, then poll the status endpoint until `current` is `null` and read the outcome from `latest_completed`. Only one import can be in flight per organization at a time.
  - name: Content Types
    description: |
      Output templates that control the format, structure, and rules for each kind of generated content. Think of them as compilation targets — the shape your knowledge base gets compiled into.

      Every generation call requires a content type. A "FAQ Article" produces different output than a "LinkedIn Post", even from the same ingested sources.
  - name: Content Generation
    description: |
      Generate verified content by querying your compiled knowledge base. The engine combines your brand kit (voice), content type (format), and ingested raw sources (knowledge) to produce grounded output.

      Every fact in the generated content traces back to a source in your knowledge base — auditable and verifiable.
  - name: Content Engine
    description: Publish verified content to configured destinations or save drafts for editorial review. The last step in the ingest → compile → query → generate → publish pipeline.
  - name: Destinations
    description: |
      Manage the publish destinations available to your org. Every org with content generation enabled starts linked to the default shared destinations Senso provides — those are the targets used when a publish call names no explicit publishers.

      Today every destination is of type `citeables`. Shared destinations are provided by Senso and can be enabled per org; orgs can also register their own `citeables` domains, and remove any destination with a choice of what to do with live content (`leave`, `unpublish`, or `delete`).
  - name: Content
    description: |
      Manage compiled content items — both ingested raw sources and generated output. Track processing status, editorial workflow, verification state, and version history.
  - name: Members
    description: List members of your organization — the people and agents who can access your knowledge base.
  - name: Prompts
    description: |
      Manage prompts — the questions that drive content generation. Each prompt represents a question you want AI to answer well using your compiled knowledge base (e.g. "What are the current mortgage rates?").

      The `geo_question_id` you see in content generation requests is a prompt ID.
  - name: History Imports
    description: |
      When your organization adopts prompts from its industry, the run history already collected for that industry is copied onto your own prompts so your analytics start with data instead of an empty chart.

      Each of those back-fills is a job you can follow here. A job reports how many of your prompts it matched and how many historic runs it copied — read those counts rather than the status alone, because a job that matched nothing still finishes successfully.
  - name: Credits
    description: Track ingest, query, and generation usage against your org credit balance.
  - name: Builder
    description: Builder-mode generation runs — track how agents compile, query, and generate against your knowledge base in real time.
  - name: Run Configuration
    description: Configure AI models and generation schedules for your compilation and generation pipeline.
  - name: Questions
    description: Lightweight CRUD for prompts — the queries your knowledge base is optimized to answer. Use /org/prompts for the same data with full generation run history.
  - name: Permissions
    description: Available role permissions for controlling who can ingest, query, and generate.
  - name: Tags
    description: |
      Org-scoped labels attached to prompts, KB nodes, content items, and search queries. Use tags to group prompts by topic, content by campaign, or products by release — anything you want to filter or roll up metrics by.

      **Auto-tagging.** Senso auto-tags on creation for every taggable resource: prompts at `POST /org/prompts`, raw content at `POST /org/kb/raw` and uploaded files once ingestion finishes, and search queries as they're received on `/org/search*`. The tag library grows on its own — most callers never need to hit the tag-library endpoints directly.

      Every taggable endpoint still accepts tags by id **or** by name. When you attach by name, missing tags are created automatically within your organization.
  - name: Product Lines
    description: |
      Flexible org-scoped product/service definitions. Each product line has a name and an arbitrary JSON `details` blob — use it to describe the brand lines Senso should reason about when generating or evaluating content.

      Product lines are referenced by downstream generation and evaluation pipelines; the `details` schema is intentionally open so you can carry whatever structured metadata (SKUs, URLs, positioning statements, etc.) your workflows need.
  - name: Tracked Competitors
    description: |
      A curated list of competitor brands your organization wants to monitor. Tracked competitors feed downstream analytics (share-of-voice across prompt runs, citation comparisons) and inform content-generation prompts.

      Manage entries directly (create / update / delete), batch-import suggestions, or call `POST /org/competitors/suggest` to get AI-generated suggestions seeded from your organization's website and recent prompt-run results.
  - name: Tracked Sources
    description: |
      Per-org citation-classification rules that tier each cited URL as Owned (`primary`), Tracked (`tracked`), or External (`secondary`). Tracked sources drive share-of-voice and citation analytics by deciding which domains/paths count as your own content versus third-party.

      Each rule matches by `domain`, `host`, `path_prefix`, or `exact_url`. Rules created from published content (`source_origin: published`) are read-only.
  - name: Analytics
    description: |
      Read-only GEO analytics for your own organization — how often AI answers mention you, which sources those answers cite, and which of your monitored prompts you win or lose. Every response is scoped to the org that owns the API key; the org is taken from your credentials, never from a path or query parameter, so there is no cross-org read to get wrong.

      **Every cited URL falls into exactly one tier.** `primary` (Owned) is one of your own websites, `tracked` (Tracked) is one of your configured tracked sources, and `secondary` (External) is any other domain. The tiers partition citations but *not* answers — one answer can carry citations of all three tiers. That is why the per-tier *rates* below can sum past 100% while the per-tier *shares* sum to exactly 100%.

      **There are two denominators, and they are never mixed.** `D` is `cited_run_count`, the number of answers carrying at least one citation of any tier. `S` is `cited_total`, the number of citation instances — every cited URL counted separately. **Citation Rate** (per tier) and **Citation Coverage** (per domain or page) both divide by `D` and count distinct answers. **Citation Share** (per tier or per source) divides by `S` and counts cited URLs. An answer that cites you once alongside nine third-party URLs contributes a full 1/1 to your primary Citation Rate but only 1/10 to your primary Citation Share — a high rate with a low share means you get cited but are outnumbered inside every answer. Both denominators ship in the `totals` block of every window-scoped payload (the domains/pages endpoints carry them in `denominators`), so you can always redo the math or build a metric we did not ship.

      **Share of Voice divides by every brand mention, not by your tracked set.** `share_of_voice` is your `mention_total` over `brand_mention_total` — mention instances of every brand the models named, whether you track that brand or not. That is exactly the Share of Voice the Senso app reports, and the two are expected to agree to the digit. `tracked_mention_total` (you plus your tracked competitors) also ships in `totals`, but it is deliberately **not** the denominator: an organization with no tracked competitors has `tracked_mention_total` equal to `mention_total`, which would pin Share of Voice at 100% whenever you were mentioned at all. Divide by it yourself if you want the head-to-head view against your tracked set, and read that number knowing it moves whenever you edit the list. This API counts every other brand in `brand_mention_total` but never names them.

      **Answer text exists only for the latest answer per prompt × model × location.** `GET /org/analytics/answers/latest` and the `latest_answers` block of the prompt drill-down return full response text, citations, and competitor mentions for the newest answer of each combination — and nothing older. History is retained as daily additive counts only, so a time series can tell you how often you were mentioned last March but never what the model actually said. Do not treat the latest answers as a sample of a window — and note that `from`/`to` on `/org/analytics/answers/latest` filter on each answer's collection time (`run_at`), which hides combinations whose latest answer falls outside the window rather than returning older ones.

      **Built for agents as much as for developers.** Every window-scoped response carries the effective `window`, the additive `totals` behind every ratio, a `data_quality` flag, `notes[]` (prose caveats generated for that specific response), and `definitions{}` (one-line metric definitions naming each denominator); the glossary, filters, and latest-answers endpoints carry only the parts that apply to them. Every ratio ships as `{value, display}` — `value` is the unrounded 0–1 float for math, `display` is safe to quote verbatim. A ratio is `null`, never `0`, when its denominator was zero: null means "not measured", not "measured as zero". Call `GET /org/analytics/glossary` once to learn the whole vocabulary before you quote a number.
  - name: CTA Templates
    description: |
      Manage the call-to-action (CTA) templates your published content-engine pages can carry — a card with a heading, supporting copy, an optional image, and a button. One template can be the org default; each content item then inherits the default, pins a specific template, or opts out via its CTA selection (`/org/content/{id}/cta`).

paths:
  # ──────────────────────────────────────────────
  # Organization — /org/me
  # ──────────────────────────────────────────────
  /org/me:
    get:
      tags: [Organization]
      summary: Get your organization
      description: Returns the full details of the organization that owns the API key.
      operationId: orgGetSelf
      responses:
        "200":
          description: Your organization's details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Organization]
      summary: Update your organization
      description: >-
        Updates editable organization fields. Only fields present in the body are
        changed; `websites` and `locations`, when provided, replace the existing lists.
      operationId: orgUpdateSelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
            example:
              name: Acme Corporation
              slug: acme
              logo_url: https://acme.example.com/logo.png
              websites:
                - url: https://acme.example.com
              locations:
                - country_code: US
                  region_name: California
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/me/runs-enabled:
    patch:
      tags: [Organization]
      summary: Toggle the runs master switch
      description: >-
        Pauses or resumes the organization's scheduled question runs by setting
        `enable_runs`. (Content generation has its own switch.)
      operationId: orgSetRunsEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRunsEnabledRequest"
            example:
              enable_runs: false
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/me/industry:
    put:
      tags: [Organization]
      summary: Set your organization's industry
      description: >-
        Sets the industry your organization belongs to, chosen from the public catalogue
        (`GET /org/industries`). Only an industry in the public catalogue can be chosen;
        any other id is a `404`.


        Your industry is what the prompt import works from: only prompts belonging to it
        can be imported, and the run history copied onto them is the history collected
        for it. It is also where an organization with no AI models or locations of its
        own gets them when it is first activated. Reading an industry's results does not
        require it to be yours — those endpoints accept any industry in the catalogue.


        Setting the industry does nothing else on its own: no prompts are created and no
        runs start.


        The industry can be set only once. Once your organization has one this returns a
        `409` naming the industry it already has; changing it afterwards is not
        self-serve. Returns your organization with the industry applied.
      operationId: orgSetIndustry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOrgIndustryRequest"
            example:
              industry_id: 3f2b6a0e-8c1d-4e5f-9a7b-2c4d6e8f0a1b
      responses:
        "200":
          description: Your organization, with the industry applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No industry in the public catalogue has that id, or your organization no
            longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Your organization's industry is already set and cannot be changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ──────────────────────────────────────────────
  # Industries — /org/industries
  # ──────────────────────────────────────────────
  /org/industries:
    get:
      tags: [Industries]
      summary: List public industries
      description: >-
        Returns one page of the public industry catalogue — the industries Senso tracks
        that any organization can browse. Every row is public and the catalogue is the
        same for every organization; it is not scoped to your organization or narrowed
        by anything you have configured. Each row carries the counts you need to judge
        an industry's coverage: how many prompts it runs, how many AI models it runs
        against, and how many countries it covers.
      operationId: orgListPublicIndustries
      parameters:
        - name: search
          in: query
          description: >-
            Case-insensitive substring match against the industry `name` or `slug`.
            Omit to return the whole catalogue.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (1–100). Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of items to skip. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          description: Sort order. Name sorts are case-insensitive.
          schema:
            type: string
            enum: [name_asc, name_desc, created_asc, created_desc]
            default: name_asc
        - name: live
          in: query
          description: >-
            When `true`, return only industries that are actively running — at least one
            AI model enabled and at least one active prompt. Industries that fail this
            check have no result history to draw on. Defaults to `false`, which returns
            the full catalogue. A non-boolean value is a `400`.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: One page of public industries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicIndustryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/industries/{id}/brands:
    get:
      tags: [Industries]
      summary: Brand leaderboard for an industry
      description: >-
        Returns the brands the AI answers named in this industry over a date window,
        ranked by how many answers mentioned each one, with mention totals, average
        position, sentiment counts, the most-cited domain, and trends against the
        previous window of the same length. Figures are counts rather than rates so
        you can compute shares against `totals` yourself. Ranks and trends are
        computed over the whole leaderboard before paging, so a later page still
        shows global ranks. You can read any industry in the public catalogue
        (`GET /org/industries`) and your organization's own industry; any other id
        is a `404`. Requires the GEO product.
      operationId: orgGetIndustryBrands
      parameters:
        - $ref: "#/components/parameters/IndustryID"
        - $ref: "#/components/parameters/IndustryFrom"
        - $ref: "#/components/parameters/IndustryTo"
        - $ref: "#/components/parameters/IndustryModels"
        - $ref: "#/components/parameters/IndustryLocation"
        - name: limit
          in: query
          description: Page size (1–100). Defaults to 100; larger values are clamped to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          description: Number of brands to skip. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: canonicalize
          in: query
          description: >-
            When `true` (the default), spelling variants of the same brand are merged
            into one row and listed under `surface_forms`. Set `false` for the raw
            per-spelling leaderboard.
          schema:
            type: boolean
            default: true
        - name: rollup
          in: query
          description: >-
            `parent` folds sub-brands into the company that owns them, giving one row
            per parent company. Off by default, because sub-brands are entities people
            genuinely compare. Ignored when `canonicalize` is `false`; any other value
            is ignored.
          schema:
            type: string
        - name: entity_type
          in: query
          description: >-
            Comma-separated entity types to keep — for example `brand` to drop
            regulators and generic terms from a competitive table. Known types are
            `brand`, `regulator`, `publisher`, `government`, `generic_term`,
            `product_model`, and `forum_social`; an unclassified row counts as `brand`.
            Omit to keep every row. The filter is applied before paging, so `total`
            and every page contain only the kept types. `mentions_rank` stays the
            brand's position in the full landscape, so a filtered table can skip
            rank numbers.
          schema:
            type: string
      responses:
        "200":
          description: One page of the industry's brand leaderboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryBrandLeaderboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/industries/{id}/brands/{brand}:
    get:
      tags: [Industries]
      summary: Look up a brand in an industry by name
      description: >-
        Everything about one brand in the industry over the window, found by fuzzy
        name match and merged across spelling variants: mention rate, share of voice,
        average position, rank, sentiment, the most-cited domain, and a per-model
        breakdown. A brand the answers never named returns `200` with `mentioned`
        false and null `metrics`, not a `404`. A name never seen before is registered,
        so the response always carries a stable `brand_id`; use
        `GET /org/industries/{id}/brands-by-id/{brand_id}` for repeat calls. Reads are
        limited to the public catalogue and your organization's own industry.
        Requires the GEO product.
      operationId: orgGetIndustryBrandByName
      parameters:
        - $ref: "#/components/parameters/IndustryID"
        - $ref: "#/components/parameters/IndustryBrandName"
        - $ref: "#/components/parameters/IndustryFrom"
        - $ref: "#/components/parameters/IndustryTo"
        - $ref: "#/components/parameters/IndustryModels"
        - $ref: "#/components/parameters/IndustryLocation"
      responses:
        "200":
          description: The brand's standing in the industry over the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryBrandDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/industries/{id}/brands-by-id/{brand_id}:
    get:
      tags: [Industries]
      summary: Look up a brand in an industry by id
      description: >-
        The same payload as the lookup by name, addressed by the stable `brand_id`
        and with no fuzzy matching — the repeatable call once a brand has been
        discovered. A brand that exists but was never mentioned in this industry and
        window returns `200` with `mentioned` false and null `metrics`. An id that
        was merged into another brand
        resolves to the surviving brand and returns that brand's id, so stored ids
        self-heal. Only an id that was never issued is a `404`. Reads are limited to
        the public catalogue and your organization's own industry. Requires the GEO
        product.
      operationId: orgGetIndustryBrandByID
      parameters:
        - $ref: "#/components/parameters/IndustryID"
        - $ref: "#/components/parameters/IndustryBrandID"
        - $ref: "#/components/parameters/IndustryFrom"
        - $ref: "#/components/parameters/IndustryTo"
        - $ref: "#/components/parameters/IndustryModels"
        - $ref: "#/components/parameters/IndustryLocation"
      responses:
        "200":
          description: The brand's standing in the industry over the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryBrandDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/industries/{id}/domains/{domain}:
    get:
      tags: [Industries]
      summary: Look up a domain's citations in an industry
      description: >-
        How often the AI answers in this industry cited one domain over the window:
        the number of citations, its rank among cited domains, its share of all
        citations, and the brands most often named alongside it. Pass a bare domain in
        the path, or a full URL in `url`, which takes precedence; `resolved` reports
        the host as queried and the base domain it was matched to. A domain that was
        never cited returns `200` with `cited` false, not a `404`. Reads are limited
        to the public catalogue and your organization's own industry. Requires the GEO
        product.
      operationId: orgGetIndustryDomain
      parameters:
        - $ref: "#/components/parameters/IndustryID"
        - $ref: "#/components/parameters/IndustryDomain"
        - name: url
          in: query
          description: A full URL to look up instead of the path domain. Takes precedence when supplied.
          schema:
            type: string
        - $ref: "#/components/parameters/IndustryFrom"
        - $ref: "#/components/parameters/IndustryTo"
        - $ref: "#/components/parameters/IndustryModels"
        - $ref: "#/components/parameters/IndustryLocation"
      responses:
        "200":
          description: The domain's citation standing in the industry over the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryDomainDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Roles, Permissions & Members
  # ──────────────────────────────────────────────
  /org/industries/{id}/prompts:
    get:
      tags: [Industries]
      summary: List an industry's prompts
      description: >-
        Returns one page of the prompts an industry runs — the ids you pass to
        `POST /org/industries/{id}/prompts/import` to adopt them, and to
        `POST /org/content-generation/industry-prompt-draft` to draft from one. You can
        read any industry in the public catalogue (`GET /org/industries`) and your
        organization's own industry; any other id is a `404`.


        Only the industry's active prompts are listed. A prompt switched off at the
        industry collects no new results and is rejected by the import, so it is left out.


        `funnel_stage` is the stage the prompt would have in your organization once
        imported, so the stage you pick by is the stage you get.


        Each prompt also carries how it went over the date window. `models` has one
        entry per AI model that answered it, with your own brand overlaid: how many
        answers that model gave, and how many of them named you. `top_three_mentioned`
        is the three brands named most often on that prompt by anyone — so a prompt
        whose `models` show no mentions of you, next to a full `top_three_mentioned`,
        is one worth looking at: the AI answers it, and the brands it names are not
        yours.


        The window bounds the FIGURES, never the list. Every active prompt is returned
        whether or not it has results in the window; one without them carries `[]` for
        both.


        Figures are grouped into whole weeks, Monday to Sunday, UTC. A week is counted
        when its Monday falls inside `from`–`to`, so a `from` that lands mid-week starts
        the figures at the following Monday, and the last week is counted in full even
        where it runs past `to`. Pass Mondays for exact weekly slices. `window` echoes
        the dates you asked for.


        Prompts come back oldest first, in a stable order. `limit` and `offset` are
        validated rather than adjusted: a `limit` above 100 is a `400`, not a silently
        smaller page. Requires the GEO product.
      operationId: orgListIndustryPrompts
      parameters:
        - $ref: "#/components/parameters/IndustryID"
        - $ref: "#/components/parameters/IndustryFrom"
        - $ref: "#/components/parameters/IndustryTo"
        - $ref: "#/components/parameters/IndustryModels"
        - $ref: "#/components/parameters/IndustryLocation"
        - name: limit
          in: query
          description: Page size (1-100). Defaults to 50. Anything else is a `400`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: >-
            Number of prompts to skip. Defaults to 0. A negative or non-integer value is
            a `400`.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of the industry's active prompts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgIndustryPromptListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/industries/{id}/answers/latest:
    get:
      tags: [Industries]
      summary: Latest industry answers
      description: >-
        The newest stored answer for each of your industry's prompts, from each AI model at
        each location, with the full response text — and for every answer, whether it named
        your brand, where in the answer, and in what tone. This is how you find the prompts
        the AI answers without you, and read exactly what it says when it does.


        Only your organization's own industry can be read here; any other id is a `404`.
        Requires the GEO product.


        Each prompt × model × location has exactly one newest answer, so there is no date
        window: `since` hides combinations whose newest answer is older than that day
        rather than returning older answers. Ask "which prompts does this model answer
        without naming me" with `mentioned=false` and `models` set to that one model —
        every other model's answer to the same prompt is a separate row, and you have not
        asked for it.


        Answers where the model returned nothing are left out unless you pass
        `include_empty=true`. An answer with no text names no brands, so it would otherwise
        read as an answer that left you out.


        The same brand is named in one answer as `Rival Bank` and in another as `Rival`;
        `brands[].key` is the same for both, so you can group on it. Paged, newest first.
        `limit` and `offset` are validated rather than adjusted: a `limit` above 100 is a
        `400`, not a silently smaller page.
      operationId: orgListIndustryLatestAnswers
      parameters:
        - $ref: "#/components/parameters/IndustryID"
        - name: mentioned
          in: query
          description: >-
            Restrict to answers that did (`true`) or did not (`false`) name your brand.
            Omit for all answers.
          schema:
            type: boolean
        - $ref: "#/components/parameters/IndustryModels"
        - $ref: "#/components/parameters/IndustryLocation"
        - name: prompt_ids
          in: query
          description: >-
            Comma-separated prompt ids (from `GET /org/industries/{id}/prompts`) to
            restrict to. Omit for every prompt. An id that is not a uuid is a `400`.
          schema:
            type: string
        - name: since
          in: query
          description: >-
            Only include answers collected on or after this day, `YYYY-MM-DD`. Omit for no
            lower bound.
          schema:
            type: string
            format: date
        - name: include_empty
          in: query
          description: >-
            `true` to include answers where the model returned nothing. Defaults to
            `false`.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Page size (1-100). Defaults to 25. Anything else is a `400`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: >-
            Number of answers to skip. Defaults to 0. A negative or non-integer value is a
            `400`.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: >-
            One page of the industry's newest answers. When the industry has no results
            yet, or is not included in your plan, `answers` is empty and `notes` says so.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgIndustryAnswersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/industries/{id}/prompts/import:
    post:
      tags: [Prompts]
      summary: Import prompts from your industry
      description: >-
        Copies prompts from your organization's industry into your organization and starts
        importing the run history already collected for them, so their analytics begin with
        data instead of an empty chart. History is copied only for the AI models and
        locations your organization runs, and only to prompts whose text matches the
        industry prompt's.


        Only your organization's own industry is accepted: any other industry id, and an
        organization with no industry, is a `403`. Every requested prompt must be a live,
        active prompt of that industry with text that fits a prompt, and no two may share
        the same text; otherwise the whole request is rejected with a `400` naming the
        offending ids and nothing is changed.


        Once accepted, each prompt is either `created` or `skipped` because your
        organization already holds a prompt with the same text. Sending the same request
        again is safe — prompts already present are skipped, and the history import is
        started again or, if one is still running, that one is returned. Importing
        activates your organization and starts its scheduled runs. Any prompts already
        saved to the organization that were not yet running will begin running as well.
        Should the request fail after it was accepted, prompts created before the failure
        remain and the organization may already be activated; send the same request again
        to finish.


        Follow the history import with `GET /org/history-imports/{importId}` using the
        returned `history_import.import_id`. A `completed` import may have copied nothing —
        read its `prompts_count` and `historic_runs_imported` rather than the status alone.
        Requires the GEO product.
      operationId: orgImportIndustryPrompts
      parameters:
        - name: id
          in: path
          required: true
          description: Your organization's industry id. Any other industry is a `403`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportIndustryPromptsRequest"
            example:
              prompt_ids:
                - 3f2b6a0e-8c1d-4e5f-9a7b-2c4d6e8f0a1b
                - 7a9c1e3f-5b7d-4f9a-8c2e-4d6f8a0b2c3d
      responses:
        "200":
          description: >-
            One outcome per requested prompt, in request order, plus the history import
            that was started, found already running, or could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportIndustryPromptsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/permissions:
    get:
      tags: [Permissions]
      summary: List available permissions
      description: >-
        Returns the permission actions offered for building org roles. The set is
        curated — a few platform-internal permissions are not listed here.
      operationId: orgGetAvailablePermissions
      responses:
        "200":
          description: The available permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailablePermissionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/roles:
