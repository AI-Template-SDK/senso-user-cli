        - org_id
        - org_name
        - status
        - active
        - trigger_mode
        - trigger_source
        - actor_type
        - selection_source
        - publisher_selection_source
        - requested_prompt_count
        - resolved_prompt_count
        - pending_items
        - running_items
        - succeeded_items
        - failed_items
        - skipped_items
        - stopped_items
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          format: uuid
        run_group_id:
          type: string
          format: uuid
          description: The bulk-trigger group this run belongs to, when it was started as part of one.
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        status:
          type: string
          enum:
            [
              queued,
              dispatch_failed,
              running,
              skipped,
              completed,
              partial_failed,
              failed,
              blocked,
              stopped,
            ]
        active:
          type: boolean
          description: Whether the run is still in flight.
        trigger_mode:
          type: string
          description: How the run was started — `manual` or `scheduled`.
        trigger_source:
          type: string
          description: >-
            A label identifying what initiated the run (e.g. `org_content_generation` or
            `scheduler`).
        actor_user_id:
          type: string
          format: uuid
          description: The triggering user, when a user started the run.
        actor_type:
          type: string
          description: >-
            The kind of actor that started the run (e.g. `user`, `api_key`, `system`,
            or `scheduled_job`).
        actor_name:
          type: string
        actor_email:
          type: string
        selected_content_type_id:
          type: string
          format: uuid
          description: The content type the run generated with, when one was selected.
        selection_source:
          type: string
          description: >-
            How the content type was chosen: `run_override` (passed on the trigger),
            `org_default` (the org's selected content type), or `generic_fallback`
            (no content type configured).
        selected_publishers:
          type: array
          description: The destinations the run publishes to, when any were resolved.
          items:
            $ref: "#/components/schemas/PublisherResponse"
        publisher_selection_source:
          type: string
          description: >-
            How the publisher set was chosen: `run_override` (passed on the trigger),
            `org_default` (the org's configured destinations), or `none` (publishing
            disabled or nothing configured).
        requested_prompt_ids:
          type: array
          nullable: true
          description: >-
            The prompt ids explicitly requested for this run; `null` (or absent) when the
            trigger did not name any.
          items:
            type: string
            format: uuid
        requested_prompt_count:
          type: integer
        resolved_prompt_count:
          type: integer
          description: How many prompts the run actually materialized items for.
        pending_items:
          type: integer
        running_items:
          type: integer
        succeeded_items:
          type: integer
        failed_items:
          type: integer
        skipped_items:
          type: integer
        stopped_items:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
