        Creates a new user (if they don't exist yet) and adds them to your organization.
        If the email already belongs to a user, that user is added and their given/family
        names are updated to the supplied values.
      operationId: orgInviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteOrgUserRequest"
            example:
              email: jordan@example.com
              given_name: Jordan
              family_name: Lee
              role_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "201":
          description: The created membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/users/invite/existing:
    post:
      tags: [Users]
      summary: Invite an existing user by email
      description: Adds an existing Senso user, looked up by email, to your organization.
      operationId: orgInviteExistingUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteExistingOrgUserRequest"
            example:
              email: jordan@example.com
              role_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "201":
          description: The created membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/users/{userId}:
    get:
      tags: [Users]
      summary: Get a user's membership
      description: Returns one user's membership record in your organization.
      operationId: orgGetUser
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The membership record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user's role
      description: Changes a member's role in your organization.
      operationId: orgUpdateUserRole
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgUserRoleRequest"
            example:
              role_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "200":
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Remove a user from the organization
      description: >-
        Removes a user's membership from your organization. This also deletes the user's
        knowledge-base grants and group memberships — re-adding the user later does not
        restore them.
      operationId: orgRemoveUser
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The user was removed. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/users/{userId}/current:
    patch:
      tags: [Users]
      summary: Set a user's current org
      description: >-
        Marks your organization as the given user's currently selected org. Only
        `is_current: true` is accepted — this endpoint cannot un-set a current org.
      operationId: orgSetUserCurrentOrg
      parameters:
        - name: userId
