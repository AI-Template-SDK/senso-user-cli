        - window
        - totals
        - metrics
        - total
        - limit
        - offset
        - prompts
        - data_quality
        - notes
        - definitions
      properties:
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        metrics:
          $ref: "#/components/schemas/AnalyticsMetrics"
        total:
          type: integer
          description: Total prompts matching the filter, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The row offset that was applied.
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/PromptPerformanceItem"
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definition of each metric in the payload, keyed by metric name.
    AnswerCitation:
      type: object
      description: One cited URL inside a stored answer.
      additionalProperties: false
      required:
        - url
        - domain
        - citation_type
      properties:
        url:
          type: string
          description: The cited URL.
        domain:
          type: string
          description: The cited URL's domain.
        citation_type:
          type: string
          description: Its citation tier — one of `primary`, `tracked`, or `secondary`.
    LatestAnswerItem:
      type: object
      description: The most recent stored answer for one prompt × model × location.
      additionalProperties: false
      required:
        - prompt_id
        - prompt_text
        - prompt_type
        - provider
        - model
        - location
        - run_at
        - response_text
        - empty
        - mentioned
        - rank
        - sentiment
        - sov_pct
        - citations
        - competitor_mentions
        - has_primary_citation
        - has_tracked_citation
        - has_external_citation
      properties:
        prompt_id:
          type: string
          description: The prompt's id.
        prompt_text:
          type: string
          description: The prompt text.
        prompt_type:
          type: string
          description: >-
            The prompt's funnel stage, canonicalized — typically `awareness`,
            `consideration`, `evaluation`, or `decision`. A non-standard stored type is
            echoed lowercased.
        provider:
          type: string
          description: The model provider.
        model:
          type: string
          description: The model identifier.
        location:
          type: string
          description: The location the answer was collected for.
        run_at:
          type: string
          format: date-time
          description: When the answer was collected.
        response_text:
          type: string
          description: The model's full answer text.
        empty:
          type: boolean
          description: Whether the model returned an empty answer.
        mentioned:
          type: boolean
          description: Whether the answer named your brand.
        rank:
          type: integer
          nullable: true
          description: Your brand's ordinal position in the answer (1 = named first), or null if not mentioned.
        sentiment:
          type: string
          nullable: true
          description: Mention sentiment — `positive`, `neutral`, or `negative` — or null if not mentioned.
        sov_pct:
          type: number
          nullable: true
          description: Your share of brand mentions within this single answer, as a percentage (0–100), or null if not applicable.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AnswerCitation"
        competitor_mentions:
          type: object
          additionalProperties:
            type: integer
          description: Mention counts within this answer for your tracked competitors, keyed by competitor name.
        has_primary_citation:
          type: boolean
          description: Whether the answer cited an owned domain.
        has_tracked_citation:
          type: boolean
          description: Whether the answer cited a tracked source.
        has_external_citation:
          type: boolean
          description: Whether the answer cited a third-party domain.
    OrgLatestAnswersResponse:
      type: object
      description: The paged latest-answer feed. No date window by construction.
      additionalProperties: false
      required:
        - total
        - limit
        - offset
        - answers
        - notes
        - definitions
      properties:
        total:
          type: integer
          description: Total answers matching the filter, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The row offset that was applied.
        answers:
          type: array
          items:
            $ref: "#/components/schemas/LatestAnswerItem"
        notes:
          type: array
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definitions of the metrics behind this payload, keyed by glossary metric name (not by response field name).
    OrgAnalyticsPromptDetailResponse:
      type: object
      description: One prompt's metric history plus its latest full answers.
      additionalProperties: false
      required:
        - prompt_id
        - prompt_text
        - prompt_type
        - tags
        - window
        - totals
        - metrics
        - series
        - latest_answers
        - data_quality
        - notes
        - definitions
      properties:
        prompt_id:
          type: string
          description: The prompt's id.
        prompt_text:
          type: string
          description: The prompt text.
        prompt_type:
          type: string
          description: >-
            The prompt's funnel stage, canonicalized — typically `awareness`,
            `consideration`, `evaluation`, or `decision`. A non-standard stored type is
            echoed lowercased.
        tags:
          type: array
          items:
            type: string
        window:
          $ref: "#/components/schemas/AnalyticsWindow"
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        metrics:
          $ref: "#/components/schemas/AnalyticsMetrics"
        series:
          type: array
          items:
            $ref: "#/components/schemas/MentionSeriesPoint"
          description: >-
            Daily visibility counts and ratios for this prompt, oldest first — the only record of
            what happened earlier in the window, and counts only, never answer text. Days with no
            data are absent rather than zero-filled.
        latest_answers:
          type: array
          description: The latest full answers per model × location. Empty when include_answers=false.
          items:
            $ref: "#/components/schemas/LatestAnswerItem"
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definition of each metric in the payload, keyed by metric name.

    # ── Organization ──────────────────────────
    OrgWebsite:
      type: object
      description: A website associated with the organization.
      additionalProperties: false
      required:
        - org_website_id
        - url
      properties:
        org_website_id:
          type: string
          format: uuid
        url:
          type: string
    OrgLocation:
      type: object
      description: A geographic market the organization is monitored in.
      additionalProperties: false
      required:
        - org_location_id
        - country_code
      properties:
        org_location_id:
          type: string
          format: uuid
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        region_name:
          type: string
          description: Sub-national region, when set.
    OrgModel:
      type: object
      description: An AI model the organization runs against.
      additionalProperties: false
      required:
        - geo_model_id
        - name
      properties:
        geo_model_id:
          type: string
          format: uuid
        name:
          type: string
          description: The model identifier.
    Publisher:
      type: object
      description: A publishing destination configured for the organization.
      additionalProperties: false
      required:
        - publisher_id
        - name
        - slug
        - type
        - display_url
        - active
      properties:
        publisher_id:
          type: string
          format: uuid
        scope:
          type: string
          description: Ownership scope of the destination (e.g. org-specific or platform-shared).
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          description: The destination kind.
        display_url:
          type: string
          description: A human-facing URL for the destination.
        logo_url:
          type: string
          description: Destination logo URL, when set.
        active:
          type: boolean
    OrgInitialUser:
      type: object
      description: The initial user provisioned with the org. Present only on org-creation responses, never on reads.
      additionalProperties: false
      required:
        - user_id
        - org_user_id
        - email
        - role
      properties:
        user_id:
          type: string
          format: uuid
        org_user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          description: The role the initial user was granted (always `admin`).
    OrgDetailResponse:
      type: object
      description: Full details of your organization.
      additionalProperties: false
      required:
        - org_id
        - name
        - slug
        - network_name
        - industry_name
        - partner_id
        - is_free_tier
        - enable_runs
        - is_activated
        - created_at
        - updated_at
        - enable_content_generation
        - content_auto_publish
      properties:
        org_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        clerk_org_id:
          type: string
          description: >-
            The organization's id in the external identity provider, when the organization is
            linked to one.
        logo_url:
          type: string
        primary_website_url:
          type: string
        network_id:
          type: string
          format: uuid
          description: >-
            The network the organization belongs to. Networks are not required, so this is absent
            for a standalone organization.
        network_name:
          type: string
        industry_id:
          type: string
          format: uuid
        industry_name:
          type: string
        partner_id:
          type: string
          format: uuid
        is_free_tier:
          type: boolean
        enable_runs:
          type: boolean
          description: Master switch for the org's scheduled runs — when false, the org is paused and no runs are dispatched. Content generation has its own switch, `enable_content_generation`.
        is_activated:
          type: boolean
        websites:
          type: array
          items:
            $ref: "#/components/schemas/OrgWebsite"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/OrgLocation"
        models:
          type: array
          items:
            $ref: "#/components/schemas/OrgModel"
        schedule:
          type: array
          description: Weekdays the org's question runs are scheduled on, 0 = Sunday … 6 = Saturday.
          items:
            type: integer
        spend_limit:
          type: number
          description: Optional monthly spend cap, when set.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          description: When the organization was deleted; absent while it is active.
        enable_content_generation:
          type: boolean
        content_auto_publish:
          type: boolean
        content_schedule:
          type: array
          description: Weekdays content-generation runs are scheduled on, 0 = Sunday … 6 = Saturday.
          items:
            type: integer
        publishers:
          type: array
          items:
            $ref: "#/components/schemas/Publisher"
        initial_user:
          $ref: "#/components/schemas/OrgInitialUser"
    OrgWebsiteInput:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The website URL.
    OrgLocationInput:
      type: object
      additionalProperties: false
      required:
        - country_code
      properties:
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter country code (e.g. `US`). Only the length is validated on this endpoint.
        region_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional sub-national region.
    UpdateOrgRequest:
      type: object
      description: Editable organization fields. All fields optional — only those present are changed.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
        logo_url:
          type: string
          description: The org's logo URL. Send an empty string to clear it.
        websites:
          type: array
          description: Replaces the org's website list.
          items:
            $ref: "#/components/schemas/OrgWebsiteInput"
        locations:
          type: array
          description: Replaces the org's location list.
          items:
            $ref: "#/components/schemas/OrgLocationInput"
    SetOrgIndustryRequest:
      type: object
      additionalProperties: false
      required:
        - industry_id
      properties:
        industry_id:
          type: string
          format: uuid
          description: >-
            The industry to belong to, from the public catalogue
            (`GET /org/industries`).
    UpdateOrgRunsEnabledRequest:
      type: object
      description: >-
        Sets the org-wide master switch for scheduled question runs. Content generation is
        scheduled separately and is not affected — see `PATCH /org/content-generation`.
      additionalProperties: false
      required:
        - enable_runs
      properties:
        enable_runs:
          type: boolean
          description: New value for the org-wide runs master switch.

    # ── Industries ────────────────────────────
    PublicIndustryResponse:
      type: object
      description: >-
        One industry in the public catalogue. The three counts are always present — a
        `0` is meaningful (no prompts to draw on, or an industry that has never run).
      additionalProperties: false
      required:
        - industry_id
        - name
        - slug
        - description
        - active_prompt_count
        - model_count
        - location_count
        - created_at
        - updated_at
      properties:
        industry_id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the industry.
        slug:
          type: string
          description: URL-safe identifier for the industry, unique across the catalogue.
        description:
          type: string
          description: What the industry covers. An empty string when none has been written.
        active_prompt_count:
          type: integer
          description: Number of active prompts the industry runs on its schedule.
        model_count:
          type: integer
          description: >-
            Number of AI models the industry runs its prompts against. An industry with
            `0` has never run and has no result history.
        location_count:
          type: integer
          description: Number of distinct countries the industry's runs cover.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicIndustryListResponse:
      type: object
      description: One page of the public industry catalogue.
      additionalProperties: false
      required:
        - industries
        - total
        - limit
        - offset
      properties:
        industries:
          type: array
          description: The industries on this page, in the requested sort order. Empty when the offset is past the end.
          items:
            $ref: "#/components/schemas/PublicIndustryResponse"
        total:
          type: integer
          description: Total number of public industries matching the `search` and `live` filters, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The offset that was applied.

    # ── Industry competitive intelligence ──
    IndustryBrandLeaderboardResponse:
      type: object
      description: One page of an industry's brand leaderboard.
      additionalProperties: false
      required:
        - window
        - totals
        - total
        - limit
        - offset
        - brands
      properties:
        window:
          $ref: "#/components/schemas/IndustryWindow"
        totals:
          $ref: "#/components/schemas/IndustryTotals"
        total:
          type: integer
          description: >-
            Brands in the window after any `entity_type` filter, before paging.
            Ranks and trends are computed over the full landscape.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The offset that was applied.
        brands:
          type: array
          description: The brands on this page, in rank order.
          items:
            $ref: "#/components/schemas/IndustryBrandLeaderboardRow"
    IndustryWindow:
      type: object
      description: The date window that was applied.
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: Start of the window, `YYYY-MM-DD`.
        to:
          type: string
          description: End of the window, `YYYY-MM-DD`.
    IndustryTotals:
      type: object
      description: Industry-wide denominators for the window, so shares can be computed.
      additionalProperties: false
      required:
        - run_count
        - answered_count
        - brand_mention_total
      properties:
        run_count:
          type: integer
          description: Prompt runs collected in the window.
        answered_count:
          type: integer
          description: Runs that produced an answer.
        brand_mention_total:
          type: integer
          description: Mention instances across every brand — the share-of-voice denominator.
    IndustryBrandLeaderboardRow:
      type: object
      description: One brand's standing in the industry over the window.
      additionalProperties: false
      required:
        - brand_id
        - brand_key
        - brand_name
        - mentions_count
        - mention_total
        - answered_count
        - mentions_rank
        - average_position
        - sentiment
        - top_cited_domain
        - model_data
        - mentions_rank_trend
        - mentions_count_trend
        - mentions_percent_trend
      properties:
        brand_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The brand's stable, global identifier — the same for this brand in every
            industry and endpoint, and the value to store. Null when the brand has not
            been registered yet.
        parent_brand_id:
          type: string
          format: uuid
          description: >-
            Present when the brand is a sub-brand of a company; the row still reports
            the sub-brand's own numbers (pass `rollup=parent` to fold them). Absent
            for brands that own themselves and from rolled-up responses.
        brand_key:
          type: string
          description: A display and merge key that curation may change. Do not store it as an identifier.
        brand_name:
          type: string
        mentions_count:
          type: integer
          description: Answers that named the brand at least once.
        mention_total:
          type: integer
          description: Mention instances — an answer naming the brand three times counts three.
        answered_count:
          type: integer
          description: Answers in the window the brand could have appeared in.
        mentions_rank:
          type: integer
          description: >-
            Position in the full landscape by `mentions_count`; 1 is the most
            mentioned. Not renumbered by an `entity_type` filter.
        average_position:
          type: number
          description: Average position of the brand within the answers that named it; lower is earlier.
        sentiment:
          $ref: "#/components/schemas/BrandSentimentCounts"
        top_cited_domain:
          type: string
          description: The domain cited most often in answers that named the brand. Empty when none.
        entity_type:
          type: string
          description: >-
            What kind of entity the row is — `brand`, `regulator`, `publisher`,
            `government`, `generic_term`, `product_model`, or `forum_social`. Omitted
            when unclassified, which counts as `brand`.
        surface_forms:
          type: array
          description: The spelling variants merged into this row. Present only in canonicalized responses.
          items:
            type: string
        model_data:
          type: array
          nullable: true
          description: The brand's mentions broken down by AI model.
          items:
            $ref: "#/components/schemas/IndustryBrandModelMentions"
        mentions_rank_trend:
          type: integer
          nullable: true
          description: >-
            Previous rank minus current rank against the preceding window of the same
            length; positive means the brand climbed. Null when the brand had no rows
            in the previous window.
        mentions_count_trend:
          type: integer
          nullable: true
          description: Current `mentions_count` minus the previous window's. Null when there is nothing to compare against.
        mentions_percent_trend:
          type: number
          nullable: true
          description: Change in mention rate (mentions over answered) in percentage points. Null when there is nothing to compare against.
    BrandSentimentCounts:
      type: object
      description: How the answers that named the brand spoke of it.
      additionalProperties: false
      required:
        - positive
        - neutral
        - negative
      properties:
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
    IndustryBrandModelMentions:
      type: object
      additionalProperties: false
      required:
        - model
        - mentions_count
        - answered_count
      properties:
        model:
          type: string
        mentions_count:
          type: integer
          description: Answers from this model that named the brand.
        answered_count:
          type: integer
          description: Answers from this model in the window.
    IndustryBrandDetailResponse:
      type: object
      description: Everything about one brand in an industry over the window.
      additionalProperties: false
      required:
        - resolved
        - window
        - mentioned
        - metrics
        - by_model
        - by_stage
        - data_quality
        - notes
        - definitions
      properties:
        resolved:
          $ref: "#/components/schemas/IndustryBrandResolved"
        window:
          $ref: "#/components/schemas/IndustryAnalyticsWindow"
        mentioned:
          type: boolean
          description: Whether any answer in the window named the brand.
        metrics:
          $ref: "#/components/schemas/IndustryBrandDetailMetrics"
        by_model:
          type: array
          description: The brand's mention rate per AI model. Empty when the brand was never mentioned.
          items:
            $ref: "#/components/schemas/IndustryBrandModelRate"
        by_stage:
          type: array
          nullable: true
          description: >-
            The brand's mention rate per funnel stage of the prompts. Null when no
            stage data exists for the window.
          items:
            $ref: "#/components/schemas/IndustryBrandStageRate"
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          description: Caveats about this result. Empty when there are none.
          items:
            type: string
        definitions:
          type: object
          description: A plain-language definition of each metric, keyed by field name.
          additionalProperties:
            type: string
    IndustryBrandResolved:
      type: object
      description: The brand the query was matched to.
      additionalProperties: false
      required:
        - brand_id
        - brand_key
        - brand_name
        - entity_type
        - matched_on
        - match_confidence
        - surface_forms
      properties:
        brand_id:
          type: string
          format: uuid
          nullable: true
          description: The brand's stable, global identifier — the value to store. Null only when the brand could not be resolved or registered.
        brand_key:
          type: string
          description: A display and merge key that curation may change. Do not store it as an identifier.
        brand_name:
          type: string
        entity_type:
          type: string
          description: What kind of entity the brand is, e.g. `brand` or `regulator`.
        matched_on:
          type: string
          description: How the query was matched to the brand — `contains`, `exact`, `none`, `variation`. `exact` when addressed by id.
        match_confidence:
          type: number
          description: Confidence in the match, 0–1.
        surface_forms:
          type: array
          nullable: true
          description: The spelling variants merged into this brand.
          items:
            type: string
    IndustryAnalyticsWindow:
      type: object
      description: The date window that was applied.
      additionalProperties: false
      required:
        - from
        - to
        - days
      properties:
        from:
          type: string
          description: Start of the window, `YYYY-MM-DD`.
        to:
          type: string
          description: End of the window, `YYYY-MM-DD`.
        days:
          type: integer
          description: Length of the window in days.
        effective_weeks:
          type: array
          description: The weeks of data the window actually covered, when known.
          items:
            type: string
        collection_runs:
          type: integer
          description: Prompt runs collected in the window, when known.
    IndustryBrandDetailMetrics:
      type: object
      nullable: true
      description: The brand's metrics over the window. Null when the brand was never mentioned.
      additionalProperties: false
      required:
        - mention_rate
        - share_of_voice
        - avg_position
        - rank_in_industry
        - brands_ranked
        - sentiment
        - top_cited_domain
        - owned_citation_share
      properties:
        mention_rate:
          $ref: "#/components/schemas/IndustryRate"
        share_of_voice:
          $ref: "#/components/schemas/IndustryRate"
        avg_position:
          type: number
          description: Average position of the brand within the answers that named it; lower is earlier.
        rank_in_industry:
          type: integer
          description: The brand's position on the industry leaderboard.
        brands_ranked:
          type: integer
          description: How many brands the leaderboard ranked.
        sentiment:
          $ref: "#/components/schemas/BrandSentimentCounts"
        top_cited_domain:
          type: string
          description: The domain cited most often in answers that named the brand. Empty when none.
        owned_citation_share:
          allOf:
            - $ref: "#/components/schemas/MetricValue"
          description: >-
            The share of citations pointing at domains the brand owns. Null when no
            official domains are registered for the brand.
    IndustryRate:
      type: object
      description: A rate with a ready-to-display rendering.
      additionalProperties: false
      required:
        - value
        - display
      properties:
        value:
          type: number
          description: The rate as a number.
        display:
          type: string
          description: The rate formatted for display.
          example: 43.1%
    IndustryBrandModelRate:
      type: object
      additionalProperties: false
      required:
        - model
        - mention_rate
      properties:
        model:
          type: string
        mention_rate:
          $ref: "#/components/schemas/IndustryRate"
    IndustryBrandStageRate:
      type: object
      additionalProperties: false
      required:
        - funnel_stage
        - mention_rate
        - answered_count
      properties:
        funnel_stage:
          type: string
          description: The prompts' funnel stage, e.g. `awareness` or `consideration`.
        mention_rate:
          $ref: "#/components/schemas/IndustryRate"
        answered_count:
          type: integer
          description: Answers to prompts in this stage over the window.
    IndustryDomainDetailResponse:
      type: object
      description: How often an industry's AI answers cited one domain over the window.
      additionalProperties: false
      required:
        - resolved
        - window
        - cited
        - citation_references
        - rank_in_industry
        - share_of_citations
        - co_mentioned_brands
        - data_quality
        - notes
        - definitions
      properties:
        resolved:
          $ref: "#/components/schemas/IndustryDomainResolved"
        window:
          $ref: "#/components/schemas/IndustryAnalyticsWindow"
        cited:
          type: boolean
          description: Whether any answer in the window cited the domain.
        citation_references:
          type: integer
          description: How many times the domain was cited.
        rank_in_industry:
          type: integer
          description: The domain's position among cited domains.
        share_of_citations:
          $ref: "#/components/schemas/IndustryRate"
        co_mentioned_brands:
          type: array
          description: The brands most often named in answers that cited the domain. Empty when the domain was never cited.
          items:
            $ref: "#/components/schemas/IndustryDomainCoMention"
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        notes:
          type: array
          description: Caveats about this result. Empty when there are none.
          items:
            type: string
        definitions:
          type: object
          description: A plain-language definition of each metric, keyed by field name.
          additionalProperties:
            type: string
    IndustryDomainResolved:
      type: object
      description: The domain the query was matched to.
      additionalProperties: false
      required:
        - domain
        - host
        - ownership
      properties:
        domain:
          type: string
          description: The base domain that was matched.
        host:
          type: string
          description: The domain or URL as queried, lowercased; a leading `www.` on a bare domain is dropped.
        ownership:
          type: string
          description: Whether a known brand owns the domain — `official`, `external`, or `unknown`.
        owned_by_brand:
          type: string
          description: The owning brand, when `ownership` is `official`.
    IndustryDomainCoMention:
      type: object
      additionalProperties: false
      required:
        - brand_name
        - cooccurrence
      properties:
        brand_name:
          type: string
        cooccurrence:
          type: integer
          description: Answers that cited the domain and also named the brand.

    # ── Roles & Permissions ───────────────────
    PermissionInfo:
      type: object
      description: One permission the platform recognizes.
      additionalProperties: false
      required:
        - key
        - name
        - description
        - category
      properties:
        key:
          type: string
          description: The permission key (e.g. `update:org`), as used in role definitions.
        name:
          type: string
          description: Human-readable permission name.
        description:
          type: string
          description: What the permission grants.
        category:
          type: string
          description: Grouping the permission belongs to.
    AvailablePermissionsResponse:
      type: object
      description: The permissions available for building roles.
      additionalProperties: false
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionInfo"
    RoleResponse:
      type: object
      description: A role in your organization.
      additionalProperties: false
      required:
        - role_id
        - org_id
        - name
        - is_system
        - created_at
        - updated_at
      properties:
        role_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
          description: >-
            The raw role name (e.g. `admin`, `viewer`, `collaborator`).
        description:
          type: string
          description: Role description, when set.
        is_system:
          type: boolean
          description: Whether this is a built-in system role (not editable).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          description: When the role was deleted; absent while it is active.

    # ── Members ───────────────────────────────
    GroupSummary:
      type: object
      description: A permission group, in summary form.
      additionalProperties: false
      required:
        - group_id
        - name
      properties:
        group_id:
          type: string
          format: uuid
        name:
          type: string
    OrgMemberResponse:
      type: object
      description: A member of your organization.
      additionalProperties: false
      required:
        - org_user_id
        - org_id
        - user_id
        - email
        - given_name
        - family_name
        - role_id
        - role_display_name
        - groups
      properties:
        org_user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        role_id:
          type: string
          format: uuid
        role_display_name:
          type: string
          description: The member's role name.
        groups:
          type: array
          description: The knowledge-base permission groups the member belongs to.
          items:
            $ref: "#/components/schemas/GroupSummary"
    OrgMemberListResponse:
      type: object
      description: A paginated list of organization members.
      additionalProperties: false
      required:
        - members
        - total
        - limit
        - offset
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/OrgMemberResponse"
        total:
          type: integer
          description: Total members matching the filter, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The row offset that was applied.

    # ── Organization Users ────────────────────
    OrgUserResponse:
      type: object
      description: A user's membership in your organization.
      additionalProperties: false
      required:
        - org_user_id
        - org_id
        - user_id
        - role_id
        - is_current
        - created_at
        - updated_at
      properties:
        org_user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
          description: The role assigned to the user in this org.
        is_current:
          type: boolean
          description: Whether this org is the user's currently selected org.
        name:
          type: string
          description: Org name — populated only by org-switcher list endpoints, absent here.
        slug:
          type: string
          description: Org slug — populated only by org-switcher list endpoints, absent here.
        logo_url:
          type: string
          description: Org logo URL — populated only by org-switcher list endpoints, absent here.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          description: When the membership was deleted; absent while it is active.
    AddOrgUserRequest:
      type: object
      description: Adds an existing Senso user (by user id) to your organization.
      additionalProperties: false
      required:
        - user_id
        - role_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The user to add.
        role_id:
          type: string
          format: uuid
          description: The role to assign. Get valid role ids from GET /org/roles.
        is_current:
          type: boolean
          description: Whether to make this the user's current org. Forced true if the user has no current org.
    InviteOrgUserRequest:
      type: object
      description: Creates a new user (if needed) and adds them to your organization.
      additionalProperties: false
      required:
        - email
        - given_name
        - family_name
        - role_id
      properties:
        email:
          type: string
          format: email
        given_name:
          type: string
          minLength: 1
          maxLength: 255
        family_name:
          type: string
          minLength: 1
          maxLength: 255
        role_id:
          type: string
          format: uuid
          description: The role to assign. Get valid role ids from GET /org/roles.
        is_current:
          type: boolean
          description: Whether to make this the user's current org. Forced true if the user has no current org.
    InviteExistingOrgUserRequest:
      type: object
      description: Adds an existing Senso user (by email) to your organization.
      additionalProperties: false
      required:
        - email
        - role_id
      properties:
        email:
          type: string
          format: email
          description: Email of an existing Senso user.
        role_id:
          type: string
          format: uuid
          description: The role to assign. Get valid role ids from GET /org/roles.
        is_current:
          type: boolean
          description: Whether to make this the user's current org. Forced true if the user has no current org.
    UpdateOrgUserRoleRequest:
      type: object
      description: Changes a member's role.
      additionalProperties: false
      required:
        - role_id
      properties:
        role_id:
          type: string
          format: uuid
          description: The new role. Get valid role ids from GET /org/roles.
        is_current:
          type: boolean
          description: Optionally also set whether this is the user's current org.
    SetCurrentOrgRequest:
      type: object
      additionalProperties: false
      required:
        - is_current
      properties:
        is_current:
          type: boolean
          enum: [true]
          description: Must be `true` — this endpoint only sets the current org, it cannot clear it (`false` is rejected with 400).

    # ── Tags ──────────────────────────────────
    CreateTagRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The tag name.
    UpdateTagRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The new tag name.
    TagResponse:
      type: object
      description: >-
        An org-scoped tag. Usage counts are included on `GET /tags/{id}`, and on `GET
        /tags` when `counts=true`; otherwise they are omitted.
      additionalProperties: false
      required:
        - id
        - org_id
        - name
        - curated
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        curated:
          type: boolean
          description: True = part of the org's working vocabulary; false = machine-minted (from search queries), awaiting adoption.
        prompt_count:
          type: integer
          description: Prompts carrying this tag.
        content_count:
          type: integer
          description: Content items carrying this tag.
        kb_content_count:
          type: integer
          description: Knowledge-base nodes carrying this tag.
        generated_content_count:
          type: integer
          description: Generated content carrying this tag.
        generated_draft_count:
          type: integer
          description: Generated drafts carrying this tag.
        generated_published_count:
          type: integer
          description: Published generated content carrying this tag.
        kb_search_message_count:
          type: integer
          description: Search queries carrying this tag.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TagsListResponse:
      type: object
      description: The organization's tags.
      additionalProperties: false
      required:
        - items
        - total_count
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TagResponse"
        total_count:
          type: integer
          description: Number of tags returned.

    # ── Content Engine ────────────────────────
    ContentEngineDraftRequest:
      type: object
      required:
        - raw_markdown
        - seo_title
      properties:
        geo_question_id:
          type: string
          format: uuid
          description: The prompt this content answers.
        raw_markdown:
          type: string
          description: The generated content body, in markdown.
        seo_title:
          type: string
          description: SEO title for the content.
        summary:
          type: string
          description: Optional summary of the content.
        content_id:
          type: string
          format: uuid
          description: Existing content item to save a new version of. Omit to create a new item.
        generation_run_id:
          type: string
          format: uuid
          description: The generation run this draft came from, if any.
        generation_receipt_id:
          type: string
          format: uuid
          description: The generation receipt to attribute this draft to, if any.
        builder_workspace_id:
          type: string
          format: uuid
          description: The builder workspace this draft came from, if any. Must be paired with expected_workspace_version_id.
        expected_workspace_version_id:
          type: string
          format: uuid
          description: The workspace version expected to be current, for optimistic concurrency. Must be paired with builder_workspace_id.
    ContentEngineDraftResponse:
      type: object
      description: Identifiers for a saved draft content version.
      required:
        - content_id
        - version_id
        - version_num
        - editorial_status
      additionalProperties: false
      properties:
        content_id:
          type: string
          format: uuid
          description: The content item the draft was saved to.
        version_id:
          type: string
          format: uuid
          description: The created draft version's id.
        version_num:
          type: integer
          format: int64
          description: The created draft version's number.
        editorial_status:
          type: string
          description: Editorial status of the created version (a draft).
        source_workspace_version_id:
          type: string
          format: uuid
          description: The builder workspace version this draft was saved from, when applicable.

    # ── Builder ───────────────────────────────
    BulkBuilderEditTelemetryRequest:
      type: object
      properties:
        events:
          type: array
          description: The edit-telemetry events to record.
          items:
            $ref: "#/components/schemas/BuilderEditTelemetryEventInput"
    BuilderEditTelemetryEventInput:
      type: object
      required:
        - event_type
        - edit_source
      properties:
        event_type:
          type: string
          enum:
            [
              ai_patch_requested,
              ai_patch_proposed,
              ai_patch_accepted,
              ai_patch_rejected,
              ai_patch_failed,
              manual_edit_session_closed,
              draft_saved,
              published,
            ]
          description: The kind of edit event.
        edit_source:
          type: string
          enum: [manual, ai, system]
          description: What produced the edit.
        session_id:
          type: string
          format: uuid
          description: Optional builder session id this event belongs to.
        client_event_id:
          type: string
          format: uuid
          description: Client-generated id used to de-duplicate events; a repeat is counted as a duplicate and skipped.
        content_version_id:
          type: string
          format: uuid
          description: Optional content version the event applies to.
        generation_run_id:
          type: string
          format: uuid
          description: Optional generation run the event is associated with.
        payload:
          type: object
          additionalProperties: true
          description: Free-form event payload.
        meta_data:
          type: object
          additionalProperties: true
          description: Free-form event metadata.
        client_created_at:
          type: string
          format: date-time
          description: When the client recorded the event.
    BulkBuilderEditTelemetryResponse:
      type: object
      required:
        - inserted_count
        - duplicate_count
      additionalProperties: false
      properties:
        inserted_count:
          type: integer
          description: How many events were newly inserted.
        duplicate_count:
          type: integer
          description: How many events were skipped as duplicates.
    # ── Destinations ──────────────────────────
    RemoveOrgDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum: [leave, unpublish, delete]
          description: >-
            What to do with content already published to this destination —
            `leave` it as-is, `unpublish` it, or `delete` it.
        also_remove_destination:
          type: boolean
          description: Also hard-delete the destination row after the content action completes (org scope only).
        keep_domain:
          type: boolean
          description: For a custom domain, keep the domain reachable instead of deregistering it.
    RemoveOrgDestinationResponse:
      type: object
      required:
        - affected_record_count
        - unpublished_count
        - deleted_content_count
        - destination_removed
        - domain_deregistered
      additionalProperties: false
      properties:
        affected_record_count:
          type: integer
          description: Number of publish records (live or failed) on this destination that the removal acted on.
        unpublished_count:
          type: integer
          description: How many publish records were unpublished.
        deleted_content_count:
          type: integer
          description: How many content items were deleted (only for the `delete` action).
        destination_removed:
          type: boolean
          description: >-
            Whether the destination (publisher) record itself was hard-deleted —
            true only when `also_remove_destination` is set. The org's assignment
            to the destination is always removed on success, regardless of this flag.
        domain_deregistered:
          type: boolean
          description: Whether the custom domain was deregistered (citeables custom domains only).
        partial_failures:
          type: array
          description: Any per-item failures that occurred during removal.
          items:
            type: string

    # ── Content Generation ────────────────────
    ContentGenerationRunRequest:
      type: object
      properties:
        prompt_ids:
          type: array
          description: Restrict the run to these prompts. Omit to run all eligible prompts.
          items:
            type: string
            format: uuid
        content_type_id:
          type: string
          format: uuid
          description: Optional content type override for the run.
        publisher_ids:
          type: array
          description: Restrict publishing to these destinations.
          items:
            type: string
            format: uuid
    ContentGenerationRunResponse:
      type: object
      required:
        - message
        - org_id
        - run_id
      additionalProperties: false
      properties:
        message:
          type: string
          description: Human-readable acceptance message.
        org_id:
          type: string
          format: uuid
          description: The organization the run belongs to.
        run_id:
          type: string
          format: uuid
          description: The id of the accepted run.
        prompt_ids:
          type: array
          description: The prompts the run was scoped to, when provided.
          items:
            type: string
            format: uuid
    ContentGenerationSampleRequest:
      type: object
      required:
        - geo_question_id
        - content_type_id
      properties:
        geo_question_id:
          type: string
          format: uuid
          description: The prompt (geo question) to generate a sample for.
        content_type_id:
          type: string
          format: uuid
          description: The content type to generate.
        publish_destination:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional destination key to target for the sample.
    ContentGenerationSampleJobSubmitResponse:
      type: object
      required:
        - message
        - sample_job_id
        - org_id
        - status
      additionalProperties: false
      properties:
        message:
          type: string
          description: Human-readable acceptance message.
        sample_job_id:
          type: string
          format: uuid
          description: The id of the submitted sample job (poll it for status).
        org_id:
          type: string
          format: uuid
          description: The organization the job belongs to.
        status:
          type: string
          enum: [queued, running, completed, failed, expired]
          description: The job's lifecycle status. A newly submitted job starts as `queued`.

    # ── Industry prompt drafts ────────────────
    IndustryPromptDraftRequest:
      type: object
      required:
        - industry_prompt_id
        - selected_content_type_id
      properties:
        industry_prompt_id:
          type: string
          format: uuid
          description: >-
            The industry prompt to draft from. It must belong to your organization's
            industry — industry prompts are the prompts Senso runs for your sector,
            distinct from your organization's own prompts (`GET /org/prompts`), whose
            ids are not accepted here. A prompt from another industry is a `404`.
        selected_content_type_id:
          type: string
          format: uuid
          description: >-
            The content type that gives the document its format (`GET /org/content-types`).
            It must be one of your organization's content types; an id that does not
            resolve is a `400`.
        selected_product_line_ids:
          type: array
          description: >-
            Product lines to include as context (up to 100). Omit to include all of
            your organization's product lines, up to the same limit.
          maxItems: 100
          items:
            type: string
            format: uuid
        audience:
          type: string
          maxLength: 500
          description: Who the document is for. Defaults to a general audience.
        style_tone:
          type: string
          maxLength: 500
          description: Voice and tone guidance for the writer. Defaults to professional, concise, and helpful.
        extra_instructions:
          type: string
          maxLength: 4000
          description: Any further instructions for the writer, such as sections to include or claims to avoid.
    IndustryPromptDraftResponse:
      type: object
      description: >-
        A generated document and everything needed to render or store it. The
        document is not stored as content — persist `document_markdown` in a
        follow-up call if you want to keep it.
      additionalProperties: false
      required:
        - industry_prompt_id
        - prompt_text
        - document_markdown
        - content_type
        - citations
        - retrieval
        - usage
      properties:
        industry_prompt_id:
          type: string
          format: uuid
          description: The industry prompt the document answers.
        prompt_text:
          type: string
          description: The prompt's text as stored on the industry.
          example: How do I optimize my website content for AI search engines?
        funnel_stage:
          type: string
          description: >-
            The prompt's funnel stage as configured on the industry — for example
            `awareness`, `consideration`, `evaluation`, or `decision`. Free text whose
            casing varies between industries; omitted when the prompt has none.
        document_markdown:
          type: string
          description: >-
            The document as GitHub Flavored Markdown. Citations appear as footnote
            references (`[^1]`, `[^2]`, …) whose definitions, at the end of the
            document, are links to the sources — each labelled with the source's
            title and pointing at its URL, which you can match against `citations`.
        content_type:
          $ref: "#/components/schemas/IndustryPromptDraftContentType"
        citations:
          type: array
          description: >-
            The knowledge-base sources that were available to the writer, deduplicated
            by URL. Not every entry is necessarily cited in the document — match
            footnote definitions to entries by URL. Empty when retrieval found nothing
            citable.
          items:
            $ref: "#/components/schemas/IndustryPromptDraftCitation"
        retrieval:
          $ref: "#/components/schemas/IndustryPromptDraftRetrieval"
        usage:
          $ref: "#/components/schemas/IndustryPromptDraftUsage"
        model_used:
          type: string
          description: The model that wrote the document.
        notes:
          type: array
          description: >-
            Caveats about this particular result — for example that retrieval found no
            usable context, so the document is not grounded in your knowledge base and
            its specifics should be treated as unverified. Omitted when there are none.
          items:
            type: string
    IndustryPromptDraftContentType:
      type: object
      description: The content type that shaped the document.
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The content type's id, as sent in `selected_content_type_id`.
        name:
          type: string
          description: The content type's name.
          example: Article
    IndustryPromptDraftCitation:
      type: object
      description: One source the document cites.
      additionalProperties: false
      required:
        - id
        - url
      properties:
        id:
          type: string
          description: >-
            Identifier of the source within this response. Identifiers are not
            contiguous and are not footnote numbers.
          example: cite-1
        url:
          type: string
          description: >-
            An in-app knowledge-base path beginning `/knowledge-base?node=` that
            identifies the source's `kb_node_id` and, when known, its `version`.
        label:
          type: string
          description: Display label for the source, typically its title. Omitted when unknown.
        snippet:
          type: string
          description: An excerpt of the cited passage. Omitted when unavailable.
    IndustryPromptDraftRetrieval:
      type: object
      description: >-
        What retrieval found for the prompt, so you can tell a document grounded in
        your knowledge base from one the model wrote unaided.
      additionalProperties: false
      required:
        - total_results
        - context_chunks_used
        - query_info
        - metrics
      properties:
        total_results:
          type: integer
          description: Number of knowledge-base passages retrieval returned for the prompt.
        context_chunks_used:
          type: integer
          description: >-
            Whether usable knowledge-base context reached the writer. `0` means none
            did and the document is not grounded in your knowledge base — see `notes`;
            any positive value means it was grounded.
        query_info:
          $ref: "#/components/schemas/IndustryPromptDraftQueryInfo"
        metrics:
          $ref: "#/components/schemas/IndustryPromptDraftRetrievalMetrics"
    IndustryPromptDraftQueryInfo:
      type: object
      description: The search query retrieval ran, and how it was derived from the prompt.
      additionalProperties: false
      required:
        - original_query
        - query
        - was_rewritten
        - rewrite_failed
      properties:
        original_query:
          type: string
          description: The prompt text retrieval started from.
        query:
          type: string
          description: >-
            The query actually searched — a rewritten form of the prompt when
            `was_rewritten` is true, otherwise the prompt itself.
        was_rewritten:
          type: boolean
          description: Whether the prompt was rewritten into a search query before retrieval.
        rewrite_failed:
          type: boolean
          description: True when the rewrite step failed and the original prompt was searched instead.
        rewrite_error:
          type: string
          description: Why the rewrite failed. Present only when `rewrite_failed` is true.
        input_tokens:
          type: integer
          description: Tokens sent to the model for the rewrite step. Omitted when zero.
        output_tokens:
          type: integer
          description: Tokens the rewrite step produced. Omitted when zero.
        cost:
          type: number
          description: Estimated provider cost of the rewrite step, in US dollars. Omitted when zero.
    IndustryPromptDraftRetrievalMetrics:
      type: object
      description: Retrieval statistics for this call.
      additionalProperties: false
      required:
        - embedding_tokens
        - context_chars
        - raw_result_count
        - filtered_result_count
        - relevance_threshold
        - search_type
        - expanded_result_count
        - max_results
        - processing_time_ms
      properties:
        embedding_tokens:
          type: integer
          description: Tokens embedded to run the semantic half of the search.
        answer_input_tokens:
          type: integer
          description: >-
            Tokens sent to a model when retrieval also synthesizes an answer over the
            passages. Omitted when that step did not run, which is the case for this
            endpoint.
        answer_output_tokens:
          type: integer
          description: Tokens produced by answer synthesis. Omitted for the same reason as `answer_input_tokens`.
        context_chars:
          type: integer
          description: Characters of passage text assembled as context for the writer.
        raw_result_count:
          type: integer
          description: Candidate passages considered before the relevance floor was applied.
        filtered_result_count:
          type: integer
          description: Candidate passages kept after the relevance floor.
        relevance_threshold:
          type: number
          description: The minimum relevance score a passage needed to be kept.
        search_type:
          type: string
          description: >-
            The retrieval pipeline used. This endpoint uses `hybrid` — semantic and
            keyword search combined, then reranked.
        expanded_result_count:
          type: integer
          description: Passages after neighbouring passages were added around each kept result.
        max_results:
          type: integer
          description: The cap on passages requested from the search, before neighbouring passages were added.
        processing_time_ms:
          type: integer
          format: int64
          description: Wall-clock time retrieval took, in milliseconds.
    IndustryPromptDraftUsage:
      type: object
      description: Model usage for the writing step.
      additionalProperties: false
      required:
        - model
        - provider
        - input_tokens
        - output_tokens
        - total_tokens
        - cost
      properties:
        model:
          type: string
          description: The model that wrote the document.
        provider:
          type: string
          description: The model provider.
          example: openai
        input_tokens:
          type: integer
          description: Tokens sent to the model.
        output_tokens:
          type: integer
          description: Tokens the model produced.
        total_tokens:
          type: integer
          description: The sum of input and output tokens.
        cost:
          type: number
          description: Estimated provider cost of the writing step, in US dollars.

    # ── Run Configuration (models) ────────────
    OrgRunModelsResponse:
      type: object
      required:
        - models
      additionalProperties: false
      properties:
        models:
          type: array
          description: The AI models this org's runs currently execute against.
          items:
            $ref: "#/components/schemas/OrgRunModelItem"
    OrgRunModelItem:
      type: object
      required:
        - geo_model_id
        - name
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        geo_model_id:
          type: string
          format: uuid
          description: The model's id.
        name:
          type: string
          description: The model name.
        created_at:
          type: string
          format: date-time
          description: When this model was added to the org's run set.
        updated_at:
          type: string
          format: date-time
          description: When this model entry was last updated.
    ModelOptionsResponse:
      type: object
      description: >-
        The models the run-models write accepts, for building a picker.
      required:
        - valid_models
      additionalProperties: false
      properties:
        scope:
          type: string
          description: The run surface these options apply to. Always `org` for this endpoint.
        valid_models:
          type: array
          description: The model names (with display labels) that the run-models write accepts.
          items:
            $ref: "#/components/schemas/ModelOptionResponse"
    ModelOptionResponse:
      type: object
      required:
        - name
        - display_name
      additionalProperties: false
      properties:
        name:
          type: string
          description: The model identifier to send when setting run models.
        display_name:
          type: string
          description: A human-readable label for the model.
    ModelListResponse:
      type: object
      description: >-
        The models in an owner's opt-in set.
      required:
        - models
      additionalProperties: false
      properties:
        models:
          type: array
          description: The models the scheduler runs for this org.
          items:
            $ref: "#/components/schemas/ModelResponse"
    ModelResponse:
      type: object
      required:
        - id
        - provider
        - model
        - execution_mode
        - adapter_key
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The model's id.
        provider:
          type: string
          description: The model provider (e.g. `openai`).
        model:
          type: string
          description: The provider's model identifier.
        execution_mode:
          type: string
          enum: [batch_async, single_sync]
          description: How the model is executed by the scheduler.
        adapter_key:
          type: string
          description: The adapter key the platform uses to run this model.
    SetOrgRunModelsRequest:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          minItems: 1
          description: >-
            The bare model names to run, e.g. `chatgpt`, `gemini`, `claude`. The valid set is
            derived from the model registry (admin-configurable), so fetch it from
            GET /org/run-models/options rather than hard-coding it; an unsupported name returns 400.
          items:
            type: string
            minLength: 1
            maxLength: 255
    SetModelsRequest:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          minItems: 1
          description: >-
            The `provider/model` identifiers to opt the scheduler into, e.g. `anthropic/claude`.
            The supported set is configurable, so do not hard-code it: an unsupported entry
            returns 400 listing every value that is accepted.
          items:
            type: string
            minLength: 1
    UnknownModelsResponse:
      type: object
      required:
        - status
        - message
        - error
        - valid_models
      additionalProperties: false
      properties:
        status:
          type: integer
          description: The HTTP status code (400).
          example: 400
        message:
          type: string
          description: A human-readable summary of the rejected models.
        error:
          type: string
          description: The underlying error string. Not a stable identifier.
        unsupported_models:
          type: array
          description: The rejected model entries, as the caller sent them.
          items:
            type: string
        valid_models:
          type: array
          description: The model entries that are supported.
          items:
            type: string
        suggestions:
          type: object
          additionalProperties:
            type: string
          description: Maps a rejected entry to the supported value it most likely meant.

    # ── Questions & Prompts (geo_questions) ──
    GeoQuestionResponse:
      type: object
      description: A question (prompt) with its tags.
      additionalProperties: false
      required:
        - geo_question_id
        - question_text
        - type
        - persona_id
        - persona_question_id
        - persona_name
        - created_at
        - updated_at
      properties:
        geo_question_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
          description: The owning organization. Omitted for network-scoped questions.
        question_text:
          type: string
        type:
          type: string
          description: >-
            Funnel stage. Currently one of `decision`, `consideration`, `awareness`, or
            `evaluation`.
        geo_pool_id:
          type: string
          format: uuid
          description: The pool this question belongs to.
        persona_id:
          type: string
          format: uuid
          nullable: true
          description: The persona this question was generated from, or null.
        persona_question_id:
          type: string
          format: uuid
          nullable: true
          description: The source persona question, or null.
        persona_name:
          type: string
          nullable: true
          description: The persona's display name, or null. Populated only in list responses.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagResponse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GeoQuestionListResponse:
      type: object
      description: Every question in the scope (this endpoint is not paginated).
      additionalProperties: false
      required:
        - questions
        - total
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/GeoQuestionResponse"
        total:
          type: integer
          description: The number of questions returned.
    CreateGeoQuestionRequest:
      type: object
      additionalProperties: false
      required:
        - question_text
        - type
      properties:
        question_text:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [decision, consideration, awareness, evaluation]
          description: Funnel stage for the question.
        geo_pool_id:
          type: string
          format: uuid
          description: >-
            Pool to file the question under. Defaults to (or creates) your org's default
            pool when omitted or when the id is not one of your org's pools.
        tag_ids:
          type: array
          description: Tag ids to attach on creation.
          items:
            type: string
            format: uuid
    PatchGeoQuestionRequest:
      type: object
      description: At least one of `tag_ids` or `type` must be supplied.
      additionalProperties: false
      properties:
        tag_ids:
          type: array
          description: Replaces the question's full tag set.
          items:
            type: string
            format: uuid
        type:
          type: string
          enum: [decision, consideration, awareness, evaluation]
          description: New funnel stage.
    CreateOrgPromptRequest:
      type: object
      additionalProperties: false
      required:
        - question_text
        - type
      properties:
        question_text:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          description: >-
            Funnel stage. Send one of `decision`, `consideration`, `awareness`, or
            `evaluation`. Matching is case-insensitive, and the legacy aliases
            `brand-specific` (→ decision), `rank`/`ranking` (→ consideration),
            `topic`/`industry topic` (→ awareness), and `comparison` (→ evaluation) are
            also accepted, including their underscore and no-separator spellings.
    OrgPromptListItem:
      type: object
      description: A prompt in list form.
      additionalProperties: false
      required:
        - prompt_id
        - text
        - type
        - tags
        - created_at
        - updated_at
      properties:
        prompt_id:
          type: string
          format: uuid
        text:
          type: string
        type:
          type: string
          description: >-
            Funnel stage. Currently one of `decision`, `consideration`, `awareness`, or
            `evaluation`.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagResponse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrgPromptListResponse:
      type: object
      description: A paginated list of prompts.
      additionalProperties: false
      required:
        - prompts
        - total
        - limit
        - offset
      properties:
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/OrgPromptListItem"
        total:
          type: integer
          description: Total prompts matching the query (before pagination).
        limit:
          type: integer
        offset:
          type: integer
    OrgPromptRunMentionResponse:
      type: object
      description: A single organization mention detected in a run's answer.
      additionalProperties: false
      required:
        - mention_id
        - org
        - text
        - is_target_org
      properties:
        mention_id:
          type: string
          format: uuid
        org:
          type: string
          description: The mentioned organization's name.
        text:
          type: string
          description: The span of the answer that mentions the organization.
        rank:
          type: integer
          description: The rank position of this mention when the answer ranks organizations; omitted when unranked.
        sentiment:
          type: string
          description: Sentiment of the mention — `positive`, `negative`, or `neutral`.
        is_target_org:
          type: boolean
          description: True when the mention is your organization.
    OrgPromptRunCitationResponse:
      type: object
      description: A source URL cited in support of a claim.
      additionalProperties: false
      required:
        - citation_id
        - citation_type
        - order
      properties:
        citation_id:
          type: string
          format: uuid
        source_url:
          type: string
          description: The cited URL.
        citation_type:
          type: string
          description: >-
            The run-level citation classification — `primary`, `tracked`, `secondary`,
            or `none` (legacy rows may carry `mixed`).
        order:
          type: integer
          description: The citation's position within the claim.
    OrgPromptRunClaimResponse:
      type: object
      description: A claim extracted from a run's answer, with its citations.
      additionalProperties: false
      required:
        - claim_id
        - text
        - order
        - citations
      properties:
        claim_id:
          type: string
          format: uuid
        text:
          type: string
        order:
          type: integer
          description: The claim's position within the answer.
        sentiment:
          type: string
          description: Overall sentiment of the claim.
        target_mentioned:
          type: boolean
          description: Whether your organization is mentioned in this claim.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/OrgPromptRunCitationResponse"
    OrgPromptRunResponse:
      type: object
      description: A single generation run against the prompt, with its analysis.
      additionalProperties: false
      required:
        - run_id
        - target_mentioned
        - is_latest
        - evals
        - claims
        - competitors
        - created_at
      properties:
        run_id:
          type: string
          format: uuid
        response_text:
          type: string
          description: The model's answer.
        model:
          type: string
          description: The model that produced the answer.
        country:
          type: string
          description: The country the run was localized to.
        region:
          type: string
          description: The region the run was localized to.
        target_mentioned:
          type: boolean
          description: Whether your organization was mentioned in this run's answer.
        target_sov:
          type: number
          description: Share of voice (0–100) for your organization in this run's answer.
        target_rank:
          type: integer
          description: Your organization's rank among mentioned organizations in this run.
        target_sentiment:
          type: number
          description: Sentiment score for your organization in this run.
        is_latest:
          type: boolean
          description: Whether this is the most recent run for the prompt.
        evals:
          type: array
          description: >-
            Every organization mention detected in the answer — your organization and
            competitors alike, distinguished by each item's `is_target_org`.
          items:
            $ref: "#/components/schemas/OrgPromptRunMentionResponse"
        claims:
          type: array
          description: Claims extracted from the answer, with citations.
          items:
            $ref: "#/components/schemas/OrgPromptRunClaimResponse"
        competitors:
          type: array
          description: >-
            The non-target subset of `evals` — the mentions where `is_target_org` is
            false. These items also appear in `evals`; do not concatenate the two arrays.
          items:
            $ref: "#/components/schemas/OrgPromptRunMentionResponse"
        created_at:
          type: string
          format: date-time
    OrgPromptDetailResponse:
      type: object
      description: A prompt with its tags and full generation-run history.
      additionalProperties: false
      required:
        - prompt_id
        - text
        - type
        - scope
        - tags
        - created_at
        - updated_at
        - runs
      properties:
        prompt_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
          description: The owning organization — always your own org on this endpoint.
        text:
          type: string
        type:
          type: string
          description: >-
            Funnel stage. Currently one of `decision`, `consideration`, `awareness`, or
            `evaluation`.
        geo_pool_id:
          type: string
          format: uuid
        scope:
          type: string
          description: >-
            `org` for an organization-owned prompt or `network` for one shared across the
            org's network. Always `org` on this endpoint — network prompts are not
            readable here.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagResponse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        runs:
          type: array
          items:
            $ref: "#/components/schemas/OrgPromptRunResponse"
    OrgIndustryPromptItem:
      type: object
      description: One prompt an industry runs, and how it went over the window.
      additionalProperties: false
      required:
        - id
        - text
        - funnel_stage
        - models
        - top_three_mentioned
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The prompt's id — what you pass to the import and draft endpoints.
        text:
          type: string
          description: The question the industry asks the AI models.
          example: Which bank has the best mortgage rates?
        funnel_stage:
          type: string
          enum: [awareness, consideration, evaluation, decision]
          description: >-
            Where the question sits in a buyer's journey, and the stage the prompt would
            have in your organization once imported.
          example: consideration
        models:
          type: array
          description: >-
            One entry per AI model that answered this prompt in the window, with your
            own brand overlaid on the mention counts. `[]` when the prompt has no
            results in the window.
          items:
            $ref: "#/components/schemas/OrgIndustryPromptModelMetrics"
        top_three_mentioned:
          type: array
          description: >-
            The three brands named most often on this prompt in the window, by any
            brand — yours appears only when it is one of them. `[]` when no brand was
            named.
          items:
            $ref: "#/components/schemas/OrgIndustryPromptMentionedBrand"
    OrgIndustryPromptModelMetrics:
      type: object
      description: How one AI model answered a prompt over the window.
      additionalProperties: false
      required:
        - model
        - answered_count
        - brand_mention_count
        - brand_mention_rate
      properties:
        model:
          type: string
          description: The AI model, named the way the industry's runs record it.
          example: chatgpt
        answered_count:
          type: integer
          description: Answers this model gave to the prompt in the window.
          example: 8
        brand_mention_count:
          type: integer
          description: How many of those answers named your organization's brand.
          example: 2
        brand_mention_rate:
          type: number
          format: double
          description: >-
            `brand_mention_count` divided by `answered_count`, as a fraction between 0
            and 1. `0` when the model gave no answers.
          example: 0.25
    OrgIndustryPromptMentionedBrand:
      type: object
      description: One brand named on a prompt, with how often it was named.
      additionalProperties: false
      required:
        - brand_name
        - mentioned_count
      properties:
        brand_id:
          type: string
          format: uuid
          description: >-
            Stable id for the brand, for matching it across industries and windows.
            Absent for a brand the AI named that has no registry entry yet.
        brand_name:
          type: string
          description: The brand as the AI answers spell it.
          example: Acme Bank
        mentioned_count:
          type: integer
          description: Answers to this prompt that named the brand, across every model.
          example: 6
    OrgIndustryPromptListResponse:
      type: object
      additionalProperties: false
      required:
        - window
        - prompts
        - total
        - limit
        - offset
      properties:
        window:
          $ref: "#/components/schemas/IndustryWindow"
        prompts:
          type: array
          description: One page of the industry's active prompts, in a stable order.
          items:
            $ref: "#/components/schemas/OrgIndustryPromptItem"
        total:
          type: integer
          description: >-
            How many active prompts the industry has in total, not the size of this page.
          example: 212
        limit:
          type: integer
          description: The page size applied.
          example: 50
        offset:
          type: integer
          description: The offset applied.
          example: 0
    OrgIndustryAnswersResponse:
      type: object
      description: One page of an industry's newest answers, evaluated for your brand.
      additionalProperties: false
      required:
        - total
        - limit
        - offset
        - answers
        - notes
        - definitions
      properties:
        total:
          type: integer
          description: >-
            Answers matching every filter, including `mentioned`, across all pages — not the
            size of this page.
          example: 47
        limit:
          type: integer
          description: The page size applied.
          example: 25
        offset:
          type: integer
          description: The offset applied.
          example: 0
        answers:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/OrgIndustryAnswer"
        notes:
          type: array
          description: >-
            How to read the payload — always that rows are single answers and must never be
            summed; when the industry has nothing to show you, why `answers` is empty.
          items:
            type: string
        definitions:
          type: object
          additionalProperties:
            type: string
          description: One-line definitions of the metrics behind this payload, keyed by glossary metric name (not by response field name).
    OrgIndustryAnswer:
      type: object
      description: >-
        The newest stored answer for one prompt from one AI model at one location, with your
        brand read against it. One answer, never a total — two rows for the same prompt are
        two models or two locations.
      additionalProperties: false
      required:
        - prompt_id
        - prompt_text
        - model
        - location
        - run_at
        - observation_id
        - response_text
        - empty
        - mentioned
        - rank
        - sentiment
        - sov_pct
        - brand_count
        - brands
        - citation_count
        - source_count
        - citations
      properties:
        prompt_id:
          type: string
          format: uuid
          description: The industry prompt's id — what you pass to the import and draft endpoints.
        prompt_text:
          type: string
          description: The question the industry asks the AI models.
          example: Which bank has the best mortgage rates?
        model:
          type: string
          description: The AI model that gave this answer.
          example: chatgpt
        location:
          type: string
          description: The location the answer was collected for.
          example: US
        run_at:
          type: string
          format: date-time
          description: When the answer was collected.
        observation_id:
          type: string
          description: >-
            An opaque, stable id for this answer. Use it to tie an evaluation or a note back
            to the exact text it was made from.
        response_text:
          type: string
          description: The model's full answer text. Empty when `empty` is true.
        empty:
          type: boolean
          description: >-
            Whether the model returned no answer in its most recent run. Such answers are
            only present when `include_empty=true` was passed.
        mentioned:
          type: boolean
          description: Whether the answer named your brand.
        rank:
          type: integer
          nullable: true
          description: >-
            Your brand's ordinal position among the brands the answer named (1 = named
            first), or null when the answer did not name you.
          example: 2
        sentiment:
          type: string
          nullable: true
          description: >-
            The tone of the answer towards your brand — `positive`, `neutral`, or
            `negative` — or null when the answer did not name you.
          example: positive
        sov_pct:
          type: number
          format: double
          nullable: true
          description: >-
            Your share of every brand mention in this one answer, as a percentage from 0 to
            100 — or null when the answer named no brands at all. A share of one answer, not
            a rate; it is not comparable with `brand_mention_rate` on the prompt list, which
            is a fraction of answers.
          example: 25
        brand_count:
          type: integer
          description: >-
            How many distinct brands the answer named. `brands` may list fewer, so a
            `brand_count` larger than its length tells you the list was shortened.
          example: 7
        brands:
          type: array
          description: The brands the answer named, in the order it named them.
          items:
            $ref: "#/components/schemas/IndustryAnswerBrand"
        citation_count:
          type: integer
          description: How many links the answer cited. `citations` may list fewer.
          example: 9
        source_count:
          type: integer
          description: How many pages the model consulted to write the answer. `citations` may list fewer.
          example: 12
        citations:
          type: array
          description: The links the answer cited or consulted, cited ones first.
          items:
            $ref: "#/components/schemas/IndustryAnswerCitation"
    IndustryAnswerBrand:
      type: object
      description: One brand named in one answer.
      additionalProperties: false
      required:
        - key
        - name
        - rank
        - mentions
        - sentiment
      properties:
        key:
          type: string
          description: >-
            A normalized form of the brand's name, the same for every spelling of the brand.
            Group on this; display `name`.
          example: rival bank
        name:
          type: string
          description: The brand as the answer named it.
          example: Rival Bank
        rank:
          type: integer
          nullable: true
          description: The brand's ordinal position in the answer (1 = named first), when known.
          example: 1
        mentions:
          type: integer
          description: How many times the answer named the brand.
          example: 3
        sentiment:
          type: string
          description: The tone of the answer towards this brand — `positive`, `neutral`, or `negative`.
          example: positive
    IndustryAnswerCitation:
      type: object
      description: One link the answer cited or consulted.
      additionalProperties: false
      required:
        - url
        - domain
        - cited
        - sourced
        - source_rank
        - citation_rank
      properties:
        url:
          type: string
          description: The link.
        domain:
          type: string
          description: The link's domain.
          example: nerdwallet.com
        cited:
          type: boolean
          description: Whether the answer cited this link in its text.
        sourced:
          type: boolean
          description: Whether the model consulted this link while writing the answer.
        source_rank:
          type: integer
          nullable: true
          description: The link's position among the pages consulted (1 = first), when known.
        citation_rank:
          type: integer
          nullable: true
          description: The link's position among the citations (1 = first), when known.
    ImportIndustryPromptsRequest:
      type: object
      additionalProperties: false
      required:
        - prompt_ids
      properties:
        prompt_ids:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            Ids of prompts in your organization's industry. Each id may appear once; a
            duplicate rejects the request.
          items:
            type: string
            format: uuid
    ImportIndustryPromptOutcome:
      type: object
      description: What happened to one requested industry prompt.
      additionalProperties: false
      required:
        - industry_prompt_id
        - status
        - geo_question_id
        - reason
      properties:
        industry_prompt_id:
          type: string
          format: uuid
          description: The requested industry prompt.
        status:
          type: string
          enum: [created, skipped]
          description: >-
            `created` — a new prompt was added to your organization. `skipped` — your
            organization already had a prompt with the same text, whether imported earlier
            or written by hand; nothing on it was changed.
          example: created
        geo_question_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The prompt in your organization this now corresponds to: the one created, or
            the existing one it was skipped for. Null only if that existing prompt was
            deleted in the same instant.
        reason:
          type: string
          nullable: true
          description: Why the prompt was skipped. Null when it was created.
          example: a prompt with this text already exists in your organization
    ImportIndustryPromptsDefaultsSeeded:
      type: object
      description: >-
        Run configuration this call had to create so the prompts can run. Empty arrays
        mean your organization was already configured and nothing was changed.
      additionalProperties: false
      required:
        - models
        - schedule_dows
        - locations
      properties:
        models:
          type: array
          description: AI models configured for your organization by this call.
          items:
            type: string
        schedule_dows:
          type: array
          description: Run days added to your schedule, 0 (Sunday) to 6 (Saturday).
          items:
            type: integer
        locations:
          type: array
          description: >-
            Locations added to your run configuration: a country code, or `COUNTRY/region`
            for a regional location.
          items:
            type: string
    ImportIndustryPromptsHistoryImport:
      type: object
      description: The history-import job this call started, or found already running.
      additionalProperties: false
      required:
        - status
        - import_id
        - days
        - reason
      properties:
        status:
          type: string
          enum: [queued, already_running, skipped]
          description: >-
            `queued` — a new import was started; `already_running` — an import for your
            organization was already in progress, and `import_id` is that import, so call
            again after it completes to cover anything copied since it started; `skipped`
            — the import could not be started (your prompts were still copied; send the
            request again to retry).
          example: queued
        import_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The job to follow with `GET /org/history-imports/{importId}`. Null when
            `skipped`.
        days:
          type: integer
          description: >-
            How many days of industry history the import covers — the window that was
            requested, when `skipped`.
          example: 7
        reason:
          type: string
          nullable: true
          description: >-
            Set when the import was skipped, null otherwise. Always the same fixed sentence
            — the cause itself is not exposed; sending the request again retries it.
          example: The history import could not be started. Send the request again to retry.
    ImportIndustryPromptsResponse:
      type: object
      additionalProperties: false
      required:
        - outcomes
        - created
        - skipped
        - defaults_seeded
        - history_import
      properties:
        outcomes:
          type: array
          description: One entry per requested prompt, in request order.
          items:
            $ref: "#/components/schemas/ImportIndustryPromptOutcome"
        created:
          type: integer
          description: How many prompts were added to your organization.
          example: 4
        skipped:
          type: integer
          description: How many prompts your organization already had.
          example: 1
        defaults_seeded:
          $ref: "#/components/schemas/ImportIndustryPromptsDefaultsSeeded"
        history_import:
          $ref: "#/components/schemas/ImportIndustryPromptsHistoryImport"
    OrgHistoryImport:
      type: object
      description: >-
        One history-import job: a request to back-fill your organization's prompts with
        the run history already collected for your industry.
      additionalProperties: false
      required:
        - id
        - days
        - status
        - prompts_count
        - historic_runs_imported
        - error
        - created_at
        - updated_at
        - completed_at
      properties:
        id:
          type: string
          format: uuid
          description: The job's id.
        days:
          type: integer
          description: How many days of history the job covers.
          example: 7
        status:
          type: string
          description: >-
            The job's progress: `pending` (accepted, not started), `running`, `completed`
            or `failed`. A failed job may be retried automatically, so it can return to
            `running` on its own — treat `failed` as the latest attempt rather than a final
            answer.
          example: completed
        prompts_count:
          type: integer
          nullable: true
          description: >-
            How many of your prompts the job matched. Null until the job completes, so its
            absence does not mean zero. A completed job reporting 0 matched none of your
            prompts and copied nothing, which is why this is the field to read rather than
            the status.
          example: 12
        historic_runs_imported:
          type: integer
          nullable: true
          description: >-
            How many historic runs the job copied onto your prompts. Null until the job
            completes.
          example: 340
        error:
          type: string
          nullable: true
          description: >-
            Set when the latest attempt failed, null otherwise; cleared again when the job
            is retried. Always the same fixed sentence — the failure reason itself is not
            exposed.
          example: The import failed and may be retried.
        created_at:
          type: string
          format: date-time
          description: When the job was accepted.
        updated_at:
          type: string
          format: date-time
          description: >-
            When the job was last updated. A running job refreshes this regularly while it
            works, so it is not only a state-change timestamp.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the job completed. Null until it does — including for a `failed` job,
            which has not completed.
    OrgHistoryImportListResponse:
      type: object
      description: >-
        Your organization's 50 most recently started history-import jobs, newest first.
        Not paginated: jobs older than the 50 newest are not returned.
      additionalProperties: false
      required:
        - imports
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/OrgHistoryImport"
    SetResourceTagsRequest:
      type: object
      description: >-
        Replaces a resource's tag collection. Supply `tag_ids`, `tag_names`, or both;
        unknown names are created within your organization.
      additionalProperties: false
      properties:
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        tag_names:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
    AttachResourceTagRequest:
      type: object
      description: >-
        Attaches a single tag. Provide either `tag_id` (an existing tag) or `tag_name`
        (created within your organization if it does not exist).
      additionalProperties: false
      properties:
        tag_id:
          type: string
          format: uuid
        tag_name:
          type: string
          minLength: 1
          maxLength: 255

    # ── API Keys ──
    APIKeyResponse:
      type: object
      description: An API key's metadata. The secret key value is never included — it is returned once, at creation.
      additionalProperties: false
      required:
        - id
        - organization_id
        - name
        - scoped
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        scoped:
          type: boolean
          description: >-
            Whether the key is restricted to specific knowledge-base folders (see
            `GET /org/api-keys/{keyId}/kb-permissions`).
        expires_at:
          type: string
          format: date-time
          description: When the key expires, if an expiry was set.
        revoked_at:
          type: string
          format: date-time
          description: >-
            When the key was revoked. These read endpoints return only active keys, so
            this is always absent here.
        last_used_at:
          type: string
          format: date-time
          description: When the key was last used, if ever.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    APIKeyListResponse:
      type: object
      description: A paginated list of API keys.
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIKeyResponse"
        total:
          type: integer
          description: Total keys for the organization (before pagination).
        limit:
          type: integer
        offset:
          type: integer
    APIKeyScopeGrant:
      type: object
      description: A single knowledge-base folder grant restricting an API key.
      additionalProperties: false
      required:
        - node_id
        - role
      properties:
        node_id:
          type: string
          format: uuid
          description: The KB node the key is granted access to (typically a folder).
        role:
          type: string
          enum: [viewer, editor, owner, admin]
          description: >-
            The access level granted on the node. Stored grants are `viewer`, `editor`,
            or `owner`; `admin` is computed for organization administrators rather than
            granted, so it is not returned by this endpoint.

    # ── Search ──
    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          description: The search query. Required and non-empty; there is a maximum length.
        max_results:
          type: integer
          description: >-
            Maximum results to return. Defaults to 5; values ≤ 0 fall back to 5 and
            values above 20 are capped at 20.
        content_ids:
          type: array
          description: Restrict the search to these content items.
          items:
            type: string
            format: uuid
        require_scoped_ids:
          type: boolean
          description: >-
            When true, `content_ids` must be non-empty — the request is rejected with 400
            otherwise. Use it to guarantee a scoped search never silently widens.
        search_type:
          type: string
          description: >-
            Retrieval pipeline to use. One of `hybrid` (default), `lexical`, or `vector`.
            Matching is case-insensitive; an empty or omitted value selects `hybrid`. Any
            other value is rejected with 400.
    SearchResponse:
      type: object
      description: Matched chunks plus an AI-generated answer.
      additionalProperties: false
      required:
        - query
        - search_type
        - answer
        - results
        - total_results
        - max_results
        - processing_time_ms
      properties:
        query:
          type: string
        search_type:
          type: string
          enum: [hybrid, lexical, vector]
          description: The retrieval pipeline that produced this response — the scale each result's `score` is on.
        answer:
          type: string
          description: The AI-generated answer grounded on the matched content.
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultChunk"
        total_results:
          type: integer
        max_results:
          type: integer
        processing_time_ms:
          type: integer
          format: int64
    SearchContextResponse:
      type: object
      description: Matched chunks only (no AI answer).
      additionalProperties: false
      required:
        - query
        - search_type
        - results
        - total_results
        - max_results
      properties:
        query:
          type: string
        search_type:
          type: string
          enum: [hybrid, lexical, vector]
          description: The retrieval pipeline that produced this response — the scale each result's `score` is on.
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultChunk"
        total_results:
          type: integer
        max_results:
          type: integer
    SearchContentResponse:
      type: object
      description: The distinct content items that matched (no chunks, no answer).
      additionalProperties: false
      required:
        - query
        - search_type
        - contents
        - total
      properties:
        query:
          type: string
        search_type:
          type: string
          enum: [hybrid, lexical, vector]
          description: The retrieval pipeline that produced this response.
        contents:
          type: array
          items:
            $ref: "#/components/schemas/SearchContentItem"
        total:
          type: integer
    SearchContentItem:
      type: object
      additionalProperties: false
      required:
        - content_id
        - kb_node_id
      properties:
        content_id:
          type: string
          format: uuid
        kb_node_id:
          type: string
          format: uuid
          description: >-
            The document's node in the knowledge base tree. This is the id the
            `/org/kb/nodes/{kb_node_id}` endpoints take, so a match can be read,
            renamed, moved or deleted without a further lookup.
        title:
          type: string
    SearchResultChunk:
      type: object
      description: A single chunk matched by the search.
      additionalProperties: false
      required:
        - content_chunk_id
        - content_id
        - kb_node_id
        - version_id
        - chunk_index
        - chunk_text
        - score
        - rank
      properties:
        content_chunk_id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        kb_node_id:
          type: string
          format: uuid
          description: >-
            The node in the knowledge base tree that the chunk's document lives
            at. This is the id the `/org/kb/nodes/{kb_node_id}` endpoints take,
            so a cited chunk can be read in full without a further lookup.
        version_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
        chunk_text:
          type: string
        score:
          type: number
          description: >-
            The final relevance score the pipeline ranked and cut on, on the scale named
            by the response `search_type` (rerank score for hybrid, cosine for vector,
            document-grain BM25 for lexical). Results from different modes never mix in
            one response, so scores within a response are comparable.
        rank:
          type: integer
          description: The chunk's 1-based position in the result set.
        title:
          type: string
          description: The source document's title.
        vector_id:
          type: string
        inclusion_reason:
          type: string
          description: Why the chunk is in the result set. Always `matched` on this API.
        source_type:
          type: string
          enum: [file, raw, web]
          description: The source's kind — `file` (uploaded file), `raw` (raw text/markdown), or `web` (web content).
        content_type:
          type: string
          description: The source's MIME type (e.g. `application/pdf`, `text/markdown`).
        retrieval:
          $ref: "#/components/schemas/ChunkRetrieval"
    ChunkRetrieval:
      type: object
      description: >-
        Per-arm retrieval evidence for a chunk. Present on `hybrid` responses only (pure
        `vector`/`lexical` modes omit it). A key is present only for
        the arm(s) that found the chunk.
      additionalProperties: false
      properties:
        vector:
          $ref: "#/components/schemas/RetrievalArmResult"
        lexical:
          $ref: "#/components/schemas/RetrievalArmResult"
    RetrievalArmResult:
      type: object
      description: One retrieval arm's raw score and rank for a chunk.
      additionalProperties: false
      required:
        - score
        - rank
      properties:
        score:
          type: number
          description: The arm's own score on the arm's own scale (cosine for vector; document-grain BM25 for lexical).
        rank:
          type: integer
          description: The chunk's 1-based rank in that arm's pool.

    # ── Gaps ──────────────────────────────────
    GapStatus:
      type: string
      description: >-
        Where a gap is in its lifecycle. `weak` is a gap with too little evidence to act
        on yet (an API search gap seen once). `open` and `reopened` are work to do.
        `addressed` means something was written that later evidence has not yet confirmed.
        `resolved` and `dismissed` are closed. `dormant` has not been seen for a while.
      enum: [weak, open, reopened, addressed, resolved, dismissed, dormant]
    GapProblem:
      type: string
      description: >-
        The state the queue badges and counts by: `conflict` (the knowledge base
        disagrees), `not_found` (nothing was found for the question), `no_source`
        (nothing backs a claim), `flagged` (a person marked an answer wrong).
      enum: [conflict, not_found, no_source, flagged]
    GapKind:
      type: string
      description: >-
        `missing`, `conflict` (claim against the knowledge base), `kb_conflict` (two
        knowledge-base documents disagree) or `flagged`.
      enum: [missing, conflict, kb_conflict, flagged]
    GapSurface:
      type: string
      description: >-
        Where a gap was seen: `search_turn` (Quick Search in the Senso app), `content`
        (something being written), `question_run` (a tracked prompt's AI answer), or
        `api_search` (a search through the org API, the MCP server or the CLI).
      enum: [search_turn, content, question_run, api_search]
    GapOriginKind:
      type: string
      description: >-
        What produced a gap: `claim` (a statement that could not be verified),
        `unanswered_question` (a Quick Search that found nothing), `flagged_answer` (an
        answer a person marked wrong), `documents_didnt_answer` (documents were found
        but the answer still declined), or `api_unanswered_question` (a search through
        the org API, the MCP server or the CLI that found nothing).
      enum:
        [
          claim,
          unanswered_question,
          flagged_answer,
          documents_didnt_answer,
          api_unanswered_question,
        ]
    GapResolutionType:
      type: string
      description: What was decided about a gap. See `POST /org/gaps/{gapId}/resolutions` for the effect of each.
      enum:
        - answered
        - content_added
        - content_updated
        - ruled_kb_correct
        - ruled_claim_correct
        - ruled_document
        - dismissed
        - not_relevant
        - we_dont_do_this
        - source_irrelevant
    GapTag:
      type: object
      description: A topic tag attached to a gap.
      additionalProperties: false
      required:
        - tag_id
        - name
        - curated
      properties:
        tag_id:
          type: string
          format: uuid
        name:
          type: string
        curated:
          type: boolean
          description: True = part of the organization's working vocabulary; false = machine-minted, awaiting adoption.
    GapSurfaceCounts:
      type: object
      description: How many times the gap was seen on each surface.
      additionalProperties: false
      required:
        - search_turn
        - content
        - question_run
        - api_search
      properties:
        search_turn:
          type: integer
        content:
          type: integer
        question_run:
          type: integer
        api_search:
          type: integer
    GapOrigin:
      type: object
      description: Where a gap came from, derived from its most recent sighting.
      additionalProperties: false
      required:
        - kind
        - surface
        - surface_counts
      properties:
        kind:
          $ref: "#/components/schemas/GapOriginKind"
        surface:
          $ref: "#/components/schemas/GapSurface"
        subject_id:
          type: string
          format: uuid
          description: >-
            The search turn, content item or question run behind the most recent
            sighting. For an API search gap, the most recent search that found nothing.
        title:
          type: string
          description: A name for the subject — a document title, a tracked prompt, or the question asked.
        model_label:
          type: string
          description: The engine that produced the answer. Absent for content, which a person wrote.
        eval_mode:
          type: string
          description: How thoroughly the subject was checked. Absent for search signals, which are not judged.
        surface_counts:
          $ref: "#/components/schemas/GapSurfaceCounts"
        session_id:
          type: string
          format: uuid
          description: The Quick Search conversation the sighting happened in. Absent for API search gaps.
        geo_question_id:
          type: string
          format: uuid
          description: The tracked prompt behind an AI answer.
        kb_node_id:
          type: string
          format: uuid
          description: The knowledge-base document behind a content sighting. Absent when that document was deleted.
    Gap:
      type: object
      description: One row of the gap queue.
      additionalProperties: false
      required:
        - gap_id
        - kind
        - problem
        - status
        - claim_text
        - occurrence_count
        - asker_count
        - api_occurrence_count
        - surfaces
        - first_seen_at
        - last_seen_at
        - status_changed_at
        - awaiting_update
        - tags
      properties:
        gap_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/GapKind"
        problem:
          $ref: "#/components/schemas/GapProblem"
        status:
          $ref: "#/components/schemas/GapStatus"
        claim_text:
          type: string
          description: The gap in words — the claim that could not be backed up, or the question that went unanswered.
        occurrence_count:
          type: integer
          description: How many times the gap was seen.
        asker_count:
          type: integer
          description: Distinct signed-in people behind those sightings. Calls made with API keys are not counted here.
        api_occurrence_count:
          type: integer
          description: Sightings that came from API-key calls. Never added into `asker_count`.
        surfaces:
          type: array
          description: Every surface the gap was seen on.
          items:
            $ref: "#/components/schemas/GapSurface"
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        contradicting_content_id:
          type: string
          format: uuid
          description: The knowledge-base content a claim contradicts. Grounding-checked.
        contradicting_content_title:
          type: string
        suggested_content_id:
          type: string
          format: uuid
          description: Content that may be relevant. An unverified hint, not a finding.
        suggested_content_title:
          type: string
        assigned_user_id:
          type: string
          format: uuid
        assigned_user_name:
          type: string
        assigned_user_email:
          type: string
        status_changed_at:
          type: string
          format: date-time
        awaiting_update:
          type: boolean
          description: >-
            True when the latest resolution ruled which side is correct but the losing
            document has not been updated yet, so the gap is still `open` or `reopened`.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/GapTag"
        latest_resolution:
          $ref: "#/components/schemas/GapResolution"
        origin:
          $ref: "#/components/schemas/GapOrigin"
    GapListResponse:
      type: object
      additionalProperties: false
      required:
        - gaps
        - total
        - limit
        - offset
      properties:
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/Gap"
        total:
          type: integer
          description: Gaps matching the filters, across all pages.
        limit:
          type: integer
        offset:
          type: integer
    GapOccurrence:
      type: object
      description: One sighting of a gap.
      additionalProperties: false
      required:
        - subject_type
        - occurred_at
      properties:
        eval_claim_id:
          type: string
          format: uuid
          description: The judged claim behind the sighting. Absent for search signals, which are not judged.
        eval_run_id:
          type: string
          format: uuid
          description: The evaluation run behind the sighting. Absent for search signals.
        subject_type:
          type: string
          description: What was seen. `search_turn` for every search sighting, API searches included.
        subject_id:
          type: string
          format: uuid
        question:
          type: string
          description: The question that was asked, when there was one.
        source_text:
          type: string
          description: The sentence that carried the claim, for a judged claim.
        asked_by_name:
          type: string
          description: The signed-in person who asked. Absent for calls made with an API key.
        occurred_at:
          type: string
          format: date-time
    GapResolution:
      type: object
      description: One decision recorded against a gap.
      additionalProperties: false
      required:
        - resolution_id
        - resolution_type
        - created_at
      properties:
        resolution_id:
          type: string
          format: uuid
        resolution_type:
          $ref: "#/components/schemas/GapResolutionType"
        ruling_side:
          type: string
          enum: [kb, claim, document]
        authority_content_id:
          type: string
          format: uuid
        authority_content_version_id:
          type: string
          format: uuid
        produced_content_id:
          type: string
          format: uuid
        produced_content_version_id:
          type: string
          format: uuid
        notes:
          type: string
        resolved_by_name:
          type: string
          description: The person who recorded it. Absent when it was recorded with an API key.
        resolved_by_email:
          type: string
          description: Absent when it was recorded with an API key.
        created_at:
          type: string
          format: date-time
    CreateGapResolutionRequest:
      type: object
      additionalProperties: false
      required:
        - resolution_type
      properties:
        resolution_type:
          $ref: "#/components/schemas/GapResolutionType"
        produced_content_id:
          type: string
          format: uuid
          description: The content that was written. Required for `answered`, `content_added` and `content_updated`.
        authority_content_id:
          type: string
          format: uuid
          description: >-
            The document the decision is about. Required for `ruled_claim_correct`,
            `ruled_document` and `source_irrelevant`.
        ruling_side:
          type: string
          enum: [kb, claim, document]
          description: Which side a ruling found correct.
        notes:
          type: string
    GapEvidenceItem:
      type: object
      description: A document weighed against a claim.
      additionalProperties: false
      required:
        - content_id
        - relation
      properties:
        content_id:
          type: string
          format: uuid
        content_version_id:
          type: string
          format: uuid
        title:
          type: string
        version_num:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
        relation:
          type: string
          description: "`entails` or `contradicts` (both grounding-checked), or `related` (context)."
        was_cited:
          type: boolean
          description: Whether the answer actually cited this document.
    GapEvidenceSearch:
      type: object
      description: One query issued against the knowledge base while checking a claim.
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
        result_count:
          type: integer
    GapAnswerSource:
      type: object
      description: One document an answer cited, in rank order.
      additionalProperties: false
      required:
        - content_id
        - title
        - source_type
        - content_type
        - rank
        - available
      properties:
        content_id:
          type: string
          format: uuid
        kb_node_id:
          type: string
          format: uuid
        title:
          type: string
        source_type:
          type: string
        content_type:
          type: string
        rank:
          type: integer
        available:
          type: boolean
          description: False when the cited document has since been deleted.
    GapFeedbackNote:
      type: object
      description: What a person said when they flagged an answer.
      additionalProperties: false
      required:
        - rating
        - created_at
      properties:
        user_name:
          type: string
        rating:
          type: string
        comment:
          type: string
        created_at:
          type: string
          format: date-time
    GapRetrievalContext:
      type: object
      description: What retrieval recorded on a search that found nothing.
      additionalProperties: false
      properties:
        raw_result_count:
          type: integer
          description: How many candidates retrieval considered.
        filtered_result_count:
          type: integer
          description: How many candidates survived relevance filtering.
        top_score:
          type: number
          description: The best candidate's score, when there was one.
    GapLeadEvidence:
      type: object
      description: >-
        The evidence behind a gap, from its most recent sighting. Every field is optional
        because each origin carries different evidence. For an API search gap it is
        `prompt` and, when recorded, `retrieval`.
      additionalProperties: false
      properties:
        source_text:
          type: string
          description: The sentence that carried the claim.
        prompt:
          type: string
          description: The question that produced the answer, or the question that went unanswered.
        answer_text:
          type: string
          description: The whole answer, so `source_text` can be read in context.
        quote:
          type: string
          description: A verbatim knowledge-base quote behind the verdict.
        reasoning:
          type: string
        suggested_fix:
          type: string
        confidence:
          type: string
        grounding_failed:
          type: boolean
          description: True when a verdict was demoted because its quote failed the grounding check.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/GapEvidenceItem"
        searches:
          type: array
          items:
            $ref: "#/components/schemas/GapEvidenceSearch"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/GapAnswerSource"
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/GapFeedbackNote"
        retrieval:
          $ref: "#/components/schemas/GapRetrievalContext"
    GapDetailResponse:
      type: object
      additionalProperties: false
      required:
        - gap
        - occurrences
        - resolutions
      properties:
        gap:
          $ref: "#/components/schemas/Gap"
        occurrences:
          type: array
          description: Up to the 20 most recent sightings, newest first.
          items:
            $ref: "#/components/schemas/GapOccurrence"
        resolutions:
          type: array
          description: Every resolution still in effect, newest first.
          items:
            $ref: "#/components/schemas/GapResolution"
        lead_evidence:
          $ref: "#/components/schemas/GapLeadEvidence"

    # ── Destinations & Credits ──
    OrgDestinationResponse:
      type: object
      description: A publishing destination available to the organization, with its per-org stats.
      additionalProperties: false
      required:
        - publisher_id
        - scope
        - type
        - name
        - slug
        - display_url
        - live_count
        - selected_for_generation
      properties:
        publisher_id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [shared, org]
          description: "`shared` for a globally-seeded destination, `org` for one your organization registered."
        type:
          type: string
          description: The destination type. Currently always `citeables`.
        name:
          type: string
        slug:
          type: string
        display_url:
          type: string
          description: The destination's display URL (its domain).
        live_count:
          type: integer
          description: Count of your org's content currently live on this destination.
        last_publish_at:
          type: string
          format: date-time
          description: The latest publish among your org's content currently live on this destination, if any (absent once nothing is live).
        selected_for_generation:
          type: boolean
          description: Whether this destination is currently selected as a content-generation target.
    OrgDestinationsListResponse:
      type: object
      additionalProperties: false
      required:
        - destinations
      properties:
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/OrgDestinationResponse"
    AddOrgDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - domain
      properties:
        type:
          type: string
          enum: [citeables]
          description: The destination type. Only `citeables` is supported.
        name:
          type: string
          description: A display name for the destination.
        domain:
          type: string
          description: The custom domain to register (e.g. `blog.example.com`).
    # ── Credits ───────────────────────────────
    # One flat shape for every organization: all six fields are always present.
    # `dedicated_balance` says how to read the two limit fields.
    OrgCreditBalanceResponse:
      type: object
      description: >-
        An organization's credit position — what it can still spend, and what it has
        spent to date.
      additionalProperties: false
      required:
        - org_id
        - dedicated_balance
        - credit_limit_set
        - credit_limit
        - total_usage
        - credits_available
      properties:
        org_id:
          type: string
          format: uuid
        dedicated_balance:
          type: boolean
          description: Whether the organization holds its own credit balance. Branch on this.
        credit_limit_set:
          type: boolean
          description: >-
            Whether a spend limit governs the organization. Always `false` when
            `dedicated_balance` is `true` — spend limits do not apply to an
            organization that holds its own balance.
        credit_limit:
          type: number
          nullable: true
          description: >-
            The spend allowance in credits, or `null` when no limit governs the
            organization. Since `total_usage` is a lifetime figure, this is a total
            allowance that does not reset.
          example: 100.00
        total_usage:
          type: number
          description: >-
            Credits spent over the organization's lifetime — not spend within the
            current billing period.
          example: 30.00
        credits_available:
          type: number
          nullable: true
          description: >-
            Credits still spendable — the organization's own balance when
            `dedicated_balance` is `true`, otherwise the spend limit minus lifetime
            usage, floored at zero. Never negative: an organization past its limit
            reports `0`. It is `null` only when no limit governs an organization
            that has no balance of its own — that means unmetered, not exhausted, so
            do not read `null` as zero.
          example: 70.00

    OrgCreditHistoryResponse:
      type: object
      description: >-
        Daily credit spend across a trailing window, with the window total.
      additionalProperties: false
      required:
        - org_id
        - days
        - period_usage
        - history
      properties:
        org_id:
          type: string
          format: uuid
        days:
          type: integer
          description: The window that was applied — your `days` parameter, or the default.
          example: 7
        period_usage:
          type: number
          description: >-
            Credits spent across the window, equal to the sum of `history[].usage`.
            This covers the requested window only — for lifetime spend read
            `total_usage` from `GET /org/credits/balance`, which will not match.
          example: 43.15
        history:
          type: array
          description: >-
            One entry per day, oldest first, always exactly `days` entries long.
          items:
            $ref: "#/components/schemas/OrgCreditHistoryEntry"

    OrgCreditHistoryEntry:
      type: object
      description: One day of credit spend.
      additionalProperties: false
      required:
        - date
        - usage
      properties:
        date:
          type: string
          format: date
          description: The calendar day, as `YYYY-MM-DD`.
          example: "2026-09-04"
        usage:
          type: number
          description: Credits spent that day — `0` on a day with no spend.
          example: 12.50

    # ── Evals ──
    EvalTriggerOptions:
      type: object
      description: Options every eval trigger accepts.
      properties:
        evaluator:
          type: string
          description: >-
            Which check to run. `kb_accuracy` verifies the text's factual claims about
            your brand against your knowledge base. `brand_alignment` grades the text
            against your brand kit's writing rules and needs a brand kit with rules
            configured, otherwise the run ends `failed`. Defaults to `kb_accuracy`.
          enum: [kb_accuracy, brand_alignment]
          default: kb_accuracy
        evaluator_version:
          type: string
          description: >-
            Pin an exact evaluator version (see `latest_version` on
            `GET /org/evals/evaluators`). Omit for the current version. An unknown
            version is a `422`.
        judge_model:
          type: string
          description: >-
            Override the model that judges the text. Must be on the server's
            allowlist, otherwise a `422`. Omit for the evaluator's default.
        label:
          type: string
          maxLength: 128
          description: A free-form tag stored on the run for finding it later.
        idempotency_key:
          type: string
          maxLength: 255
          description: >-
            Makes the trigger safe to retry. A second trigger with the same key in
            your organization returns the original run instead of judging again.
        wait:
          type: boolean
          default: false
          description: >-
            Hold the connection until the run finishes and return the full run as a
            `200`. If the server's wait ceiling lapses first, the response degrades to
            the `202` run handle and the run keeps executing.
    EvalTextRequest:
      description: Text to judge, plus the shared trigger options.
      allOf:
        - $ref: "#/components/schemas/EvalTriggerOptions"
        - type: object
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              description: >-
                The text to judge. An empty string is a `400`; text that is only
                whitespace is a `422`.
            title:
              type: string
              maxLength: 255
              description: Optional title, stored with the run's subject.
    EvalContentRequest:
      description: A saved content item to judge, plus the shared trigger options.
      allOf:
        - $ref: "#/components/schemas/EvalTriggerOptions"
        - type: object
          required:
            - content_id
          properties:
            content_id:
              type: string
              format: uuid
              description: The content item to judge. Its latest saved version is what gets evaluated.
    EvalRunSummary:
      type: object
      description: >-
        One eval run without its bulky payloads. Headline metrics appear once the run
        has completed; they are absent while it is queued or running, and on gated or
        failed runs.
      additionalProperties: false
      required:
        - eval_run_id
        - evaluator_key
        - evaluator_version
        - status
        - subject_type
        - judge_model
        - created_at
      properties:
        eval_run_id:
          type: string
          format: uuid
        evaluator_key:
          type: string
          description: The evaluator that ran, e.g. `kb_accuracy` or `brand_alignment`.
        evaluator_version:
          type: string
          description: The evaluator version this run was pinned to.
          example: "1.1"
        status:
          type: string
          description: >-
            `queued` — waiting for a worker. `running` — being judged. `completed` —
            judged, with metrics and claims. `gated` — a pre-check found nothing to
            judge (an empty answer or a refusal), so the run ended with no model spend;
            the reason is under `outputs.gates` in the run detail. `failed` — the
            judgment could not complete; see `error_code` and `error_message`.
            `canceled` is reserved and not currently produced. A run is finished when
            its status is `completed`, `gated`, or `failed`.
          enum: [queued, running, completed, gated, failed, canceled]
        subject_type:
          type: string
          description: >-
            What was judged — `inline` for text supplied to `POST /org/evals/text`,
            `content` for a saved content item. Other values belong to runs triggered
            elsewhere in Senso.
          enum:
            [
              content,
              content_generation_run_item,
              builder_workspace_version,
              question_run,
              search_turn,
              inline,
            ]
        subject_id:
          type: string
          format: uuid
          description: The judged item's id — the `content_id` for a content run. Absent for inline text.
        subject_version_id:
          type: string
          format: uuid
          description: The exact content version that was judged. Absent for inline text.
        judge_model:
          type: string
          description: The model that judged the text.
        label:
          type: string
          description: The label supplied on the trigger, if any.
        metrics:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            The evaluator's reported metrics, keyed as its metric descriptors describe
            them (`GET /org/evals/evaluators`). For `kb_accuracy` these are
            `accuracy_pct`, `coverage_pct`, `contradiction_pct`, and `band`, plus
            `grounding_failures` and `kb_internal_conflicts` when non-zero. For
            `brand_alignment` they are the metrics its descriptors list, such as
            `brand_score` and `brand_verdict`. Present once the run has completed.
        claims_total:
          type: integer
          description: >-
            Claims extracted from the text. Present once the run has completed; `0` for
            `brand_alignment`, which grades rules rather than claims.
        claims_scored:
          type: integer
          description: >-
            Claims that counted toward the score — those about your brand and verifiable.
            Present once completed; `0` for `brand_alignment`.
        accuracy_pct:
          type: number
          description: Share of scored claims the knowledge base verified, 0–100. Claim-based evaluators only.
        band:
          type: string
          description: Traffic-light reading of `accuracy_pct` against the evaluator's cut-offs. Claim-based evaluators only.
          enum: [green, yellow, red]
        total_cost:
          type: number
          description: Judge model spend for this run, in US dollars. Recorded for transparency; not billed to your credits.
        error_code:
          type: string
          description: Why a `failed` run failed, e.g. `judge_failed` or `dispatch_failed`.
        error_message:
          type: string
          description: Detail for `error_code`.
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: When the run reached a finished status. Absent while queued or running.
    EvalRunDetail:
      type: object
      description: >-
        Everything about one run — the poll target and the audit record. This is the
        only place the judge's full working is returned.
      additionalProperties: false
      required:
        - eval_run_id
        - evaluator_key
        - evaluator_version
        - status
        - subject_type
        - judge_model
        - created_at
        - claims
        - usage
      properties:
        eval_run_id:
          type: string
          format: uuid
        evaluator_key:
          type: string
          description: The evaluator that ran, e.g. `kb_accuracy` or `brand_alignment`.
        evaluator_version:
          type: string
          description: The evaluator version this run was pinned to.
          example: "1.1"
        status:
          type: string
          description: >-
            `queued` — waiting for a worker. `running` — being judged. `completed` —
            judged, with metrics and claims. `gated` — a pre-check found nothing to
            judge (an empty answer or a refusal), so the run ended with no model spend;
            the reason is under `outputs.gates` in the run detail. `failed` — the
            judgment could not complete; see `error_code` and `error_message`.
            `canceled` is reserved and not currently produced. A run is finished when
            its status is `completed`, `gated`, or `failed`.
          enum: [queued, running, completed, gated, failed, canceled]
        subject_type:
          type: string
          description: >-
            What was judged — `inline` for text supplied to `POST /org/evals/text`,
            `content` for a saved content item. Other values belong to runs triggered
            elsewhere in Senso.
          enum:
            [
              content,
              content_generation_run_item,
              builder_workspace_version,
              question_run,
              search_turn,
              inline,
            ]
        subject_id:
          type: string
          format: uuid
          description: The judged item's id — the `content_id` for a content run. Absent for inline text.
        subject_version_id:
          type: string
          format: uuid
          description: The exact content version that was judged. Absent for inline text.
        judge_model:
          type: string
          description: The model that judged the text.
        label:
          type: string
          description: The label supplied on the trigger, if any.
        metrics:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            The evaluator's reported metrics, keyed as its metric descriptors describe
            them (`GET /org/evals/evaluators`). For `kb_accuracy` these are
            `accuracy_pct`, `coverage_pct`, `contradiction_pct`, and `band`, plus
            `grounding_failures` and `kb_internal_conflicts` when non-zero. For
            `brand_alignment` they are the metrics its descriptors list, such as
            `brand_score` and `brand_verdict`. Present once the run has completed.
        claims_total:
          type: integer
          description: >-
            Claims extracted from the text. Present once the run has completed; `0` for
            `brand_alignment`, which grades rules rather than claims.
        claims_scored:
          type: integer
          description: >-
            Claims that counted toward the score — those about your brand and verifiable.
            Present once completed; `0` for `brand_alignment`.
        accuracy_pct:
          type: number
          description: Share of scored claims the knowledge base verified, 0–100. Claim-based evaluators only.
        band:
          type: string
          description: Traffic-light reading of `accuracy_pct` against the evaluator's cut-offs. Claim-based evaluators only.
          enum: [green, yellow, red]
        total_cost:
          type: number
          description: Judge model spend for this run, in US dollars. Recorded for transparency; not billed to your credits.
        error_code:
          type: string
          description: Why a `failed` run failed, e.g. `judge_failed` or `dispatch_failed`.
        error_message:
          type: string
          description: Detail for `error_code`.
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: When the run reached a finished status. Absent while queued or running.
        subject:
          type: object
          additionalProperties: true
          description: >-
            The subject exactly as it was judged, so later edits cannot change what
            a verdict refers to. For inline text: `title` and `text`. For a content
            item: `content_id`, `content_version_id`, `version_num`, `title`,
            `editorial_status`, and `text`.
        outputs:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Structured detail too bulky or too shaped for `metrics`, present once
            the run has been processed. Includes `gates`, the pre-check result
            (`passed`, `answer_produced`, `is_refusal`, `sources_present`, and
                `reason` and `detail` when the run was gated). `kb_accuracy` adds `mode`,
            `relevance_floor`, and `search_type`; `brand_alignment` adds its full
            review under `brand_alignment`. `extraction_salvaged` or
            `result_salvaged` flag a run whose model output had to be partially
            recovered.
        claims:
          type: array
          description: >-
            Every claim — or, for `brand_alignment`, every graded writing rule —
            with its verdict. Empty until the run completes, and for gated or
            failed runs.
          items:
            $ref: "#/components/schemas/EvalClaim"
        searches:
          type: array
          nullable: true
          description: Every knowledge-base search the judge ran, in order. `kb_accuracy` only.
          items:
            $ref: "#/components/schemas/EvalSearchRecord"
        evidence_chunks:
          type: array
          nullable: true
          description: Every knowledge-base passage the judge read while verifying claims. `kb_accuracy` only.
          items:
            $ref: "#/components/schemas/EvalEvidenceChunk"
        searches_over_budget:
          type: integer
          description: >-
            Searches the judge wanted to run beyond its budget. Non-zero means some
            claims were judged on less evidence than the judge asked for.
        usage:
          $ref: "#/components/schemas/EvalUsage"
    EvalUsage:
      type: object
      description: What the judgment cost. Recorded, not billed.
      additionalProperties: false
      properties:
        api_calls:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_tokens:
          type: integer
        total_cost:
          type: number
          description: In US dollars.
        split:
          type: object
          nullable: true
          description: The same figures by stage — `extraction` (claim extraction) and the evaluator's key.
          additionalProperties:
            $ref: "#/components/schemas/EvalStageUsage"
    EvalStageUsage:
      type: object
      additionalProperties: false
      required:
        - api_calls
        - input_tokens
        - output_tokens
        - cached_tokens
        - total_cost
      properties:
        api_calls:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_tokens:
          type: integer
        total_cost:
          type: number
          description: In US dollars.
    EvalSearchRecord:
      type: object
      description: One knowledge-base search the judge ran.
      additionalProperties: false
      required:
        - query
        - scoped_to_cited
        - max_results
        - n_results
        - result_content_ids
      properties:
        query:
          type: string
          description: The search the judge issued.
        scoped_to_cited:
          type: boolean
          description: >-
            True when the search was restricted to the sources the judged answer
            itself cited. Always false for text and content subjects.
        max_results:
          type: integer
          description: How many passages the judge asked for.
        n_results:
          type: integer
          description: How many it got back.
        result_content_ids:
          type: array
          nullable: true
          description: The content items the returned passages came from. `null` when the search returned nothing.
          items:
            type: string
            format: uuid
        result_titles:
          type: array
          description: Titles of those content items, when known.
          items:
            type: string
        top_score:
          type: number
          description: The highest relevance score among the results.
        error:
          type: string
          description: Present when the search itself failed.
    EvalEvidenceChunk:
      type: object
      description: One knowledge-base passage the judge read.
      additionalProperties: false
      required:
        - content_id
        - chunk_index
        - text
      properties:
        content_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
          description: The passage's position within its content item.
        title:
          type: string
          description: The content item's title, when known.
        score:
          type: number
          description: Relevance score from the search that returned it.
        text:
          type: string
          description: The passage as the judge saw it.
        truncated:
          type: boolean
          description: True when the passage was cut to fit the judge's context.
    EvalClaim:
      type: object
      description: >-
        One judged statement — a factual claim for `kb_accuracy`, a graded writing rule
        for `brand_alignment`.
      additionalProperties: false
      required:
        - eval_claim_id
        - eval_run_id
        - evaluator_key
        - subject_type
        - claim_key
        - claim_text
        - item_hash
        - passed
        - bucket
        - created_at
      properties:
        eval_claim_id:
          type: string
          format: uuid
        eval_run_id:
          type: string
          format: uuid
        evaluator_key:
          type: string
        subject_type:
          type: string
          description: The run's subject type.
          enum:
            [
              content,
              content_generation_run_item,
              builder_workspace_version,
              question_run,
              search_turn,
              inline,
            ]
        claim_key:
          type: string
          description: >-
            The claim's identifier within its run (`c1`, `c2`, …). For
            `brand_alignment`, the writing rule that was graded.
          example: c15
        claim_text:
          type: string
          description: >-
            The statement that was judged, in the judge's words. For a brand rule, the
            quoted passage that was graded, or `Rule N: <rule text>` when the reviewer
            quoted nothing.
        item_hash:
          type: string
          description: A stable hash of the claim text, so the same statement can be recognised across runs.
        source_text:
          type: string
          description: The sentence in the subject the claim was extracted from.
        kind:
          type: string
          description: >-
            What sort of claim it is — normally `numeric`, `entity`, `procedural`,
            `modal`, or `other`. `kb_accuracy` only.
        about_brand:
          type: boolean
          description: Whether the claim is about your organization. General knowledge is never checked against the knowledge base.
        verifiable:
          type: boolean
          description: Whether a document could settle the claim. Subjective claims are excluded from scoring.
        verdict:
          type: string
          description: >-
            The evaluator's own vocabulary. `kb_accuracy`: `verified`, `conflict`,
            `unsupported`, or `not_verifiable`. `brand_alignment`: `pass`, `partial`,
            `fail`, `not_applicable`, or `ungraded`. Absent when the claim was
            excluded before verification, or when the judge returned no verdict for a
            checkable claim — which scores as unsupported.
        passed:
          type: boolean
          nullable: true
          description: >-
            The normalized signal — `true` passed, `false` failed, `null` excluded from
            scoring rather than failing.
        bucket:
          type: string
          description: >-
            The claim's classification. For knowledge-base checks on text and content:
            `general` (not about your brand), `subjective`, `grounded`,
            `contradicts_kb`, or `unsupported_by_kb`. For checks on cited answers:
            `ok`, `kb_gap`, `generation_error`, `kb_conflict_or_retrieval`, or
            `retrieval_miss`. For `brand_alignment` rows it carries the rule identifier.
        confidence:
          type: string
          description: The judge's confidence in the verdict — normally `high`, `medium`, or `low`.
        reasoning:
          type: string
          description: Why the judge reached the verdict.
        quote:
          type: string
          description: >-
            The verbatim knowledge-base sentence the verdict rests on, checked against
            the retrieved text before the verdict was allowed to stand. Present on
            positive verdicts.
        grounding_failed:
          type: boolean
          description: >-
            True when the verdict was demoted because its quote or citation was not in
            the retrieved text — the judge asserting support that was not there.
            Distinct from an honest `unsupported`.
        grounding_problem:
          type: string
          description: What was wrong with the grounding, when `grounding_failed` is true.
        original_verdict:
          type: string
          description: The verdict before demotion, when `grounding_failed` is true.
        suggested_fix:
          type: string
          description: A concrete rewording for a failing claim or rule.
        evidence:
          type: array
          nullable: true
          description: The knowledge-base passages the verdict rests on.
          items:
            $ref: "#/components/schemas/EvalClaimEvidence"
        evidence_was_cited:
          type: boolean
          description: >-
            Whether the evidence came from a source the judged answer itself cited.
            Only meaningful for cited-answer subjects; for text and content subjects
            it is `false` whenever evidence is present. Absent when the claim has no
            evidence.
        created_at:
          type: string
          format: date-time
    EvalClaimEvidence:
      type: object
      description: One pointer into the knowledge base bearing on a claim.
      additionalProperties: false
      required:
        - content_id
        - relation
      properties:
        content_id:
          type: string
          description: >-
            The content item the passage came from. An empty string marks a citation
            the judge gave that could not be matched to any retrieved passage; such
            verdicts are demoted (see `grounding_failed` on the claim).
        chunk_index:
          type: integer
        content_version_id:
          type: string
          format: uuid
        relation:
          type: string
          description: How the passage bears on the claim — normally `entails`, `contradicts`, or `related`.
    EvalRunListResponse:
      type: object
      description: One page of eval runs.
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          description: The runs on this page, newest first.
          items:
            $ref: "#/components/schemas/EvalRunSummary"
        total:
          type: integer
          description: Total runs matching the filters, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The offset that was applied.
    EvalClaimListResponse:
      type: object
      description: One page of judged claims.
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          description: The claims on this page, newest first.
          items:
            $ref: "#/components/schemas/EvalClaim"
        total:
          type: integer
          description: Total claims matching the filters, across all pages.
        limit:
          type: integer
          description: The page size that was applied.
        offset:
          type: integer
          description: The offset that was applied.
    Evaluator:
      type: object
      description: One evaluator your organization can run.
      additionalProperties: false
      required:
        - key
        - display_name
        - evaluation_unit
        - scope
      properties:
        key:
          type: string
          description: The identifier to pass as `evaluator` on a trigger.
          example: kb_accuracy
        display_name:
          type: string
          example: Knowledge Base Accuracy
        description:
          type: string
          description: What the evaluator checks.
        evaluation_unit:
          type: string
          description: What one claim row represents — `claim` for `kb_accuracy`, `rule` for `brand_alignment`.
        scope:
          type: string
          description: >-
            `builtin` for the evaluators Senso provides to every organization.
        latest_version:
          type: string
          description: The version a trigger uses when none is pinned.
          example: "1.1"
        subjects:
          type: array
          description: The subject types this evaluator accepts.
          items:
            type: string
        metrics:
          type: array
          description: Descriptors for the metrics the evaluator reports, so score cards can be rendered generically.
          items:
            $ref: "#/components/schemas/EvaluatorMetricDescriptor"
    EvaluatorMetricDescriptor:
      type: object
      description: Describes one metric an evaluator reports under `metrics` on its runs.
      additionalProperties: true
      required:
        - key
        - type
      properties:
        key:
          type: string
          description: The metric's key in a run's `metrics`.
          example: accuracy_pct
        type:
          type: string
          description: The metric's value type, `number` or `enum`.
        range:
          type: array
          description: For numbers, the minimum and maximum possible value.
          minItems: 2
          maxItems: 2
          items:
            type: number
        bands:
          type: object
          description: >-
            For banded numbers, the minimum value for each band: at or above `green` is
            green, at or above `yellow` is yellow, below that is red.
          additionalProperties:
            type: number
        values:
          type: array
          description: For enums, the possible values.
          items:
            type: string
        description:
          type: string
        modes:
          type: array
          description: Present when the metric is only reported for some subject types.
          items:
            type: string
    EvaluatorListResponse:
      type: object
      description: The evaluators available to your organization.
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Evaluator"
        total:
          type: integer
        limit:
          type: integer
          description: Equals `total` — the list is not paginated.
        offset:
          type: integer
          description: Always 0.

    # ── Knowledge Base (nodes) ──
    KBNodeResponse:
      type: object
      description: >-
        A knowledge-base node — a folder or a document. `content` and `content_id` appear
        only on document nodes (`type: content`); folders, including the root, never carry
        them. `effective_role` is included by the single-node and listing reads but not by
        `GET /org/kb/root` or the ancestors read.
      additionalProperties: false
      required:
        - kb_node_id
        - org_id
        - parent_id
        - type
        - name
        - tags
        - is_public
        - is_public_root
        - created_at
        - updated_at
      properties:
        kb_node_id:
          type: string
          format: uuid
          description: >-
            Unique identifier for this document or folder. Use it in the `/org/kb/nodes/{id}/…`
            endpoints.
        org_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The parent folder's id, or null for the root folder.
        content_id:
          type: string
          format: uuid
          description: The backing content item's id (document nodes only).
        type:
          type: string
          enum: [folder, content]
          description: "`folder` or `content` (a document)."
        name:
          type: string
          description: >-
            Display name of the document or folder.
        content:
          $ref: "#/components/schemas/KBNodeContentInfo"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagResponse"
        effective_role:
          type: string
          enum: [viewer, editor, owner, admin]
          description: >-
            The caller's access level on this node — `viewer`, `editor`, `owner`, or
            `admin` (org-admin bypass). Absent where not computed.
        is_public:
          type: boolean
          description: Whether the node is publicly accessible.
        is_public_root:
          type: boolean
          description: Whether the node is the root of a public share.
        created_by:
          type: string
          format: uuid
          description: The user who created the node, if recorded.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KBNodeContentInfo:
      type: object
      description: Content metadata for a document node.
      additionalProperties: false
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uuid
          description: The content item's id.
        type:
          type: string
          description: The content's source kind (e.g. `file`, `raw`, `web`).
        content_type:
          type: string
          description: The file's MIME type (e.g. `application/pdf`, `text/markdown`).
        title:
          type: string
        summary:
          type: string
        version_num:
          type: integer
          format: int64
          description: The current content version number.
        processing_status:
          type: string
          enum: [pending, processing, complete, failed]
          description: The ingestion status of the document.
        error_code:
          type: string
          description: >-
            Stable classification of an ingestion failure; present only when
            `processing_status` is `failed`.
    KBNodeListResponse:
      type: object
      description: A paginated list of KB nodes.
      additionalProperties: false
      required:
        - nodes
        - total
        - limit
        - offset
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/KBNodeResponse"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    KBNodeAncestorsResponse:
      type: object
      description: The breadcrumb path to a node.
      additionalProperties: false
      required:
        - ancestors
      properties:
        ancestors:
          type: array
          description: The node's ancestor folders, root first.
          items:
            $ref: "#/components/schemas/KBNodeResponse"
    KBSyncStatusResponse:
      type: object
      additionalProperties: false
      required:
        - syncing
      properties:
        syncing:
          type: boolean
          description: >-
            True while queued move and delete operations are still propagating across
            the organization's knowledge base. Not an ingestion signal — a document's
            own `content.processing_status` reports that.
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The parent folder's id. Omit or null to create under the root.
    RenameKBNodeRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The new name.
    MoveKBNodeRequest:
      type: object
      additionalProperties: false
      required:
        - new_parent_id
      properties:
        new_parent_id:
          type: string
          format: uuid
          description: The destination folder's id.
    BulkDeleteKBNodesRequest:
      type: object
      additionalProperties: false
      required:
        - node_ids
      properties:
        node_ids:
          type: array
          description: The ids of the nodes to delete (1–100).
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid

    # ── KB content writes (raw / file ingestion) ──
    CreateRawContentRequest:
      type: object
      description: >-
        Tags cannot be supplied on creation — attach them afterward with the node-tags
        endpoints (e.g. `PUT /org/kb/nodes/{id}/tags`). Senso auto-tags the document in
        the background once ingestion finishes.
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          description: The document body (raw text or markdown).
        title:
          type: string
        summary:
          type: string
        kb_folder_node_id:
          type: string
          format: uuid
          nullable: true
          description: The folder to create the document in. Omit or null for the root.
    UpdateRawContentRequest:
      type: object
      description: >-
        Replaces the document's title, summary, and text. Supply `tag_ids` to replace its
        tags in the same call, or omit it to leave them as they are.
      additionalProperties: false
      required:
        - title
        - text
      properties:
        title:
          type: string
          description: The new title (required, non-empty).
        text:
          type: string
          description: The new document body (required, non-empty).
        summary:
          type: string
        tag_ids:
          type: array
          description: >-
            Replaces the document's full tag set. Omit to leave the existing tags
            unchanged; send an empty array to remove them all. Each id must be a tag that
            already exists in your organization — an unknown id is rejected and no part of
            the update is applied. To attach tags by name, use the node-tags endpoints.
          items:
            type: string
            format: uuid
    PatchRawContentRequest:
      type: object
      description: >-
        At least one of `title`, `summary`, or `text` must be supplied. `tag_ids` on its
        own is not a valid update — it accompanies a change to the document's content.
      additionalProperties: false
      properties:
        title:
          type: string
        summary:
          type: string
        text:
          type: string
        tag_ids:
          type: array
          description: >-
            Replaces the document's full tag set. Omit to leave the existing tags
            unchanged; send an empty array to remove them all. Each id must be a tag that
            already exists in your organization — an unknown id is rejected and no part of
            the update is applied. To attach tags by name, use the node-tags endpoints.
          items:
            type: string
            format: uuid
    IngestionUploadFileItem:
      type: object
      description: One file's metadata. The bytes are uploaded separately to the returned presigned URL.
      additionalProperties: false
      required:
        - filename
        - file_size_bytes
        - content_type
        - content_hash_md5
      properties:
        filename:
          type: string
        file_size_bytes:
          type: integer
          format: int64
          minimum: 1
        content_type:
          type: string
          description: The file's MIME type (e.g. `application/pdf`).
        content_hash_md5:
          type: string
          description: The file's MD5 hash, 32 hex characters.
          minLength: 32
          maxLength: 32
    IngestionUploadRequest:
      type: object
      additionalProperties: false
      required:
        - files
      properties:
        kb_folder_node_id:
          type: string
          format: uuid
          nullable: true
          description: The folder to create the documents in. Omit or null for the root.
        files:
          type: array
          description: 1–10 files to register for ingestion.
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/IngestionUploadFileItem"
    IngestionUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          $ref: "#/components/schemas/IngestionUploadFileItem"
    IngestionUploadResultItem:
      type: object
      description: The ingestion-registration result for one file.
      additionalProperties: false
      required:
        - filename
        - status
      properties:
        filename:
          type: string
        status:
          type: string
          description: >-
            `upload_pending` (accepted — PUT the bytes to `upload_url`), `conflict` (an
            active run is already processing this content), `duplicate` (the same file
            appears twice in the request), `invalid` (failed metadata validation), or
            `markdown_requires_raw_ingestion` (a `.md`/`.markdown` file was supplied —
            create markdown documents via the raw-text endpoint instead).
        ingestion_run_id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        kb_node_id:
          type: string
          format: uuid
          description: The created/replaced document node. Absent on skipped items (any status other than `upload_pending`).
        upload_url:
          type: string
          description: Presigned URL to PUT the file bytes to (accepted items only).
        expires_in:
          type: integer
          description: Seconds until `upload_url` expires.
        error:
          type: string
          description: Why the file was skipped (skipped items only).
        existing_content_id:
          type: string
          format: uuid
          description: The already-processing content's id (`conflict` items only).
    IngestionUploadSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - success
        - skipped
      properties:
        total:
          type: integer
        success:
          type: integer
          description: Files accepted for ingestion.
        skipped:
          type: integer
          description: Files not accepted (any status other than `upload_pending`).
    IngestionUploadResponse:
      type: object
      additionalProperties: false
      required:
        - summary
        - results
      properties:
        summary:
          $ref: "#/components/schemas/IngestionUploadSummary"
        results:
          type: array
          items:
            $ref: "#/components/schemas/IngestionUploadResultItem"
    ContentTagsInfo:
      type: object
      description: Legacy category/topic labels for a content item.
      additionalProperties: false
      properties:
        category_id:
          type: string
        category_name:
          type: string
        topic_id:
          type: string
        topic_name:
          type: string
    ContentResponse:
      type: object
      description: A content item (an ingested source or generated output) with its current version.
      additionalProperties: false
      required:
        - id
        - org_id
        - type
        - content_type
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [raw, web, file]
          description: The content's source kind.
        title:
          type: string
        summary:
          type: string
        tags:
          $ref: "#/components/schemas/ContentTagsInfo"
        org_tags:
          type: array
          description: The org tags attached to this content.
          items:
            $ref: "#/components/schemas/TagResponse"
        latest_content_version_id:
          type: string
          format: uuid
        version_num:
          type: integer
          format: int64
        processing_status:
          type: string
          enum: [pending, processing, complete, failed]
          description: The ingestion status of the content.
        error_code:
          type: string
          description: Stable classification of an ingestion failure; present only when `processing_status` is `failed`.
        content_type:
          type: string
          description: The MIME type of the content (e.g. `text/markdown`, `application/pdf`).
        kb_node_id:
          type: string
          format: uuid
          description: The node addressing this content in the KB tree. Absent for content with no node (e.g. content-engine drafts).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentVersionResponse:
      type: object
      description: One version in a content item's version history.
      additionalProperties: false
      required:
        - version_id
        - version_num
        - title
        - editorial_status
        - is_current
        - created_at
        - updated_at
      properties:
        version_id:
          type: string
          format: uuid
        version_num:
          type: integer
          format: int64
        title:
          type: string
        summary:
          type: string
        editorial_status:
          type: string
          description: The editorial workflow state (e.g. `draft`, `published`).
        is_current:
          type: boolean
          description: Whether this is the content item's current version.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentVersionListResponse:
      type: object
      description: A content item's version history.
      additionalProperties: false
      required:
        - content_id
        - versions
      properties:
        content_id:
          type: string
          format: uuid
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ContentVersionResponse"
    ContentOwnerResponse:
      type: object
      description: A user who owns a content item.
      additionalProperties: false
      required:
        - user_id
        - email
        - given_name
        - family_name
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        given_name:
          type: string
        family_name:
          type: string
    UpdateContentOwnersRequest:
      type: object
      description: Replaces a content item's owner set with the given users.
      additionalProperties: false
      properties:
        user_ids:
          type: array
          description: The user ids to set as owners. An empty or omitted list removes all owners.
          items:
            type: string
            format: uuid
    ContentCTASelectionRequest:
      type: object
      description: Sets which call-to-action (CTA) a content item carries when it is published.
      additionalProperties: false
      required:
        - selection_type
      properties:
        selection_type:
          type: string
          description: >-
            `default` inherits the org's default CTA template, `template` pins the template
            named by `cta_id`, and `none` publishes without a CTA.
          enum:
            - default
            - template
            - none
        cta_id:
          type: string
          format: uuid
          description: >-
            The CTA template to pin. Required when `selection_type` is `template` and must be
            omitted otherwise. Must be one of your organization's templates.
    ContentCTASelectionResponse:
      type: object
      description: A content item's call-to-action (CTA) selection, with the template it resolves to.
      additionalProperties: false
      required:
        - content_id
        - org_id
        - selection_type
      properties:
        content_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        selection_type:
          type: string
          description: >-
            `default` (the org's default template), `template` (a pinned template), or
            `none` (no CTA). An item whose selection has never been set reports `default`.
            A pinned template that later becomes the org default reads back as `default`,
            and items that were live and using the org default when that default was
            cleared read `none`.
          enum:
            - default
            - template
            - none
        cta_id:
          type: string
          format: uuid
          description: The pinned template's id. Present only when `selection_type` is `template`.
        template:
          allOf:
            - $ref: "#/components/schemas/CTAResponse"
          description: >-
            The template the selection resolves to — the pinned template for `template`, or
            the org's default template for `default`. Omitted for `none`, and for `default`
            when the org has no default template.
        updated_by:
          type: string
          format: uuid
          description: >-
            The user who last set the selection. Present only when a user last set it;
            omitted when the selection has never been set, was last set with an API key, or
            was last changed automatically.
        created_at:
          type: string
          format: date-time
          description: When the selection was first set. Omitted when it has never been set.
        updated_at:
          type: string
          format: date-time
          description: When the selection was last changed. Omitted when it has never been set.
    SetDefaultCTARequest:
      type: object
      description: Names the template to make the org default.
      additionalProperties: false
      required:
        - cta_id
      properties:
        cta_id:
          type: string
          format: uuid
          description: The template to make the default. Must be one of your organization's templates.
    ClearedResponse:
      type: object
      required:
        - cleared
      additionalProperties: false
      properties:
        cleared:
          type: boolean
          description: Always true — the setting was cleared.
          example: true
    CTAAssetUploadRequest:
      type: object
      description: Describes the CTA image about to be uploaded.
      additionalProperties: false
      required:
        - filename
        - content_type
        - file_size_bytes
      properties:
        filename:
          type: string
          maxLength: 255
          description: The file's name. Its extension, when present, must match `content_type`.
        content_type:
          type: string
          maxLength: 100
          description: The image's media type.
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
        file_size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: The file size in bytes, at most 10 MiB.
    CTAAssetUploadResponse:
      type: object
      description: A pre-signed upload target for a CTA image.
      additionalProperties: false
      required:
        - upload_url
        - image_url
        - object_key
        - expires_in
        - upload_headers
      properties:
        upload_url:
          type: string
          description: The pre-signed URL to `PUT` the file bytes to.
        image_url:
          type: string
          description: The public URL the image will have once uploaded — use it as a template's `image_url`.
        object_key:
          type: string
          description: The storage key of the uploaded object. Its extension follows `content_type` (`.png`, `.jpg`, `.webp` or `.gif`), not `filename`.
        expires_in:
          type: integer
          description: Seconds until `upload_url` stops accepting the upload (currently 900).
        upload_headers:
          type: object
          description: >-
            The headers to send with the `PUT`: `Content-Type` (the accepted content type) and
            `Cache-Control`.
          additionalProperties:
            type: string
    CTARequest:
      type: object
      description: >-
        The fields of a CTA template. Create and update both take the full set; on update,
        omitted optional fields are cleared.
      additionalProperties: false
      required:
        - title
        - button_label
        - target_url
      properties:
        title:
          type: string
          maxLength: 255
          description: The card's heading. Trimmed; must not be blank.
        description:
          type: string
          maxLength: 2000
          description: Supporting copy shown under the heading. Trimmed; empty when omitted.
        image_url:
          type: string
          maxLength: 2048
          description: >-
            The URL of the card's image, typically one returned by
            `POST /org/cta-assets/upload-url`. Must be a URL with a scheme (for example
            `https://`). Omit it, or send `null`, to leave the card without an image; an empty
            string is rejected.
        image_position:
          allOf:
            - $ref: "#/components/schemas/CTAImagePosition"
          description: The focal point of the card's image. Stored as given.
        button_label:
          type: string
          maxLength: 120
          description: The button's text. Trimmed; must not be blank.
        target_url:
          type: string
          maxLength: 2048
          description: The URL the button links to. Must be a URL with a scheme (for example `https://`).
        agent_text:
          type: string
          maxLength: 2000
          description: >-
            Text for AI agents to present in place of the composed default. Blank values are
            dropped.
        eyebrow:
          type: string
          maxLength: 120
          description: A short label shown above the heading. Blank values are dropped.
        is_default:
          type: boolean
          description: >-
            `true` makes this template the org default, replacing any previous default. On
            update, `false` or omitted leaves the default flag unchanged.
    CTAListResponse:
      type: object
      description: The organization's CTA templates.
      additionalProperties: false
      required:
        - templates
        - total
      properties:
        templates:
          type: array
          description: Every template, the org default first and the rest oldest first.
          items:
            $ref: "#/components/schemas/CTAResponse"
        default_cta:
          allOf:
            - $ref: "#/components/schemas/CTAResponse"
          description: The org default template. Omitted when no default is set.
        total:
          type: integer
          description: The number of templates returned.
    CTAResponse:
      type: object
      description: A call-to-action (CTA) template — the card attached to a published content-engine page.
      additionalProperties: false
      required:
        - cta_id
        - org_id
        - title
        - description
        - button_label
        - target_url
        - resolved_agent_text
        - is_default
        - created_at
        - updated_at
      properties:
        cta_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        title:
          type: string
          description: The card's heading.
        description:
          type: string
          description: Supporting copy shown under the heading. May be empty.
        image_url:
          type: string
          description: The URL of the card's image. Omitted when the template has no image.
        image_position:
          allOf:
            - $ref: "#/components/schemas/CTAImagePosition"
          description: The focal point of the card's image. Omitted when not set.
        button_label:
          type: string
          description: The button's text.
        target_url:
          type: string
          description: The URL the button links to.
        agent_text:
          type: string
          description: >-
            Text for AI agents to present in place of the composed default. Omitted when not
            set.
        resolved_agent_text:
          type: string
          description: >-
            The text presented to AI agents for this CTA: `agent_text` when set, otherwise
            `{org name} recommends: {title}. {description} {button_label}: {target_url}`
            (the description part is dropped when empty).
        eyebrow:
          type: string
          description: A short label shown above the heading. Omitted when not set.
        is_default:
          type: boolean
          description: Whether this is the org's default template.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        live_update_count:
          type: integer
          description: >-
            On template update and set-default responses only: the number of live content
            items whose CTA resolves to this template — those pinned to it plus, when it is the
            org default, those inheriting the default. Omitted when zero.
        live_update_queued:
          type: boolean
          description: >-
            On template update and set-default responses only: `true` when the update of the
            affected live pages was queued for background processing rather than applied
            immediately. Omitted otherwise.
    CTAImagePosition:
      type: object
      description: >-
        The focal point of a CTA image, as the `x` and `y` values supplied when the template
        was saved (for example `0.5` and `0.5`).
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
        y:
          type: number
    PublishDestinationResponse:
      type: object
      description: One publish destination's state for a content item.
      additionalProperties: false
      required:
        - publish_record_id
        - publisher_name
        - publisher_slug
        - publisher_type
        - publisher_scope
        - state
      properties:
        publish_record_id:
          type: string
          format: uuid
        publisher_id:
          type: string
          format: uuid
        publisher_name:
          type: string
        publisher_slug:
          type: string
        publisher_type:
          type: string
          description: >-
            The destination's publisher kind: `citeables`, or `manual` for content you
            published yourself and recorded via manual publish.
        publisher_scope:
          type: string
          description: Whether the destination is shared across the org or org-specific (e.g. `shared`, `org`).
        state:
          type: string
          description: The publish state for this destination (e.g. `live`, `pending`, `failed`).
        external_url:
          type: string
          description: The published URL, when live.
        last_attempt_at:
          type: string
          format: date-time
        last_error:
          type: string
          description: The last publish error, when the most recent attempt failed.
    ContentRejectionResponse:
      type: object
      description: The latest rejection record for a content item's current version (present only on rejected rows).
      additionalProperties: false
      properties:
        reason:
          type: string
        rejected_at:
          type: string
          format: date-time
        rejected_by:
          $ref: "#/components/schemas/ContentOwnerResponse"
    ContentVerificationItemResponse:
      type: object
      description: One content item in the verification list, with its owners, tags, destinations, and citation metrics.
      additionalProperties: false
      required:
        - content_id
        - version_id
        - title
        - editorial_status
        - generated_at
        - ever_published
        - manually_marked_published
        - raw_citations
        - geo_question_id
        - question_text
        - question_type
        - owners
        - org_tags
        - destinations
      properties:
        content_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        editorial_status:
          type: string
          description: The editorial workflow state (e.g. `draft`, `published`, `rejected`).
        generated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        ever_published:
          type: boolean
        manually_marked_published:
          type: boolean
          description: >-
            True when the content was recorded as published manually rather than pushed through a
            destination.
        citation_rate:
          type: number
          description: >-
            **Citation Coverage for this content item, despite the field name** — the name is kept
            for backward compatibility, but the metric is not a Citation Rate. Numerator: distinct
            answers to this item's linked prompt, in the last 30 days, that cited one of the
            item's live published URLs. Denominator: `D` scoped to that prompt — the distinct
            answers to it in the same 30 days that carried at least one citation of any tier. Both
            are answer grain, so an answer citing this page three times counts once. Expressed as
            a percentage on a **0–100** scale, not a 0–1 fraction. Absent when that `D` was zero:
            not measured, never measured as zero.
        raw_citations:
          type: integer
          format: int64
          description: >-
            Citation **instances** (not answers) in the last 30 days pointing at any of this
            item's live destination URLs, summed across all destinations. Unlike `citation_rate`
            this is not scoped to the linked prompt, and it is `0` rather than absent when nothing
            matched.
        geo_question_id:
          type: string
          format: uuid
        question_text:
          type: string
        question_type:
          type: string
          description: The prompt's question type (e.g. `awareness`, `consideration`, `evaluation`, `decision`).
        persona_name:
          type: string
        owners:
          type: array
          items:
            $ref: "#/components/schemas/ContentOwnerResponse"
        org_tags:
          type: array
          items:
            $ref: "#/components/schemas/TagResponse"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/PublishDestinationResponse"
        rejection:
          allOf:
            - $ref: "#/components/schemas/ContentRejectionResponse"
          description: >-
            Present only when the content has been rejected.
        earliest_publish_at:
          type: string
          format: date-time
        first_citation_at:
          type: string
          format: date-time
        days_to_first_citation:
          type: integer
    ContentVerificationListResponse:
      type: object
      description: A paginated list of content items in the verification workflow.
      additionalProperties: false
      required:
        - items
        - total_count
        - draft_count
        - rejected_count
        - pending_published_draft_count
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentVerificationItemResponse"
        total_count:
          type: integer
          description: >-
            Content items matching the filter, across all pages.
        draft_count:
          type: integer
          description: >-
            Items whose current version is a draft that has never been published.
        rejected_count:
          type: integer
          description: >-
            Items whose current version has been rejected.
        pending_published_draft_count:
          type: integer
          description: >-
            Items whose current version is a draft **while a previously published version is still
            live** — a re-edit in progress, counted as a subset of published rather than of
            drafts.
        limit:
          type: integer
        offset:
          type: integer
    PublishedDomainSummaryResponse:
      type: object
      description: A per-publisher rollup across all of the org's published content.
      additionalProperties: false
      required:
        - publisher_id
        - publisher_name
        - item_count
        - citation_numerator
        - citation_denominator
        - citation_window_days
        - citation_missing_days_excluded
      properties:
        publisher_id:
          type: string
          format: uuid
        publisher_name:
          type: string
        external_url:
          type: string
        item_count:
          type: integer
          description: >-
            Distinct content items currently live at this publisher.
        citation_rate:
          type: number
          description: >-
            **Citation Coverage for this publisher, despite the field name** — the name is kept
            for backward compatibility, but the metric is not a Citation Rate. `citation_numerator
            / citation_denominator`, expressed as a percentage on a **0–100** scale rather than a
            0–1 fraction. Absent when the denominator was zero: no answer in the window carried a
            citation, so there was nothing to measure against. Not measured, never measured as
            zero.
        citation_numerator:
          type: integer
          description: >-
            Distinct **answers** in the window that cited one of this organization's own published
            pages at this publisher. Answer grain — an answer citing three of your pages here
            counts once, not three times. Matched at the full page-URL level, so pages other
            organizations publish on a shared domain never count toward it.
        citation_denominator:
          type: integer
          description: >-
            **`D`** — distinct answers in the window that carried at least one citation of any
            tier, across all of this organization's monitored prompts. This is the canonical
            Citation Coverage denominator: not all runs, not answered (non-empty) runs, and not a
            count of citation instances.
        citation_window_days:
          type: integer
          description: >-
            Length of the trailing window both counts are taken over, in days. Currently 30.
        citation_missing_days_excluded:
          type: boolean
          description: >-
            True when days with no monitoring runs were left out of the window rather than counted
            as zeros. They contribute nothing to either count, so a gap in monitoring cannot
            silently drag the coverage down.
    ContentVerificationCountsResponse:
      type: object
      description: Content verification counts by status, plus per-publisher published rollups.
      additionalProperties: false
      required:
        - draft_count
        - published_count
        - rejected_count
        - pending_published_draft_count
        - published_domain_summaries
      properties:
        draft_count:
          type: integer
        published_count:
          type: integer
        rejected_count:
          type: integer
        pending_published_draft_count:
          type: integer
        published_domain_summaries:
          type: array
          items:
            $ref: "#/components/schemas/PublishedDomainSummaryResponse"
    VelocityDestinationSummaryResponse:
      type: object
      description: Per-publisher publish-to-citation velocity metrics.
      additionalProperties: false
      required:
        - publisher_id
        - publisher_name
        - publisher_slug
        - total_live_pages
        - pages_with_citations
      properties:
        publisher_id:
          type: string
          format: uuid
        publisher_name:
          type: string
        publisher_slug:
          type: string
        total_live_pages:
          type: integer
          format: int64
        earliest_publish_at:
          type: string
          format: date-time
        first_citation_at:
          type: string
          format: date-time
        pages_with_citations:
          type: integer
          format: int64
        avg_days_to_first_citation:
          type: number
    ContentVerificationVelocityResponse:
      type: object
      description: Org-level publish-to-citation velocity metrics with a per-publisher breakdown.
      additionalProperties: false
      required:
        - pages_with_citations
        - total_live_pages
        - destinations
      properties:
        earliest_publish_at:
          type: string
          format: date-time
        first_citation_at:
          type: string
          format: date-time
        pages_with_citations:
          type: integer
          format: int64
        avg_days_to_first_citation:
          type: number
        total_live_pages:
          type: integer
          format: int64
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/VelocityDestinationSummaryResponse"
    ContentCitationDateRange:
      type: object
      description: The requested date window, echoed back (null bounds mean unbounded).
      additionalProperties: false
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          nullable: true
          description: Inclusive start date (YYYY-MM-DD), or null.
        end_date:
          type: string
          nullable: true
          description: Inclusive end date (YYYY-MM-DD), or null.
    ContentCitationSummary:
      type: object
      description: Pooled citation metrics across all of a content item's destinations.
      additionalProperties: false
      required:
        - total_citations
        - avg_sov
        - mention_rate
        - common_sentiment
        - prompt_run_count
      properties:
        total_citations:
          type: integer
          description: >-
            Citation **instances** across every destination of this content item in the window —
            an answer citing it three times contributes three.
        avg_sov:
          type: number
          description: >-
            Your share of every brand mention, restricted to the answers that cited this content —
            a **0–1 fraction**. `0` when no brand mentions were recorded.
        mention_rate:
          type: number
          description: >-
            Of the answers that **cited this content**, the share that named your brand — a **0–1
            fraction**. Note the denominator: this is a conditional mention rate over citing
            answers, not the org-wide `mention_rate` of `GET /org/analytics/*`, which divides by
            all answered runs.
        common_sentiment:
          type: string
          description: The most common sentiment across citing runs (e.g. `positive`, `neutral`, `negative`).
        prompt_run_count:
          type: integer
          description: >-
            Prompt-run answers in the window **across the whole organization**, not just those
            citing this content. It is the shared base behind the summary and trend blocks, not
            the denominator of the ratios above.
    ContentCitationMetrics:
      type: object
      description: Citation metrics for one destination.
      additionalProperties: false
      required:
        - total_citations
        - avg_sov
        - mention_rate
        - common_sentiment
      properties:
        total_citations:
          type: integer
          description: >-
            Citation **instances** for this destination in the window.
        avg_sov:
          type: number
          description: >-
            Your share of every brand mention, restricted to the answers that cited this
            destination's URL — a **0–1 fraction**.
        mention_rate:
          type: number
          description: >-
            Of the answers that cited this destination's URL, the share that named your brand — a
            **0–1 fraction**. A conditional mention rate over citing answers, not the org-wide
            one.
        common_sentiment:
          type: string
          description: >-
            The most common sentiment across those citing answers' mentions of your brand.
    ContentCitationDestination:
      type: object
      description: One live publish destination and its citation metrics.
      additionalProperties: false
      required:
        - publish_record_id
        - publisher_name
        - publisher_slug
        - state
        - external_url
        - first_published_at
        - first_citation_at
        - days_to_first_citation
        - metrics
      properties:
        publish_record_id:
          type: string
          format: uuid
        publisher_name:
          type: string
        publisher_slug:
          type: string
        state:
          type: string
        external_url:
          type: string
        first_published_at:
          type: string
          format: date-time
          nullable: true
        first_citation_at:
          type: string
          format: date-time
          nullable: true
        days_to_first_citation:
          type: integer
          nullable: true
        metrics:
          $ref: "#/components/schemas/ContentCitationMetrics"
    ContentCitationTrendByDestination:
      type: object
      description: One destination's slice of a trend day.
      additionalProperties: false
      required:
        - times_cited
        - prompt_runs
      properties:
        times_cited:
          type: integer
        prompt_runs:
          type: integer
    ContentCitationTrendPoint:
      type: object
      description: One day in the citation trend series.
      additionalProperties: false
      required:
        - date
        - total_citations
        - total_prompt_runs
        - by_destination
      properties:
        date:
          type: string
          description: The day (YYYY-MM-DD).
        total_citations:
          type: integer
        total_prompt_runs:
          type: integer
        by_destination:
          type: object
          description: Per-destination counts for the day, keyed by publish record id.
          additionalProperties:
            $ref: "#/components/schemas/ContentCitationTrendByDestination"
    ContentCitationDetailsResponse:
      type: object
      description: A content item's citation detail — pooled summary, per-destination metrics, and a daily trend.
      additionalProperties: false
      required:
        - content_id
        - title
        - date_range
        - models
        - earliest_publish_at
        - first_citation_at
        - days_to_first_citation
        - summary
        - destinations
        - trend
      properties:
        content_id:
          type: string
          format: uuid
        title:
          type: string
        date_range:
          $ref: "#/components/schemas/ContentCitationDateRange"
        models:
          type: array
          description: The AI models the results are filtered to (empty means all).
          items:
            type: string
        earliest_publish_at:
          type: string
          format: date-time
          nullable: true
        first_citation_at:
          type: string
          format: date-time
          nullable: true
        days_to_first_citation:
          type: integer
          nullable: true
        summary:
          $ref: "#/components/schemas/ContentCitationSummary"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/ContentCitationDestination"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/ContentCitationTrendPoint"
    ContentCitationPromptRow:
      type: object
      description: >-
        One prompt/model row whose runs cite the content. The `*_lift` fields are this
        row's metric minus the baseline (same prompt/model runs citing none of the
        content's URLs); they are null when there is no baseline.
      additionalProperties: false
      required:
        - prompt
        - prompt_funnel_stage
        - model
        - source_id
        - mention_rate
        - avg_sov
        - common_sentiment
        - eval_count
        - citation_count
        - mention_rate_lift
        - avg_sov_lift
      properties:
        prompt:
          type: string
        prompt_funnel_stage:
          type: string
          description: The prompt's funnel stage (e.g. `awareness`, `consideration`, `evaluation`, `decision`).
        model:
          type: string
        source_id:
          type: string
        mention_rate:
          type: number
          description: >-
            Of this prompt/model's non-empty answers in the window, the share that named your
            brand — a **0–1 fraction**, unlike `citation_rate` on the same row. `0` when there
            were no answered runs.
        avg_sov:
          type: number
          description: >-
            Your share of every brand mention on this prompt/model — mention instances for you
            over mention instances for all brands. A **0–1 fraction**, unlike `citation_rate` on
            the same row. `0` when no brand mentions were recorded.
        common_sentiment:
          type: string
          description: >-
            The most common sentiment across this prompt/model's mentions of your brand —
            `positive`, `neutral`, or `negative`. Ties break toward `positive`, then `negative`;
            `neutral` when your brand was never mentioned.
        eval_count:
          type: integer
          description: >-
            Non-empty answers for this prompt/model in the window. The denominator of
            `mention_rate` and of `citation_rate`.
        citation_count:
          type: integer
          description: >-
            Answers on this prompt/model that cited one of the content's live external URLs.
            The numerator of `citation_rate`.
        citation_rate:
          type: number
          description: >-
            `citation_count / eval_count * 100` — of this prompt/model's answered runs, the
            share that cited one of the content's live external URLs, as a percentage on a
            **0–100** scale (not a 0–1 fraction). The denominator is every answered run, not
            only the answers that carried a citation, so this is a share of all answers rather
            than the Citation Coverage of `GET /org/analytics/*`. Both operands ship on the
            row. Absent when `eval_count` was zero.
        mention_rate_lift:
          type: number
          nullable: true
          description: Mention-rate lift versus baseline; null when there is no baseline.
        avg_sov_lift:
          type: number
          nullable: true
          description: Average-SOV lift versus baseline; null when there is no baseline.
    ContentCitationPromptsResponse:
      type: object
      description: The prompt/model rows whose runs cite a content item's live external URLs.
      additionalProperties: false
      required:
        - content_id
        - date_range
        - models
        - external_urls
        - prompts
      properties:
        content_id:
          type: string
          format: uuid
        date_range:
          $ref: "#/components/schemas/ContentCitationDateRange"
        models:
