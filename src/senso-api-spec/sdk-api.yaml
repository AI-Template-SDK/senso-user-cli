      required:
        - content_id
        - version_id
        - version_num
        - raw_markdown
        - seo_title
        - url_slug
        - meta_data
        - json_ld
        - editorial_status
        - publish_status
      properties:
        content_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_num:
          type: integer
          format: int64
        raw_markdown:
          type: string
        seo_title:
          type: string
        url_slug:
          type: string
        meta_data:
          nullable: true
          description: Opaque SEO metadata generated for the content; `null` when none was produced.
        json_ld:
          nullable: true
          description: Opaque JSON-LD structured data generated for the content; `null` when none was produced.
        editorial_status:
          type: string
          description: The content's editorial state (e.g. `draft`, `published`).
        publish_status:
