          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: Number of rows to skip (default 0). Negative values fall back to 0; not rejected.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: One page of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/api-keys/{keyId}:
    get:
      tags: [API Keys]
      summary: Get an API key
      description: >-
        Returns one of your organization's API keys by id (never its secret value).
      operationId: orgGetAPIKey
      parameters:
        - name: keyId
          in: path
          required: true
          description: The API key's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/api-keys/{keyId}/kb-permissions:
    get:
      tags: [API Keys]
      summary: Get an API key's KB scope
      description: >-
        Returns the knowledge-base folder grants that restrict a key. An empty array
        means the key is unscoped and can query the entire knowledge base. Note an
        unknown or revoked key id also returns an empty array — this endpoint does
        not 404.
      operationId: orgGetAPIKeyKBPermissions
      parameters:
        - name: keyId
          in: path
          required: true
          description: The API key's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The key's KB folder grants (empty if unscoped).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKeyScopeGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Search — /org/search (query the compiled knowledge base)
  # ──────────────────────────────────────────────
  /org/search:
    post:
      tags: [Search]
      summary: Search with a grounded answer
      description: >-
        Runs a retrieval over your compiled knowledge base and returns the matched
        chunks together with an AI-generated answer grounded on them. Every chunk carries
        the `kb_node_id` of its source document, so a cited passage can be opened in full
        with `GET /org/kb/nodes/{kb_node_id}`. Each call consumes search credits.
      operationId: orgSearch
      parameters:
        - $ref: "#/components/parameters/SensoSignals"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              query: What are the current 30-year mortgage rates?
              max_results: 5
              search_type: hybrid
      responses:
        "200":
          description: The matched chunks and the grounded answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/search/context:
    post:
      tags: [Search]
      summary: Retrieve matching chunks (no answer)
      description: >-
        Runs the same retrieval as `POST /org/search` but returns only the matched
        chunks — no AI answer is generated. Use this to build your own prompt context.
        Every chunk carries the `kb_node_id` of its source document, so a passage can be
        opened in full with `GET /org/kb/nodes/{kb_node_id}`. Each call consumes search
        credits.
      operationId: orgSearchContext
      parameters:
        - $ref: "#/components/parameters/SensoSignals"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              query: What are the current 30-year mortgage rates?
              max_results: 5
              search_type: hybrid
      responses:
        "200":
          description: The matched chunks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/search/full:
    post:
      tags: [Search]
      summary: Search with a full-document-grounded answer
      description: >-
        Like `POST /org/search`, but the answer is grounded on the full content of the
        matched documents rather than only the retrieved chunks. Returns the matched
        chunks plus the answer. Every chunk carries the `kb_node_id` of its source
        document, so a cited passage can be opened in full with
        `GET /org/kb/nodes/{kb_node_id}`. Each call consumes search credits.
      operationId: orgSearchFull
      parameters:
        - $ref: "#/components/parameters/SensoSignals"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              query: What are the current 30-year mortgage rates?
              max_results: 5
              search_type: hybrid
      responses:
        "200":
          description: The matched chunks and the full-document-grounded answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/search/content:
    post:
      tags: [Search]
      summary: Find matching content items
      description: >-
        Runs the retrieval and returns only the distinct documents that matched — no
        chunks, no AI answer. Each item carries the document's `kb_node_id` alongside its
        `content_id` and title, so a match can be read, renamed, moved or deleted through
        the `/org/kb/nodes/{kb_node_id}` endpoints without a further lookup. Use this to
        discover which documents are relevant. Each call consumes search credits.
      operationId: orgSearchContent
      parameters:
        - $ref: "#/components/parameters/SensoSignals"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              query: What are the current 30-year mortgage rates?
              max_results: 5
              search_type: hybrid
      responses:
        "200":
          description: The distinct content items that matched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchContentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/search/stream:
    post:
      tags: [Search]
      summary: Stream a grounded answer (SSE)
      description: >-
        Like `POST /org/search`, but streams the result as Server-Sent Events: `token`
        events carry the answer as it is generated, a `sources` event then carries the
        matched chunks — each with the `kb_node_id` of its source document — and a final
        `done` event closes the stream. If answer generation fails to start, an `error`
        event is emitted instead (the HTTP status stays 200 because headers are already
        sent); a provider failure mid-stream ends the stream normally (`sources` +
        `done`) with a truncated answer. Each call consumes search credits.
      operationId: orgSearchStream
      parameters:
        - $ref: "#/components/parameters/SensoSignals"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              query: What are the current 30-year mortgage rates?
              max_results: 5
              search_type: hybrid
      responses:
        "200":
          description: >-
            A `text/event-stream` of SSE events: `token` (`{"token": "..."}`), then
            `sources` (`{"results": [...], "total_results": N, "max_results": N,
            "search_type": "..."}`, where each entry of `results` is a
            `SearchResultChunk`), then `done` (`{}`); or `error`
            (`{"error": "..."}`) on a post-open failure.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────────
  # Gaps — /org/gaps (what the knowledge base could not back up)
  # ──────────────────────────────────────────────
  /org/gaps:
    get:
      tags: [Gaps]
      summary: List gaps
      description: >-
        Returns a page of your organization's gap queue, the same queue the Senso app
        shows as the Gap Report. With no `statuses` filter only `open`, `reopened` and
        `addressed` gaps are returned, so an API search gap seen only once (`weak`) does
        not appear until you ask for it with `statuses=weak`.


        Repeatable filters are sent as repeated query parameters
        (`?statuses=weak&statuses=open`). Values within one filter are ORed; different
        filters are ANDed.
      operationId: orgListGaps
      parameters:
        - name: statuses
          in: query
          description: >-
            Restrict to these statuses. Defaults to `open`, `reopened` and `addressed`
            when omitted.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GapStatus"
        - name: problems
          in: query
          description: >-
            Restrict to these problems. An unrecognized value is rejected with 400.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GapProblem"
        - name: surfaces
          in: query
          description: Restrict to gaps seen on any of these surfaces.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GapSurface"
        - name: origin_kinds
          in: query
          description: >-
            Restrict to gaps with any of these origins. Use `api_unanswered_question` for
            searches through the org API, the MCP server or the CLI that found nothing.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GapOriginKind"
        - name: kinds
          in: query
          description: Restrict to these kinds.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GapKind"
        - name: tag_ids
          in: query
          description: >-
            Restrict to gaps carrying any of these tags. Values that are not UUIDs are
            ignored.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: search
          in: query
          description: Case-insensitive substring match on the gap text (`claim_text`).
          schema:
            type: string
        - name: sort
          in: query
          description: >-
            `severity` (the default) puts conflicts above missing context, then wider
            spread, then recency. `recent` orders by `last_seen_at`, newest first.
            `demand` orders by `asker_count`, then `occurrence_count`, then recency.
          schema:
            type: string
            enum: [severity, recent, demand]
            default: severity
        - name: limit
          in: query
          description: Page size, 1–100 (default 50). A value outside that range is treated as 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of gaps to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of the gap queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapListResponse"
              example:
                gaps:
                  - gap_id: 5b0e3a4c-2f1d-4c6e-9a8b-7d3e2f1a0b9c
                    kind: missing
                    problem: not_found
                    status: open
                    claim_text: Do you offer an annual plan?
                    occurrence_count: 3
                    asker_count: 0
                    api_occurrence_count: 3
                    surfaces: [api_search]
                    first_seen_at: "2026-09-14T10:00:00Z"
                    last_seen_at: "2026-09-14T12:30:00Z"
                    status_changed_at: "2026-09-14T11:05:00Z"
                    awaiting_update: false
                    tags: []
                    origin:
                      kind: api_unanswered_question
                      surface: api_search
                      subject_id: 0c9d8e7f-6a5b-4c3d-2e1f-0a9b8c7d6e5f
                      surface_counts:
                        search_turn: 0
                        content: 0
                        question_run: 0
                        api_search: 3
                total: 1
                limit: 50
                offset: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/gaps/{gapId}:
    get:
      tags: [Gaps]
      summary: Get a gap
      description: >-
        Returns one gap with up to its 20 most recent sightings, every resolution
        recorded against it (newest first), and the evidence behind it. For an API search
        gap, `lead_evidence` carries the question and the retrieval counts from the most
        recent search that found nothing. The embedded `gap` never carries
        `latest_resolution` and always reports `awaiting_update: false`; read
        `resolutions` instead.
      operationId: orgGetGap
      parameters:
        - $ref: "#/components/parameters/GapID"
      responses:
        "200":
          description: The gap, its sightings, its resolutions and its evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/gaps/{gapId}/resolutions:
    post:
      tags: [Gaps]
      summary: Record a resolution
      description: >-
        Records what was done about a gap and moves its status accordingly.


        - `answered`, `content_added`, `content_updated` → `addressed`. Each requires
        `produced_content_id`.

        - `ruled_kb_correct`, `we_dont_do_this` → `resolved`.

        - `dismissed`, `not_relevant`, `source_irrelevant` → `dismissed`.
        `source_irrelevant` requires `authority_content_id`.

        - `ruled_claim_correct`, `ruled_document` → no status change. The ruling is
        recorded, and an open gap shows `awaiting_update` in the list until a follow-up
        resolution such as `content_updated` moves it. Each requires
        `authority_content_id`.


        A resolution recorded with an API key names no person, so it has no
        `resolved_by_name` or `resolved_by_email`.
      operationId: orgCreateGapResolution
      parameters:
        - $ref: "#/components/parameters/GapID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGapResolutionRequest"
            example:
              resolution_type: content_added
              produced_content_id: 8f14e45f-ceea-467a-9c2b-1b2f8d3a1c7e
              notes: Added the annual plan to the pricing page.
      responses:
        "201":
          description: The recorded resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapResolution"
        "400":
          description: >-
            The body was malformed, `resolution_type` is missing or unknown, a content id
            the type requires is missing, or the gap does not exist in your organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/gaps/{gapId}/resolutions/{resolutionId}:
    delete:
      tags: [Gaps]
      summary: Undo a resolution
      description: >-
        Retracts a resolution and recomputes the gap's status from the resolutions that
        remain: the newest remaining resolution that implies a status decides it, and if
        none does, the gap returns to `open`.
      operationId: orgDeleteGapResolution
      parameters:
        - $ref: "#/components/parameters/GapID"
        - name: resolutionId
          in: path
          required: true
          description: The resolution's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The resolution was retracted. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            The gap or the resolution does not exist in your organization, or the
            resolution belongs to a different gap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ──────────────────────────────────────────────
  # Evals — /org/evals
  # ──────────────────────────────────────────────
  /org/evals/text:
    post:
      tags: [Evals]
      summary: Evaluate text you supply
      description: >-
        Judges arbitrary text with no setup — paste a draft, an answer, or a page and
        have every factual claim it makes about your brand checked against your
        knowledge base (the default `kb_accuracy` evaluator), or its writing graded
        against your brand kit (`brand_alignment`). The text is stored with the run
        and returned in the run detail. By default the run is queued and a `202`
        returns the run to poll at `GET /org/evals/runs/{runId}`. With `wait: true`
        the connection is held and the finished run is returned as a `200`; if the
        run has not finished within the server's wait ceiling (about a minute), the
        response degrades to the `202` handle and the run keeps executing. Send an
        `idempotency_key` to make a retried trigger return the original run instead
        of judging the same text twice.
      operationId: orgEvalText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalTextRequest"
            example:
              title: Homepage hero copy
              text: Senso compiles an enterprise's knowledge into verified ground truth for AI agents.
              evaluator: kb_accuracy
              label: homepage-draft-3
      responses:
        "200":
          description: >-
            The run finished within the wait ceiling (`wait: true` only) — the full
            run, including claims, verdicts, and the judge's audit trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunDetail"
        "202":
          description: >-
            The run to poll at `GET /org/evals/runs/{runId}`. Normally a freshly queued
            run. On an `idempotency_key` match it is the original run in whatever
            state it had reached; when `wait: true` timed out it is the run as queued —
            poll for its current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunSummary"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/evals/content:
    post:
      tags: [Evals]
      summary: Evaluate a saved content item
      description: >-
        Judges the latest saved version of one content item — a knowledge-base
        document or a generated article — identified by its content id. Only items
        whose latest version is raw text can be judged: file and web items (an
        uploaded PDF, a crawled page) store a pointer rather than text of their own
        and are a `422`, as is an item with no saved version. An id that is not one
        of your organization's items is a `404`. Evaluator selection, `wait`, and
        `idempotency_key` behave exactly as for `POST /org/evals/text`.
      operationId: orgEvalContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalContentRequest"
            example:
              content_id: 123e4567-e89b-12d3-a456-426614174000
              evaluator: kb_accuracy
              wait: true
      responses:
        "200":
          description: >-
            The run finished within the wait ceiling (`wait: true` only) — the full
            run, including claims, verdicts, and the judge's audit trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunDetail"
        "202":
          description: >-
            The run to poll at `GET /org/evals/runs/{runId}`. Normally a freshly queued
            run. On an `idempotency_key` match it is the original run in whatever
            state it had reached; when `wait: true` timed out it is the run as queued —
            poll for its current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunSummary"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/evals/runs:
    get:
      tags: [Evals]
      summary: List eval runs
      description: >-
        Returns one page of your organization's eval runs, newest first, with each
        run's status and headline metrics. The bulky payloads — the subject
        snapshot, claims, searches, and evidence — are left to the single-run read.
        Filter by creation time, evaluator, and subject type.
      operationId: orgListEvalRuns
      parameters:
        - $ref: "#/components/parameters/EvalFrom"
        - $ref: "#/components/parameters/EvalTo"
        - $ref: "#/components/parameters/EvalEvaluatorFilter"
        - $ref: "#/components/parameters/EvalSubjectTypeFilter"
        - $ref: "#/components/parameters/EvalLimit"
        - $ref: "#/components/parameters/EvalOffset"
      responses:
        "200":
          description: One page of eval runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/evals/runs/{runId}:
    get:
      tags: [Evals]
      summary: Get an eval run
      description: >-
        Returns everything about one run: its status and metrics, the subject as it
        was judged, every claim with its verdict and evidence, and the judge's audit
        trail — every search it ran and every passage it read — so a verdict can be
        checked rather than trusted. This is the poll target for a queued run; the
        run is finished when `status` is `completed`, `gated`, or `failed`.
      operationId: orgGetEvalRun
      parameters:
        - $ref: "#/components/parameters/EvalRunID"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/evals/claims:
    get:
      tags: [Evals]
      summary: List judged claims
      description: >-
        Returns one page of judged claims across your organization's runs, newest
        first — the gap report. Each claim carries its verdict, its classification
        bucket, and the evidence behind it. Filter by creation time, evaluator,
        subject type, or a single run.
      operationId: orgListEvalClaims
      parameters:
        - $ref: "#/components/parameters/EvalFrom"
        - $ref: "#/components/parameters/EvalTo"
        - $ref: "#/components/parameters/EvalEvaluatorFilter"
        - $ref: "#/components/parameters/EvalSubjectTypeFilter"
        - $ref: "#/components/parameters/EvalClaimRunIDFilter"
        - $ref: "#/components/parameters/EvalLimit"
        - $ref: "#/components/parameters/EvalOffset"
      responses:
        "200":
          description: One page of judged claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalClaimListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/evals/evaluators:
    get:
      tags: [Evals]
      summary: List available evaluators
      description: >-
        Returns the evaluators your organization can run, each with the subject types
        it accepts and descriptors for the metrics it reports, so results can be
        rendered without knowing an evaluator in advance.
      operationId: orgListEvaluators
      responses:
        "200":
          description: The available evaluators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluatorListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Knowledge Base — /org/kb
  # ──────────────────────────────────────────────
  /org/kb/stats:
    get:
      tags: [Knowledge Base]
      summary: Get knowledge base counts
      description: Returns how many documents and folders your organization's knowledge base contains.
      operationId: orgKBGetStats
      responses:
        "200":
          description: Knowledge base counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/kb/root:
    get:
      tags: [Knowledge Base]
      summary: Get the root folder
      description: >-
        Returns your organization's root knowledge-base folder (its `parent_id` is null).
        The root is a folder, so its response never includes `content`/`content_id`.
      operationId: orgKBGetRoot
      responses:
        "200":
          description: The root node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org/kb/sync-status:
    get:
      tags: [Knowledge Base]
      summary: Get structural sync status
      description: >-
        Reports whether queued structural changes — moves and deletes — are still
        propagating. Both go through a queue before taking full effect, and a move
        changes who can reach a document: access is derived from the folder a node sits
        in, so after moving a document into a folder, the people who can read that
        folder cannot query it until this reports done. Deletes settle the same way.


        This is not an ingestion signal, and it is not scoped to one document. To learn
        whether a newly ingested document is queryable, poll that document's
        `GET /org/kb/nodes/{id}` and read `content.processing_status`.
      operationId: orgKBGetSyncStatus
      responses:
        "200":
          description: The sync status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBSyncStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/kb/my-files:
    get:
      tags: [Knowledge Base]
      summary: List accessible top-level nodes
      description: >-
        Returns the top-level knowledge-base nodes the caller can access, one page at a
        time.
      operationId: orgKBListMyFiles
      parameters:
        - $ref: "#/components/parameters/KBListLimit"
        - $ref: "#/components/parameters/KBListOffset"
        - $ref: "#/components/parameters/KBTypeFilter"
        - $ref: "#/components/parameters/KBStatusFilter"
        - $ref: "#/components/parameters/KBRoleFilter"
        - $ref: "#/components/parameters/KBSortBy"
        - $ref: "#/components/parameters/KBSortOrder"
        - $ref: "#/components/parameters/KBTagIDsFilter"
      responses:
        "200":
          description: One page of accessible nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/kb/find:
    get:
      tags: [Knowledge Base]
      summary: Search nodes by name
      description: >-
        Searches the knowledge base by node name and returns the matching nodes the
        caller can access. An empty `q` returns an empty list.
      operationId: orgKBFind
      parameters:
        - name: q
          in: query
          description: The search text (matched against node names). Empty returns no results.
          schema:
            type: string
        - $ref: "#/components/parameters/KBListLimit"
        - $ref: "#/components/parameters/KBListOffset"
        - $ref: "#/components/parameters/KBTypeFilter"
        - $ref: "#/components/parameters/KBStatusFilter"
        - $ref: "#/components/parameters/KBRoleFilter"
        - $ref: "#/components/parameters/KBSortBy"
        - $ref: "#/components/parameters/KBSortOrder"
        - $ref: "#/components/parameters/KBTagIDsFilter"
      responses:
        "200":
          description: The matching nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/kb/folders:
    post:
      tags: [Knowledge Base]
      summary: Create a folder
      description: >-
        Creates a folder in the knowledge base. Omit `parent_id` (or set it to null) to
        create the folder under the root.
      operationId: orgKBCreateFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
            example:
              name: Mortgage rates
              parent_id: 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
      responses:
        "201":
          description: The created folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/raw:
    post:
      tags: [Knowledge Base]
      summary: Create a raw-text document
      description: >-
        Creates a document from raw text (or markdown) in the knowledge base and starts
        ingesting it. Omit `kb_folder_node_id` to create it under the root. Returns `202`
        while ingestion runs asynchronously — poll the node or `GET /org/kb/sync-status`
        for completion.
      operationId: orgKBCreateRawContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRawContentRequest"
            example:
              title: Current mortgage rates
              text: "The current 30-year fixed rate is 6.5%."
              kb_folder_node_id: 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
      responses:
        "202":
          description: The document was created and is being ingested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/kb/upload:
    post:
      tags: [Knowledge Base]
      summary: Upload files
      description: >-
        Registers up to 10 files for ingestion and returns a presigned upload URL per
        accepted file (`status: upload_pending`) — PUT the file bytes to that URL to start
        ingestion. Files that conflict, duplicate, or fail validation come back with a
        per-file status instead. Omit `kb_folder_node_id` to create under the root. When
        no file is accepted the whole response is returned with `422`.
      operationId: orgKBUploadFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionUploadRequest"
            example:
              kb_folder_node_id: 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
              files:
                - filename: rates.pdf
                  file_size_bytes: 240128
                  content_type: application/pdf
                  content_hash_md5: 9e107d9d372bb6826bd81d3542a419d6
      responses:
        "200":
          description: Per-file ingestion registration results (at least one file accepted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: No file was accepted; the same result body reports why per file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionUploadResponse"

  /org/kb/nodes/bulk-delete:
    post:
      tags: [Knowledge Base]
      summary: Delete multiple nodes
      description: >-
        Deletes up to 100 nodes at once. Folders take their whole subtree with them. The
        batch is all-or-nothing — if any node is missing, not permitted, a root, or still
        ingesting, nothing is deleted. A `204` means every listed node is gone.
      operationId: orgKBBulkDeleteNodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteKBNodesRequest"
            example:
              node_ids:
                - 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
                - 7b2c1d4e-9a3f-4c8d-8e21-5f6a7b8c9d01
      responses:
        "204":
          description: Every listed node (and any subtree) was deleted. No content.
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/kb/nodes/{id}:
    get:
      tags: [Knowledge Base]
      summary: Get a node
      description: >-
        Returns one knowledge-base node by id, including the caller's `effective_role`
        and (for document nodes) its content metadata.
      operationId: orgKBGetNode
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Knowledge Base]
      summary: Delete a node
      description: >-
        Deletes a knowledge-base node. Deleting a folder removes its whole subtree. The
        root folder cannot be deleted. A document that is still ingesting cannot be
        deleted until it finishes (`409`).
      operationId: orgKBDeleteNode
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The node (and any subtree) was deleted. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/kb/nodes/{id}/rename:
    patch:
      tags: [Knowledge Base]
      summary: Rename a node
      description: Changes a knowledge-base node's name.
      operationId: orgKBRenameNode
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameKBNodeRequest"
            example:
              name: Q3 mortgage rates
      responses:
        "200":
          description: The renamed node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/move:
    patch:
      tags: [Knowledge Base]
      summary: Move a node
      description: >-
        Moves a knowledge-base node under a new parent folder. The root cannot be moved,
        and a folder cannot be moved into its own subtree.
      operationId: orgKBMoveNode
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveKBNodeRequest"
            example:
              new_parent_id: 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
      responses:
        "200":
          description: The moved node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/raw:
    put:
      tags: [Knowledge Base]
      summary: Replace a document's raw text
      description: >-
        Replaces a raw-text document's title, summary, and text with a new version, and
        re-ingests it. `title` and `text` are both required. Supply `tag_ids` to replace
        the document's tags in the same call.
      operationId: orgKBUpdateRawContent
      parameters:
        - name: id
          in: path
          required: true
          description: The document node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRawContentRequest"
            example:
              title: Current mortgage rates
              text: "The current 30-year fixed rate is 6.4%."
      responses:
        "200":
          description: The updated document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      tags: [Knowledge Base]
      summary: Update a document's raw text
      description: >-
        Partially updates a raw-text document — supply any of `title`, `summary`, `text`
        (at least one) — and re-ingests it. Supply `tag_ids` alongside them to replace the
        document's tags in the same call.
      operationId: orgKBPatchRawContent
      parameters:
        - name: id
          in: path
          required: true
          description: The document node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRawContentRequest"
            example:
              text: "The current 30-year fixed rate is 6.35%."
      responses:
        "200":
          description: The updated document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/kb/nodes/{id}/file:
    put:
      tags: [Knowledge Base]
      summary: Replace a document's file
      description: >-
        Replaces a file-backed document with a new file and re-ingests it. Returns the
        per-file registration result — PUT the file bytes to the returned `upload_url` to
        start ingestion. Markdown content must use the raw-text endpoint instead.
      operationId: orgKBUpdateFile
      parameters:
        - name: id
          in: path
          required: true
          description: The document node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionUpdateRequest"
            example:
              file:
                filename: rates-v2.pdf
                file_size_bytes: 251904
                content_type: application/pdf
                content_hash_md5: 3b5d5c3712955042212316173ccf37be
      responses:
        "200":
          description: The file registration result (PUT bytes to `upload_url`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionUploadResultItem"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/kb/nodes/{id}/children:
    get:
      tags: [Knowledge Base]
      summary: List a folder's children
      description: Returns the direct children of a folder node the caller can access, one page at a time.
      operationId: orgKBListChildren
      parameters:
        - name: id
          in: path
          required: true
          description: The folder node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/KBListLimit"
        - $ref: "#/components/parameters/KBListOffset"
        - $ref: "#/components/parameters/KBTypeFilter"
        - $ref: "#/components/parameters/KBStatusFilter"
        - $ref: "#/components/parameters/KBRoleFilter"
        - $ref: "#/components/parameters/KBSortBy"
        - $ref: "#/components/parameters/KBSortOrder"
        - $ref: "#/components/parameters/KBTagIDsFilter"
      responses:
        "200":
          description: One page of children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/ancestors:
    get:
      tags: [Knowledge Base]
      summary: Get a node's ancestors
      description: Returns the breadcrumb path from the root to the node (the node's ancestor folders).
      operationId: orgKBGetAncestors
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The node's ancestors, root first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeAncestorsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/tags:
    get:
      tags: [Knowledge Base]
      summary: List a node's tags
      description: Returns the tags attached to a knowledge-base node. Folders carry no tags and return an empty list.
      operationId: orgKBGetNodeTags
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The node's tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Knowledge Base]
      summary: Replace a node's tags
      description: >-
        Replaces a document node's entire tag set. Identify tags by `tag_ids`,
        `tag_names`, or both; unknown names are created in your organization. Tags apply to
        document nodes only — a folder returns 400. Returns the resulting tag set.
      operationId: orgKBSetNodeTags
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetResourceTagsRequest"
            example:
              tag_names:
                - mortgages
                - home-loans
      responses:
        "200":
          description: The node's tags after the replacement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Knowledge Base]
      summary: Attach a tag to a node (by id or name)
      description: >-
        Attaches a single tag to a document node. Provide either `tag_id` (an existing
        tag — returns 204) or `tag_name` (created in your organization if missing —
        returns 201 with the tag); if both are supplied, `tag_id` takes precedence and
        `tag_name` is ignored. Tags apply to document nodes only — a folder returns
        400.
      operationId: orgKBAttachNodeTag
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachResourceTagRequest"
            example:
              tag_name: mortgages
      responses:
        "201":
          description: The tag was attached by name (created if it did not exist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "204":
          description: The tag was attached by id. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Knowledge Base]
      summary: Detach a tag from a node (by name)
      description: >-
        Removes the named tag from a document node. Idempotent — returns 204 even if the
        tag was not attached.
      operationId: orgKBDetachNodeTagByName
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          required: true
          description: The tag name to detach.
          schema:
            type: string
      responses:
        "204":
          description: The tag is no longer attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/tags/{tagId}:
    post:
      tags: [Knowledge Base]
      summary: Attach a tag to a node (by id)
      description: Attaches an existing tag to a document node by id. Tags apply to document nodes only — a folder returns 400.
      operationId: orgKBAttachNodeTagByID
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tag was attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Knowledge Base]
      summary: Detach a tag from a node (by id)
      description: Removes a tag from a document node by id.
      operationId: orgKBRemoveNodeTag
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tag is no longer attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/download-url:
    get:
      tags: [Knowledge Base]
      summary: Get a file download URL
      description: >-
        Returns short-lived presigned URLs for the file backing a document node —
        one for inline viewing and one that forces a download — plus the file's
        name, type, and size. Pass `?version=<n>` to target a specific version.
      operationId: orgKBGetNodeDownloadURL
      parameters:
        - name: id
          in: path
          required: true
          description: The document node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: false
          description: Download a specific version number instead of the latest.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Presigned download URLs for the node's file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDownloadURLResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/permissions:
    get:
      tags: [Knowledge Base]
      summary: List a node's access grants
      description: >-
        Returns the access grants on a node — who (user or group) holds what role. Group
        grants the caller cannot see are omitted.
      operationId: orgKBListNodePermissions
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The node's visible access grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeGrantListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Knowledge Base]
      summary: Grant access to a node
      description: >-
        Grants a user or group `viewer` or `editor` access to a knowledge base
        node. Use `PATCH` to change an existing grant's role.
      operationId: orgKBGrantNodePermission
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPermissionRequest"
            example:
              grantee_type: user
              grantee_id: 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
              role: viewer
      responses:
        "201":
          description: The created access grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBNodeGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /org/kb/nodes/{id}/permissions/{permissionId}:
    patch:
      tags: [Knowledge Base]
      summary: Change a grant's role
      description: >-
        Changes an existing grant's role to `viewer` or `editor`. You cannot modify your
        own grant.
      operationId: orgKBUpdateNodePermission
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - name: permissionId
          in: path
          required: true
          description: The grant's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionRequest"
            example:
              role: editor
      responses:
        "200":
          description: The grant's role was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Knowledge Base]
      summary: Revoke a grant
      description: Revokes an access grant. You cannot revoke your own grant.
      operationId: orgKBRevokeNodePermission
      parameters:
        - name: id
          in: path
          required: true
          description: The node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - name: permissionId
          in: path
          required: true
          description: The grant's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The grant was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/kb/nodes/{id}/content:
    get:
      tags: [Knowledge Base]
      summary: Get a document's content
      description: >-
        Returns the full content of a document node, including its body text (for raw and
        web documents), editorial and processing status, tags, and version provenance.
        Pass `?version=<n>` to fetch a specific version instead of the latest.
      operationId: orgKBGetContent
      parameters:
        - name: id
          in: path
          required: true
          description: The document node's `kb_node_id`.
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: false
          description: Fetch a specific version number instead of the latest.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The document's content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Content — /org/generated-content, /org/content
  # ──────────────────────────────────────────────
  /org/generated-content/{id}:
    get:
      tags: [Content]
      summary: Get a generated content item
      description: >-
        Returns a single generated content item — its current version metadata,
        the prompt it answers, and (when available) the full generated text.
        Knowledge-base content is not readable here and returns `400` — use the KB
        node endpoints. Requires the GEO product.
      operationId: orgGetGeneratedContent
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The generated content item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContentDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Content items + tags — /org/content/{id}
  # ──────────────────────────────────────────────
  /org/content/{id}:
    get:
      tags: [Content]
      summary: Get a content item
      description: >-
        Returns one content item and its current version's full body and provenance.
        This endpoint serves non-knowledge-base content only — knowledge-base content
        must be read through the KB node endpoints (`GET /org/kb/nodes/{id}/content`)
        and returns `400` here. Requires the GEO product.
      operationId: orgGetContent
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The content item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Content]
      summary: Delete a content item
      description: >-
        Deletes a content item. Content published to external destinations is removed
        from those destinations first; if that removal fails, the item is not deleted
        (`502`). Content still being ingested cannot be deleted until it finishes
        (`409`). Knowledge-base content must be deleted through the KB node endpoints
        and returns `400` here. Requires the GEO product.
      operationId: orgDeleteContent
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The content item was deleted. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"

  /org/content/{id}/versions:
    get:
      tags: [Content]
      summary: List a content item's versions
      description: >-
        Returns the version history of a content item, newest first, flagging which
        version is current. Requires the GEO product.
      operationId: orgListContentVersions
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The content item's version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/{id}/tags:
    get:
      tags: [Content]
      summary: List a content item's tags
      description: Returns the org tags attached to a content item.
      operationId: orgListContentTags
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The content item's tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Content]
      summary: Replace a content item's tags
      description: >-
        Replaces a content item's entire tag set. Identify tags by `tag_ids`,
        `tag_names`, or both; unknown names are created in your organization. Returns
        the resulting tag set.
      operationId: orgSetContentTags
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetResourceTagsRequest"
            example:
              tag_names:
                - mortgages
                - home-loans
      responses:
        "200":
          description: The content item's tags after the replacement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Content]
      summary: Attach a tag to a content item (by id or name)
      description: >-
        Attaches a single tag to a content item. Provide either `tag_id` (an existing
        tag) or `tag_name` (created in your organization if missing). Returns no
        content either way.
      operationId: orgAttachContentTag
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachResourceTagRequest"
            example:
              tag_name: mortgages
      responses:
        "204":
          description: The tag was attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Content]
      summary: Detach a tag from a content item (by name)
      description: >-
        Removes the named tag from a content item. Idempotent — returns 204 even if the
        tag was not attached.
      operationId: orgDetachContentTagByName
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          required: true
          description: The tag name to detach.
          schema:
            type: string
      responses:
        "204":
          description: The tag is no longer attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/{id}/tags/{tagId}:
    post:
      tags: [Content]
      summary: Attach a tag to a content item (by id)
      description: Attaches an existing tag to a content item by id.
      operationId: orgAttachContentTagByID
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tag was attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Content]
      summary: Detach a tag from a content item (by id)
      description: Removes a tag from a content item by id.
      operationId: orgRemoveContentTag
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          description: The tag's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tag is no longer attached. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/{id}/owners:
    get:
      tags: [Content]
      summary: List a content item's owners
      description: Returns the users who own a content item. Requires the GEO product.
      operationId: orgListContentOwners
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The content item's owners.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentOwnerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Content]
      summary: Replace a content item's owners
      description: >-
        Replaces a content item's owner set with the given users. Every user id must
        belong to your organization. Returns the resulting owner set. Requires the GEO
        product.
      operationId: orgReplaceContentOwners
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentOwnersRequest"
            example:
              user_ids:
                - 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
                - 7b2c1d4e-9a3f-4c8d-8e21-5f6a7b8c9d01
      responses:
        "200":
          description: The content item's owners after the replacement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentOwnerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/{id}/owners/{userId}:
    delete:
      tags: [Content]
      summary: Remove a content item's owner
      description: Removes a single owner from a content item. Requires the GEO product.
      operationId: orgDeleteContentOwner
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          description: The owner's user id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The user is no longer an owner. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/{id}/cta:
    get:
      tags: [Content]
      summary: Get a content item's CTA selection
      description: >-
        Returns which call-to-action (CTA) template a content-engine content item carries
        when it is published: the org's default template (`default`), a specific template
        (`template`), or no CTA (`none`). An item whose selection has never been set reports
        `default` with no timestamps. `template` holds the template the selection resolves
        to — omitted when the selection is `none`, or when it is `default` and the org has
        no default template. Only content-engine content has a CTA selection; other content
        items return `404`. Requires the GEO product.
      operationId: orgGetContentCTASelection
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The content item's CTA selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentCTASelectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [Content]
      summary: Set a content item's CTA selection
      description: >-
        Sets the call-to-action (CTA) a content-engine content item carries when it is
        published. `selection_type` is `default` to inherit the org's default template,
        `template` to pin a specific template (`cta_id` required), or `none` to publish
        without a CTA; `cta_id` must be omitted for `default` and `none`. Pinning the
        template that is currently the org default is stored as `default`. The selection is
        a full replacement, and the response is the resulting selection with the template it
        resolves to. If the item is already live on a `citeables` destination, the live
        page's CTA is updated to match; a failure to update a live page does not fail the
        request. Only
        content-engine content has a CTA selection; other content items return `404`.
        Requires the GEO product.
      operationId: orgSetContentCTASelection
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentCTASelectionRequest"
            example:
              selection_type: template
              cta_id: 9c1e4b7a-2d3f-4e5a-8b6c-7d8e9f0a1b2c
      responses:
        "200":
          description: The content item's CTA selection after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentCTASelectionResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/ctas:
    get:
      tags: [CTA Templates]
      summary: List CTA templates
      description: >-
        Returns every CTA template in your organization, the org default first and the rest
        oldest first, plus the default itself in `default_cta` when one is set. Requires the
        GEO product.
      operationId: orgListCTATemplates
      responses:
        "200":
          description: The organization's CTA templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CTAListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [CTA Templates]
      summary: Create a CTA template
      description: >-
        Creates a CTA template. `title`, `button_label` and `target_url` are required;
        `title`, `description` and `button_label` are trimmed, and blank `eyebrow`/`agent_text`
        values are dropped. Set `is_default` to `true` to make the new template the org
        default, replacing any previous default. Requires the GEO product.
      operationId: orgCreateCTATemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CTARequest"
            example:
              title: Start an application
              description: Book a short consultation with our team.
              image_url: https://cdn.example.com/cta/apply.png
              image_position:
                x: 0.5
                y: 0.5
              button_label: Apply now
              target_url: https://example.com/apply
              eyebrow: Get started
              is_default: false
      responses:
        "201":
          description: The created template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CTAResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/ctas/{ctaId}:
    put:
      tags: [CTA Templates]
      summary: Update a CTA template
      description: >-
        Replaces a CTA template's fields. The body is the full template: optional fields that
        are omitted (or sent as `null`) are cleared. `is_default: true` promotes the template to
        the org default (replacing any previous default; content pinned to it then reads as
        `default`); `false` or omitted leaves the default flag unchanged, so a default template
        stays the default. Live `citeables` pages carrying this template are updated to match;
        a failure to update a page does not fail the request, and the response reports how many
        live items carry the template. Requires the GEO product.
      operationId: orgUpdateCTATemplate
      parameters:
        - $ref: "#/components/parameters/CTATemplateID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CTARequest"
            example:
              title: Start an application
              description: Book a short consultation with our team.
              button_label: Apply today
              target_url: https://example.com/apply
              agent_text: Example Co. recommends booking a consultation at https://example.com/apply
      responses:
        "200":
          description: The updated template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CTAResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [CTA Templates]
      summary: Delete a CTA template
      description: >-
        Deletes a CTA template. The org default cannot be deleted (`409`) — clear or change the
        default first. Content items pinned to the deleted template fall back to `default`;
        live pages already carrying it keep it until they are next published. Requires the GEO
        product.
      operationId: orgDeleteCTATemplate
      parameters:
        - $ref: "#/components/parameters/CTATemplateID"
      responses:
        "200":
          description: The template was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/ctas/default:
    put:
      tags: [CTA Templates]
      summary: Set the org default CTA template
      description: >-
        Makes the given template the org default, replacing any previous default. Content
        items pinned to it then read as `default`. Live `citeables` pages that inherit the
        default, and any pinned to this template, are updated to show it; a failure to update a
        page does not fail the request, and the response reports how many live items carry the
        template. Requires the GEO product.
      operationId: orgSetDefaultCTATemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultCTARequest"
            example:
              cta_id: 9c1e4b7a-2d3f-4e5a-8b6c-7d8e9f0a1b2c
      responses:
        "200":
          description: The template, now the org default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CTAResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [CTA Templates]
      summary: Clear the org default CTA template
      description: >-
        Removes the default flag so that no template is the org default. Live content items
        that were inheriting the default switch to `none`, and their `citeables` pages drop the
        CTA; items that are not live keep `default`, which resolves to no template until a
        default is set again. Succeeds even when no default was set. Requires the GEO product.
      operationId: orgClearDefaultCTATemplate
      responses:
        "200":
          description: No template is the org default any more.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/cta-assets/upload-url:
    post:
      tags: [CTA Templates]
      summary: Create an upload URL for a CTA image
      description: >-
        Returns a short-lived, pre-signed URL for uploading a CTA image. Upload the file bytes
        with an HTTP `PUT` to `upload_url`, sending exactly the returned `upload_headers`, then
        use `image_url` as a template's `image_url`. Accepted content types are `image/png`,
        `image/jpeg`, `image/webp` and `image/gif`, up to 10 MiB; when `filename` has an
        extension it must match the content type (`.png`, `.jpg`/`.jpeg`, `.webp`, `.gif`).
        Returns `503` when image storage is not configured for the deployment. Requires the GEO
        product.
      operationId: orgCreateCTAAssetUploadURL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CTAAssetUploadRequest"
            example:
              filename: hero.png
              content_type: image/png
              file_size_bytes: 245760
      responses:
        "200":
          description: Where and how to upload the image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CTAAssetUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequestBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /org/content/provenance:
    get:
      tags: [Content]
      summary: Audit the provenance of a published URL
      description: >-
        Returns a five-stage provenance audit for one published URL: `ingestion` (how the
        Knowledge Base sources behind the content entered the system), `source` (the exact
        retrieved chunks and formatted model context, hash-validated), `creation` (the
        accepted AI generation attempt, hash-validated), `editing` (the Builder workspace
        version history), and `publication` (every destination record for the published
        content version, with the publishing actor when one can be attributed). Each stage
        reports what can be proven from stored evidence and what evidence is missing, and
        the audit never guesses: absent or ambiguous evidence is reported as such rather
        than filled in. The URL must match a live publish record's recorded URL exactly
        (byte-for-byte after trimming surrounding whitespace); when several live records
        share the URL, the one with the most recent publish/attempt time is audited.
        Requires the GEO product.
      operationId: orgGetContentProvenance
      parameters:
        - name: published_url
          in: query
          required: true
          description: The live published URL to audit, matched exactly against recorded publish records.
          schema:
            type: string
      responses:
        "200":
          description: The provenance audit for the resolved published content version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentProvenanceAuditResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/verification:
    get:
      tags: [Content]
      summary: List content in the verification workflow
      description: >-
        Returns a paginated list of content items in the verification workflow — drafts,
        rejected, and published — with each item's owners, tags, publish destinations,
        and citation metrics. Requires the GEO product.
      operationId: orgListContentVerification
      parameters:
        - name: limit
          in: query
          description: Page size (1–100). Defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Number of items to skip. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          description: Free-text filter on the content title.
          schema:
            type: string
        - name: status
          in: query
          description: >-
            Status filter. `all` (default) returns every status; `review` is an alias for
            `draft`.
          schema:
            type: string
            enum: [all, review, draft, rejected, published]
        - name: substatus
          in: query
          description: Sub-status filter. `pending_draft` requires `status=published`.
          schema:
            type: string
            enum: [pending_draft]
        - name: tag_ids
          in: query
          description: Comma-separated tag ids to filter by.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order.
          schema:
            type: string
            enum: [citation_rate_desc, citation_rate_asc, raw_citations_desc, raw_citations_asc]
      responses:
        "200":
          description: One page of verification items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVerificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/content/verification/counts:
    get:
      tags: [Content]
      summary: Get content verification counts
      description: >-
        Returns content counts by verification status (draft, published, rejected,
        pending-published-draft) plus a per-publisher rollup across all published
        content. Requires the GEO product.
      operationId: orgGetContentVerificationCounts
      responses:
        "200":
          description: The verification counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVerificationCountsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/content/verification/velocity:
    get:
      tags: [Content]
      summary: Get publish-to-citation velocity
      description: >-
        Returns publish-to-citation velocity metrics for all of the org's published
        content, with a per-publisher breakdown. Requires the GEO product.
      operationId: orgGetContentVerificationVelocity
      responses:
        "200":
          description: The velocity metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVerificationVelocityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org/content/{id}/citation-details:
    get:
      tags: [Content]
      summary: Get a content item's citation details
      description: >-
        Returns citation detail for a published content item — a pooled summary,
        per-destination metrics, and a daily trend — over an optional date window and
        model/location filter. Requires the GEO product.
      operationId: orgGetContentCitationDetails
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          description: Inclusive start date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Inclusive end date (YYYY-MM-DD). Must not be before `start_date`.
          schema:
            type: string
            format: date
        - name: models
          in: query
          description: >-
            Comma-separated AI models to filter by. Each value must be one of `gpt-4.1`,
            `chatgpt`, `perplexity`, `aioverview`, `gemini`, `linkup`, `claude-sonnet-4-6`,
            `grok` (or the provider aliases `google_ai_overviews`, `claude`, `gpt`); an
            unknown value returns 400. Omit for all models.
          schema:
            type: string
        - name: locations
          in: query
          description: Comma-separated locations to filter by (org-specific). Omit for all locations.
          schema:
            type: string
      responses:
        "200":
          description: The content item's citation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentCitationDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/{id}/citation-prompts:
    get:
      tags: [Content]
      summary: Get a content item's citation prompts
      description: >-
        Returns the prompt/model rows whose question runs cite at least one of a
        published content item's live external URLs, with mention-rate and average-SOV
        lift versus runs that cite none of those URLs. Requires the GEO product.
      operationId: orgGetContentCitationPrompts
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          description: Inclusive start date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Inclusive end date (YYYY-MM-DD). Must not be before `start_date`.
          schema:
            type: string
            format: date
        - name: models
          in: query
          description: >-
            Comma-separated AI models to filter by. Each value must be one of `gpt-4.1`,
            `chatgpt`, `perplexity`, `aioverview`, `gemini`, `linkup`, `claude-sonnet-4-6`,
            `grok` (or the provider aliases `google_ai_overviews`, `claude`, `gpt`); an
            unknown value returns 400. Omit for all models.
          schema:
            type: string
        - name: locations
          in: query
          description: Comma-separated locations to filter by (org-specific). Omit for all locations.
          schema:
            type: string
        - name: destinations
          in: query
          description: Comma-separated publisher slugs to restrict to. Unknown slugs are ignored.
          schema:
            type: string
      responses:
        "200":
          description: The content item's citation prompts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentCitationPromptsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org/content/{id}/unpublish:
    post:
      tags: [Content]
      summary: Unpublish a content item
      description: >-
        Unpublishes a content item from its external destinations. Provide
        `publish_record_ids` to unpublish only those destinations (returns `200` with the
        per-destination result); omit the body to unpublish from every destination
        (usually `204`, or `200` when the item was manually marked published). Only
        content-engine content can be unpublished. Requires the GEO product.
      operationId: orgUnpublishContent
      parameters:
        - name: id
          in: path
          required: true
          description: The content item's id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnpublishContentRequest"
            example:
              publish_record_ids:
                - 3f1a6d2e-8c4b-4a1e-9b7c-2d5e6f7a8b9c
      responses:
        "200":
          description: The targeted unpublish result (per-record or manual-mark path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnpublishContentResponse"
        "204":
          description: Every destination was unpublished. No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"

  /org/content/versions/{versionId}/reject:
    post:
      tags: [Content]
      summary: Reject a content version
